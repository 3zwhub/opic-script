    // 문장 속 키워드에 표시 (대소문자·따옴표 차이는 무시하고 찾음)
    markKw(text, kws) {
        const low = text.toLowerCase().replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/[—–]/g, '-');
        const ranges = kws.map(k => { const q = Kw.norm(k), i = low.indexOf(q); return i < 0 ? null : [i, i + q.length]; }).filter(Boolean).sort((a, b) => a[0] - b[0]);
        let out = '', pos = 0;
        ranges.forEach(([a, b]) => { if (a < pos) return; out += U.esc(text.slice(pos, a)) + '<mark class="kw-mark">' + U.esc(text.slice(a, b)) + '</mark>'; pos = b; });
        return out + U.esc(text.slice(pos));
    },

    REL_COLOR: { 이유: '#d97706', 결과: '#16a34a', 대조: '#e11d48', 구체화: '#2563eb', 위치: '#7c3aed', 같은: '#64748b' },

    // 연결 지도: 키워드를 문장 순서대로 세로로 놓고, 의미 관계를 왼쪽 호로 잇습니다
    kwMap(info, focus) {
        const nodes = [];
        info.sents.forEach((x, si) => x.kws.forEach(k => { if (!nodes.some(n => Kw.norm(n.k) === Kw.norm(k))) nodes.push({ k, si }); }));
        const idx = new Map(nodes.map((n, i) => [Kw.norm(n.k), i]));
        const RH = 30, TOP = 16, AX = 132, H = TOP * 2 + RH * Math.max(0, nodes.length - 1);
        const W = AX + 20 + Math.max(...nodes.map(n => n.k.length)) * 6.9 + 6;
        const y = i => TOP + i * RH, f = focus && Kw.norm(focus);
        const near = new Set(f ? [f] : []);
        info.edges.forEach(([a, b]) => { if (Kw.norm(a) === f) near.add(Kw.norm(b)); if (Kw.norm(b) === f) near.add(Kw.norm(a)); });
        let bands = '';
        for (let i = 0, start = 0; i <= nodes.length; i++) {
            if (i < nodes.length && nodes[i].si === nodes[start].si) continue;
            if (nodes[start].si % 2) bands += `<rect x="${AX - 6}" y="${y(start) - RH / 2}" width="${W - AX + 6}" height="${(i - start) * RH}" fill="#eff6ff"/>`;
            start = i;
        }
        const edges = info.edges.map(([a, b, r]) => {
            const i = idx.get(Kw.norm(a)), j = idx.get(Kw.norm(b));
            const y1 = y(Math.min(i, j)), y2 = y(Math.max(i, j)), dx = Math.min(AX - 12, 14 + Math.abs(i - j) * 11);
            const hot = f && (Kw.norm(a) === f || Kw.norm(b) === f);
            return `<path d="M${AX},${y1} C${AX - dx},${y1} ${AX - dx},${y2} ${AX},${y2}" fill="none" stroke="${Cards.REL_COLOR[r]}" stroke-width="2" ${r === '같은' ? 'stroke-dasharray="4 4"' : ''} opacity="${f && !hot ? 0.15 : 1}"><title>${U.esc(a)} — ${r} — ${U.esc(b)}</title></path>`;
        }).join('');
        const rows = nodes.map((n, i) => {
            const dim = f && !near.has(Kw.norm(n.k)) ? 0.25 : 1, first = !i || nodes[i - 1].si !== n.si;
            return `<g data-act="kw" data-kw="${U.esc(n.k)}" style="cursor:pointer" opacity="${dim}"><rect x="${AX - 8}" y="${y(i) - RH / 2}" width="${W - AX + 8}" height="${RH}" fill="transparent"/>
                <circle cx="${AX}" cy="${y(i)}" r="5" fill="#2563eb" stroke="#fff" stroke-width="2"/>
                <text x="${AX + 14}" y="${y(i) + 4.5}" font-size="13" fill="#1f2937" font-weight="${Kw.norm(n.k) === f ? 700 : 400}">${U.esc(n.k)}</text></g>
                ${first ? `<text x="${AX - 10}" y="${y(i) + 4}" font-size="11" fill="#9ca3af" text-anchor="end" opacity="${f ? 0 : 1}">${U.circled(n.si + 1)}</text>` : ''}`;
        }).join('');
        const legend = Object.entries(Cards.REL_COLOR).map(([r, c]) => `<span class="inline-flex items-center gap-1"><i style="display:inline-block;width:16px;height:0;border-top:3px ${r === '같은' ? 'dashed' : 'solid'} ${c}"></i>${r}</span>`).join('');
        let detail = '<p class="text-sm muted">키워드를 누르면 연결된 키워드와 원래 문장이 나옵니다.</p>';
        if (f) {
            const n = nodes[idx.get(f)], sent = info.sents[n.si].text;
            const rels = info.edges.filter(([a, b]) => Kw.norm(a) === f || Kw.norm(b) === f);
            detail = `<div class="reveal space-y-2">
                <div class="flex items-center gap-2"><span class="font-bold flex-1">${U.esc(n.k)} <span class="text-xs muted font-normal">문장 ${U.circled(n.si + 1)}</span></span>
                    <button class="btn btn-soft text-sm" ${UI.say(sent)}><i class="fas fa-volume-high"></i> 문장 듣기</button></div>
                <p class="text-sm">${Cards.markKw(sent, [n.k])}</p>
                <div class="space-y-1">${rels.map(([a, b, r]) => { const out = Kw.norm(a) === f, o = out ? b : a; return `<div class="flex items-center gap-2 text-sm flex-wrap">
                    <span class="chip" style="background:${Cards.REL_COLOR[r]};color:#fff;border-color:transparent">${r}</span>
                    <button class="chip" data-act="kw" data-kw="${U.esc(o)}">${U.esc(o)}</button><span class="text-xs muted">${out ? '이 키워드에서 이어짐' : '이 키워드로 이어짐'}</span></div>`; }).join('')}</div></div>`;
        }
        return `<div class="flex flex-wrap gap-x-3 gap-y-1 text-xs muted mb-2">${legend}</div>
            <div class="kw-map"><svg width="${Math.ceil(W)}" height="${H}" viewBox="0 0 ${Math.ceil(W)} ${H}" role="img" aria-label="키워드 연결 지도">${bands}${edges}${rows}</svg></div>
            <div class="mt-3">${detail}</div>
            <details class="mt-3"><summary class="text-sm muted cursor-pointer">연결 전체를 글로 보기 (${info.edges.length}개)</summary>
                <div class="space-y-1 mt-2 text-sm">${info.edges.map(([a, b, r]) => `<div>${U.esc(a)} <span class="chip" style="background:${Cards.REL_COLOR[r]};color:#fff;border-color:transparent">${r}</span> ${U.esc(b)}</div>`).join('')}</div></details>`;
    }
};

// =========================================================================
//  드릴: 콤보 점프 · 즉흥 · 모의고사. 진행기(Runner) 하나를 같이 씁니다.
//  문항마다 질문 듣기(최대 2회) → 녹음(목표 90~150초) → 모범답변 → 끝나면 체크리스트 자기평가
// =========================================================================
const Drill = {
    itemFromEl(t, name) {
        const info = Data.el(t, name);
        const q = Data.question(info);
        const topicType = Data.topicType(t);
        return {
            key: info.key, label: `${t.name} · ${name}`, info, qEn: q.en, qKo: q.ko,
            topicName: t.name, topicType, qType: info.type || Data.guessType(info),
            hint4: topicType === '공통형', script: info.scripts[0] || null
        };
    },
    itemFromScript(s, label, qType = 'RP') {
        return { key: 'q/' + s.id, label: label || `${s.id} · ${s.title}`, qEn: Parse.hasQuestion(s) ? s.question : '', qKo: s.title, topicName: Parse.scriptTopic(s), topicType: qType === 'RP' ? 'RP' : '기타', qType, script: s };
    },
    introItem() { return { key: 'intro', label: '1번 · 자기소개', qEn: INTRO_QUESTION, qKo: '자기소개 (채점하지 않음, 30~60초)', topicName: '자기소개', topicType: '자기소개', qType: '자기소개', script: null }; },

    combosOf(type, len) {
        return Data.topics(type).flatMap(t => t.combos.map((c, ci) => ({ t, c, ci }))).filter(x => !len || x.c.length === len);
    },
    // 콤보 문항에는 콤보와 순서를 붙여 둡니다 (답한 뒤 "다음 질문 예상"에 씀)
    comboItems(t, c) { return c.map((n, pos) => ({ ...Drill.itemFromEl(t, n), t, combo: c, pos })); },
    // 이 문항 다음에 올 수 있는 질문들 (콤보의 마지막이면 null)
    nextSet(it) {
        if (!it.combo || it.pos >= it.combo.length - 1) return null;
        const tree = Data.tree(it.t), c = it.combo;
        const role = c.length === 2 ? 'p' : it.pos === 0 ? '1' : '2';
        const next = c.length === 2 ? tree.pair.get(c[0]) : it.pos === 0 ? tree.as1.get(c[0]) : tree.q3by.get(c[0] + '|' + c[1]);
        return { role, set: new Set(next || []), key: Data.forkKey(it.t, role, c[it.pos]) };
    },

    rpPick(prefix) {
        const rp = Data.rpScripts().filter(s => s.title.startsWith(prefix));
        return U.pick(rp);
    },

    buildMock() {
        const items = [Drill.introItem()];
        const survey = U.shuffle(Drill.combosOf('서베이', 3));
        const first = survey[0], second = survey.find(x => x.t !== (first && first.t)) || survey[1];
        [first, second].filter(Boolean).forEach(x => items.push(...Drill.comboItems(x.t, x.c)));
        const common3 = U.pick(Drill.combosOf('공통형', 3));
        if (common3) items.push(...Drill.comboItems(common3.t, common3.c));
        ['11번', '12번', '13번'].forEach(p => { const s = Drill.rpPick(p); if (s) items.push(Drill.itemFromScript(s, `RP ${p} · ${s.title}`)); });
        const pairs = Drill.combosOf('공통형', 2).filter(x => x.t !== (common3 && common3.t));
        const adv = U.pick(pairs.filter(x => x.c.some(n => Data.el(x.t, n).adv1415))) || U.pick(pairs);
        if (adv) items.push(...Drill.comboItems(adv.t, adv.c));
        return items.map((it, i) => ({ ...it, label: `${i + 1}번 · ${it.label.replace(/^\d+번 · /, '')}` }));
    },

    // 즉흥 문항 풀
    improvPool(kind) {
        const els = Data.topics().flatMap(t => t.chain.map(n => ({ t, n })));
        let pool = els.map(x => () => Drill.itemFromEl(x.t, x.n));
        const typeOf = x => { const i = Data.el(x.t, x.n); return i.type || Data.guessType(i); };
        if (kind === 'common') pool = els.filter(x => Data.topicType(x.t) === '공통형').map(x => () => Drill.itemFromEl(x.t, x.n));
        if (kind === 'survey') pool = els.filter(x => Data.topicType(x.t) === '서베이').map(x => () => Drill.itemFromEl(x.t, x.n));
        if (kind === 'adv') pool = els.filter(x => ['비교', '이슈'].includes(typeOf(x))).map(x => () => Drill.itemFromEl(x.t, x.n));
        if (kind === 'rp') pool = Data.rpScripts().map(s => () => Drill.itemFromScript(s));
        return pool;
    },
    // 3단계 즉흥 기본 구성: 돌발 1 + 비교·이슈 또는 RP 1 + 무작위 1
    improvMix(n) {
        if (n !== 3) return U.shuffle(Drill.improvPool('all')).slice(0, n).map(f => f());
        const a = U.pick(Drill.improvPool('common')), b = U.pick(Math.random() < 0.5 ? Drill.improvPool('adv') : Drill.improvPool('rp')), c = U.pick(Drill.improvPool('all'));
        return [a, b, c].filter(Boolean).map(f => f());
    }
};

const DrillViews = {

        });

        let kind = DrillViews.improvKind || 'mix', n = DrillViews.improvN || 3;
        const draw = () => {
            el.innerHTML = `<div class="wrap">
                <div class="card mb-3 text-sm">질문만 보고 바로 답합니다. 돌발은 <b>4칸 틀</b>(일반 묘사 → 나의 습관 → 과거 비교 → 문제·기억)로 조립하고, 막히면 필러로 이어 가세요.</div>
                <div class="sec-title">문항 풀</div>
                <div class="seg mb-3">${kinds.map(([k, t]) => `<button data-act="kind" data-k="${k}" class="${kind === k ? 'on' : ''}">${t}</button>`).join('')}</div>
                <div class="sec-title">문항 수</div>
                <div class="seg mb-4">${[1, 3, 5].map(x => `<button data-act="n" data-n="${x}" class="${n === x ? 'on' : ''}">${x}개</button>`).join('')}</div>

            kind: b => { kind = DrillViews.improvKind = b.dataset.k; draw(); },

    mock(el) {
        UI.title('모의고사', true);
        el.innerHTML = `<div class="wrap"><div class="card">
            <div class="font-bold text-lg mb-2">15문항 · 40분 · 5-5 배치</div>
            <table class="text-sm w-full mb-4"><tbody>

                <tr><td class="py-1 pr-2 muted">8~10번</td><td>돌발 콤보</td></tr>
                <tr><td class="py-1 pr-2 muted">11~13번</td><td>롤플레이 (11 질문하기 · 12 대안 제시 · 13 관련 경험)</td></tr>
                <tr><td class="py-1 pr-2 muted">14~15번</td><td>돌발 14·15번 세트 (비교·이슈)</td></tr>
            </tbody></table>
            <p class="text-xs muted mb-4">번호별 배치는 공식 문서가 아닌 통설을 따릅니다. 질문은 최대 2번 들을 수 있고, 모범답변은 끝날 때까지 보이지 않습니다.</p>
            <button class="btn btn-primary w-full" data-act="start"><i class="fas fa-play"></i> 시작</button>
        </div></div>`;
        UI.bind(el, { start: () => { TTS.unlock(); Runner.mount(el, Drill.buildMock(), { mode: 'mock', showModel: false, totalSec: MOCK_TOTAL_SEC, onExit: () => { location.hash = '#/records'; } }); } });
    }
};

// ---------------- 진행기 ----------------
const Runner = {
    mount(el, items, opts = {}) {
        UI.busy = true;
        const started = Date.now();
        const sessionTag = U.uid();
        const results = items.map(() => ({ rec: null, durationSec: 0, listens: 0 }));
        let i = 0, showModel = false, showKo = false, timer = null, stopwatchStart = 0, finished = false;

        const remaining = () => opts.totalSec ? opts.totalSec - (Date.now() - started) / 1000 : null;
        const recording = () => Rec.isRecording() || stopwatchStart > 0;
        const clearTimer = () => { if (timer) clearInterval(timer); timer = null; };
        UI.onTeardown(() => { clearTimer(); });

        const tick = () => {
            const tEl = el.querySelector('#rTimer');
            if (tEl && recording()) {
                const sec = Rec.isRecording() ? Rec.elapsed() : (Date.now() - stopwatchStart) / 1000;
                tEl.textContent = U.fmtSec(sec); tEl.className = 'timer ' + UI.durClass(sec);
            }
            const r = remaining(), rEl = el.querySelector('#rRemain');
            if (rEl && r !== null) { rEl.textContent = U.fmtSec(r); if (r <= 0 && !finished) { UI.toast('40분이 지났습니다. 자기평가로 넘어갑니다'); stopAndFinish(); } }
        };
        const ensureTimer = () => { if (!timer) timer = setInterval(tick, 250); };

        const speakQuestion = () => {
            const it = items[i];
            if (!it.qEn) return;
            if (opts.mode === 'mock' && results[i].listens >= 2) { UI.toast('질문은 두 번까지 들을 수 있습니다'); return; }
            results[i].listens++;
            TTS.play(it.qEn, 'once', { title: it.label });
            draw();
        };

        const draw = () => {
            UI.sayMap.clear();
            const it = items[i], r = results[i];
            const rem = remaining();
            const kw = it.info && it.info.K ? it.info.K.split(',').map(s => s.trim()).filter(Boolean) : [];
            el.innerHTML = `<div class="wrap space-y-3">
                <div class="flex items-center justify-between text-sm">
                    <span class="font-bold">${i + 1} / ${items.length}</span>
                    ${rem !== null ? `<span class="chip"><i class="fas fa-hourglass-half"></i> <span id="rRemain">${U.fmtSec(rem)}</span></span>` : ''}
                    <button class="btn btn-gray text-xs" data-act="quit">그만하기</button>
                </div>
                <div class="bar"><span style="width:${Math.round(i / items.length * 100)}%"></span></div>
                <div class="card">
                    <div class="flex items-center gap-2 mb-2 flex-wrap"><span class="text-xs muted">${U.esc(it.label)}</span>${it.qType && it.qType !== '자기소개' ? U.typeChip(it.qType) : ''}</div>
                    ${it.qEn ? `<p class="text-lg font-medium mb-3 ${opts.mode === 'mock' && !showKo ? 'blur-sm select-none' : ''}" id="qText">${U.esc(it.qEn)}</p>` : `<p class="text-lg font-medium mb-2">${U.esc(it.qKo)}</p><p class="text-xs muted mb-3">영어 질문이 없는 문항이라 한국어로 보여 줍니다</p>`}
                    <div class="flex flex-wrap gap-2">
                        ${it.qEn ? `<button class="btn btn-soft text-sm" data-act="listen"><i class="fas fa-volume-high"></i> 질문 듣기 ${opts.mode === 'mock' ? `(${r.listens}/2)` : ''}</button>` : ''}
                        ${it.qEn ? `<button class="btn btn-gray text-sm" data-act="ko">${opts.mode === 'mock' ? (showKo ? '질문 가리기' : '질문 보기') : (showKo ? '한국어 닫기' : '한국어 보기')}</button>` : ''}
                    </div>
                    ${showKo && it.qEn && opts.mode !== 'mock' ? `<p class="text-sm muted mt-2">${U.esc(it.qKo)}</p>` : ''}
                </div>
                ${it.hint4 ? `<details class="card text-sm"><summary class="font-semibold cursor-pointer">4칸 틀 힌트</summary><div class="grid grid-cols-2 gap-2 mt-2">${FOUR_SLOT.map(f => `<div class="reveal"><b>${f.name}</b><div class="text-xs muted">${U.esc(f.hint)}</div></div>`).join('')}</div></details>` : ''}
                ${opts.mode !== 'mock' && it.info && kw.length ? `<details class="card text-sm"><summary class="font-semibold cursor-pointer">답변 키워드 (막히면)</summary>
                    <div class="flex flex-wrap gap-1 mt-2">${kw.map(k => `<span class="chip chip-blue">${U.esc(k)}</span>`).join('')}</div></details>` : ''}
                <div class="card text-center">
                    ${recording() ? `<div class="flex items-center justify-center gap-2 mb-1"><span class="rec-dot"></span><span class="text-sm muted">${Rec.isRecording() ? '녹음 중' : '시간 재는 중'}</span></div>
                        <div id="rTimer" class="timer under">0:00</div>
                        <div class="text-xs muted mb-3">목표 ${U.fmtSec(ANSWER_TARGET.min)}~${U.fmtSec(ANSWER_TARGET.max)}</div>
                        <button class="btn btn-red w-full" data-act="stop"><i class="fas fa-stop"></i> 답변 끝</button>`
                    : r.done ? `<div class="mb-2">답변 ${UI.durChip(r.durationSec)}</div>
                        ${r.rec && r.rec.blob ? `<audio controls src="${UI.audioUrl(r.rec.blob)}" class="w-full mb-3"></audio>` : ''}
                        <div class="grid grid-cols-2 gap-2"><button class="btn btn-gray" data-act="again">다시 답하기</button>
                        <button class="btn btn-primary" data-act="next">${i < items.length - 1 ? '다음 문항' : '자기평가로'} <i class="fas fa-chevron-right"></i></button></div>`
                    : `<button class="btn btn-red w-full py-4 text-lg" data-act="record"><i class="fas fa-microphone"></i> ${Rec.supported() ? '녹음하며 답하기' : '타이머 시작'}</button>
                        ${Rec.supported() ? '<button class="btn btn-gray w-full mt-2 text-sm" data-act="watch">녹음 없이 시간만 재기</button>' : ''}
                        ${opts.mode !== 'mock' ? '<button class="btn btn-gray w-full mt-2 text-sm" data-act="skip">건너뛰기</button>' : ''}`}
                </div>
                ${r.done && !recording() ? predictHtml(it, r) : ''}
                ${opts.showModel && r.done && !recording() ? `<button class="btn btn-soft w-full" data-act="model">${showModel ? '모범답변 닫기' : '모범답변 보기'}</button>
                    ${showModel ? `<div class="card">${it.script ? UI.answerHtml(it.script) : '<p class="missing">연결된 모범답변이 없습니다</p>'}</div>` : ''}` : ''}
            </div>`;
            if (recording() || remaining() !== null) ensureTimer();
            tick();
        };

        // 답한 뒤 "다음 질문 예상" (설정에서 끌 수 있음). 시험장에서 할 일을 그대로 연습합니다
        const predictHtml = (it, r) => {
            const ns = Settings.v.predictInDrill === false ? null : Drill.nextSet(it);
            if (!ns) return '';
            const p = r.pred || (r.pred = { sel: new Set(), grade: null });
            const fork = Data.forks(it.t).find(f => f.key === ns.key);
            return `<div class="card">
                <div class="text-sm font-semibold mb-2">다음 질문 예상 <span class="muted font-normal">(가능한 것 모두)</span></div>
                ${Predict.chips(it.t, it.info.name, p.sel, p.grade && ns.set)}
                ${p.grade ? `<div class="mt-2">${Predict.revealCard(fork || { info: it.info, role: ns.role, scene: '' }, ns.set, p.grade)}</div>`
                    : `<button class="btn btn-soft w-full mt-2 text-sm" data-act="pcheck" ${p.sel.size ? '' : 'disabled'}>예상 확인</button>`}
            </div>`;
        };

        const stopAndFinish = async () => {
            if (Rec.isRecording()) await stopRecording(); else if (stopwatchStart) stopWatch();
            finish();
        };

        const stopRecording = async () => {
            const res = await Rec.stop();
            if (!res) return;
            const it = items[i];
            const rec = await Rec.save({ mode: opts.mode, itemKey: it.key, label: it.label, topicName: it.topicName, topicType: it.topicType, qType: it.qType, sessionTag }, res);
            results[i].rec = rec; results[i].durationSec = rec.durationSec; results[i].done = true;
        };
        const stopWatch = () => { results[i].durationSec = Math.round((Date.now() - stopwatchStart) / 1000); results[i].done = true; stopwatchStart = 0; };

        const go = (delta) => {
            TTS.stop(false);
            i += delta; showModel = false; showKo = false;
            if (i >= items.length) { finish(); return; }
            draw();
            if (Settings.v.autoQuestion && items[i].qEn && results[i].listens === 0) speakQuestion();
        };

        const finish = () => {
            if (finished) return; finished = true;
            clearTimer(); TTS.stop(false);
            Review.mount(el, items, results, { ...opts, started, sessionTag });
        };

        UI.bind(el, {
            listen: speakQuestion,
            ko: () => { showKo = !showKo; draw(); },
            record: async () => {
                if (!Rec.supported()) { stopwatchStart = Date.now(); draw(); return; }
                try { await Rec.start(); draw(); }
                catch (e) { UI.toast('마이크를 쓸 수 없어 시간만 잽니다: ' + e.message); stopwatchStart = Date.now(); draw(); }
            },
            watch: () => { TTS.stop(false); stopwatchStart = Date.now(); draw(); },
            stop: async () => { if (Rec.isRecording()) await stopRecording(); else stopWatch(); draw(); },
            again: () => { results[i].durationSec = 0; results[i].rec = null; results[i].done = false; draw(); },
            next: () => go(1),
            skip: () => go(1),
            chip: b => { const p = results[i].pred; if (!p || p.grade) return; const n = b.dataset.n; p.sel.has(n) ? p.sel.delete(n) : p.sel.add(n); draw(); },
            pcheck: async () => {
                const ns = Drill.nextSet(items[i]), p = results[i].pred;
                if (!ns || !p) return;
                p.grade = Predict.judge(p.sel, ns.set);
                draw();
                SRS.grade(ns.key, p.grade).catch(e => console.error('채점 저장 실패', e));
            },
            model: () => { showModel = !showModel; draw(); },
            quit: async () => {
                if (!await UI.confirm('그만하기', '지금까지 답한 문항만 자기평가하고 끝낼까요?', '그만하기')) return;
                stopAndFinish();
            }
        });
        draw();
        if (Settings.v.autoQuestion && items[0].qEn) speakQuestion();
    }
};

const Review = {
    mount(el, items, results, opts) {
        UI.busy = true;
        UI.title('자기평가', true);
        const done = items.map((it, i) => ({ it, r: results[i] })).filter(x => x.r.done);
        const checks = done.map(() => AL_CHECKLIST.map(() => false));
        const stars = done.map(() => false);
        UI.sayMap.clear();
        el.innerHTML = `<div class="wrap space-y-3">
            <div class="card text-sm">녹음을 들으며 항목마다 해당하는 것만 체크하세요. 이 점수로 단계 통과 여부와 유형별 약점을 계산합니다.</div>
            ${done.length ? done.map(({ it, r }, k) => `<div class="card">
                <div class="flex items-center justify-between gap-2 mb-1"><span class="font-semibold text-sm">${U.esc(it.label)}</span>${UI.durChip(r.durationSec)}</div>
                ${it.qEn ? `<p class="text-xs muted mb-2">${U.esc(it.qEn)}</p>` : ''}
                ${r.rec && r.rec.blob ? `<audio controls src="${UI.audioUrl(r.rec.blob)}" class="w-full mb-2"></audio>` : ''}
                ${AL_CHECKLIST.map((c, ci) => `<label class="check-row text-sm"><input type="checkbox" data-k="${k}" data-c="${ci}"> <span>${U.esc(c)}</span></label>`).join('')}
                <div class="flex justify-between items-center mt-2">
                    <button class="btn btn-gray text-xs" data-act="star" data-k="${k}"><i class="far fa-star"></i> 보관</button>
                    ${it.script ? `<button class="btn btn-soft text-xs" data-act="model" data-k="${k}">모범답변</button>` : ''}
                </div>
                <div id="model-${k}"></div>
            </div>`).join('') : '<div class="card missing">답한 문항이 없습니다</div>'}
            <button class="btn btn-primary w-full" data-act="save">저장하고 끝내기</button>
        </div>`;
        el.scrollTop = 0;
        el.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => { checks[cb.dataset.k][cb.dataset.c] = cb.checked; });
        UI.bind(el, {
            star: b => { const k = b.dataset.k; stars[k] = !stars[k]; b.innerHTML = `<i class="${stars[k] ? 'fas' : 'far'} fa-star"></i> ${stars[k] ? '보관함' : '보관'}`; },
            model: b => { const box = el.querySelector('#model-' + b.dataset.k); box.innerHTML = box.innerHTML ? '' : `<div class="mt-3">${UI.answerHtml(done[b.dataset.k].it.script)}</div>`; },
            save: async () => {
                const entries = [];
                for (let k = 0; k < done.length; k++) {
                    const { it, r } = done[k];
                    const score = checks[k].filter(Boolean).length;
                    if (r.rec) { r.rec.checklist = checks[k]; r.rec.starred = stars[k]; await DB.put('recordings', r.rec); }
                    entries.push({ recId: r.rec ? r.rec.id : null, label: it.label, qType: it.qType, topicType: it.topicType, durationSec: r.durationSec, checklist: checks[k], score });
                }
                const scored = entries.filter(e => e.qType !== '자기소개');
                const session = {
                    date: U.today(), startedAt: opts.started, mode: opts.mode, minutes: Math.round((Date.now() - opts.started) / 6000) / 10,
                    items: entries, avgScore: scored.length ? Math.round(scored.reduce((a, e) => a + e.score, 0) / scored.length * 10) / 10 : 0,
                    complete: opts.mode !== 'mock' || entries.length >= 12
                };
                session.id = await DB.put('sessions', session);
                UI.busy = false;
                UI.toast('저장했습니다');
                if (opts.onFinish) opts.onFinish(session);
                else if (opts.onExit) opts.onExit(session);
                else history.back();
            }
        });
    }
};

const Progress = {
    async load() {
        const sessions = (await DB.all('sessions')).sort((a, b) => (a.startedAt || 0) - (b.startedAt || 0));
        const items = sessions.flatMap(s => (s.items || []).map(it => ({ ...it, date: s.date, at: s.startedAt, mode: s.mode })));
        return { sessions, items };
    },
    // 1단계 기준: 서베이 갈림길 카드 ("이 질문 다음엔?")
    surveyKeys() { return Data.allForks('서베이').map(f => f.key); },

    gate(stage, p) {
        if (stage === 1) {
            const keys = this.surveyKeys(), m = keys.filter(k => SRS.mastered(k)).length;
            return { ok: m / keys.length >= 0.9, ratio: m / keys.length, text: `서베이 갈림길 숙련 ${m}/${keys.length}` };
        }
        if (stage === 2) {
            const last = p.items.filter(x => x.topicType === '서베이').slice(-5);
            const good = last.filter(x => x.durationSec >= ANSWER_TARGET.min).length;
            return { ok: last.length === 5 && good === 5, ratio: good / 5, text: `최근 서베이 답변 5개 중 90초 이상 ${good}개` };
        }
        if (stage === 3) {
            const last = p.items.filter(x => x.topicType === '공통형').slice(-5);
            const good = last.filter(x => x.durationSec >= ANSWER_TARGET.min && x.checklist && x.checklist[0]).length;
            return { ok: last.length === 5 && good >= 4, ratio: Math.min(good / 4, 1), text: `최근 돌발 답변 5개 중 90초 이상 + 시제 유지 ${good}개 (4개 필요)` };
        }
        const mocks = p.sessions.filter(s => s.mode === 'mock' && s.complete).slice(-2);
        const good = mocks.filter(s => s.avgScore >= 4).length;
        return { ok: mocks.length === 2 && good === 2, ratio: good / 2, text: `최근 모의고사 2회 중 평균 4/5 이상 ${good}회` };
    },

    streak(p) {
        const days = new Set(p.sessions.map(s => s.date));
        let n = 0, off = days.has(U.today()) ? 0 : -1;
        while (days.has(U.today(off - n))) n++;
        return n;
    },
    minutes(p, days) {
        const from = U.today(-(days - 1));
        return Math.round(p.sessions.filter(s => s.date >= from).reduce((a, s) => a + (s.minutes || 0), 0));
    },
    byType(p) {
        const out = {};
        p.items.filter(x => x.qType && x.qType !== '자기소개').forEach(x => {
            const o = out[x.qType] || (out[x.qType] = { n: 0, score: 0, dur: 0 });
            o.n++; o.score += x.score || 0; o.dur += x.durationSec || 0;
        });
        return Object.entries(out).map(([type, o]) => ({ type, n: o.n, score: o.score / o.n, dur: o.dur / o.n })).sort((a, b) => a.score - b.score);
    }
};

const Routine = {
    mount(el, len) {
        UI.title(`${len}분 루틴`, true);
        UI.busy = true;
        const stage = Settings.v.stage;
        const started = Date.now();
        const steps = [
            { name: '복습', min: 5, run: Routine.review },
            { name: '말하기', min: len === 25 ? 12 : 5, run: (box, next) => Routine.speak(box, next, stage, len) },
            ...(len === 25 ? [{ name: '기록', min: 2, run: Routine.note }] : [])
        ];
        let si = 0, stepStart = Date.now(), timer = null;
        el.innerHTML = `<div class="wrap" style="padding-bottom:0"><div class="card" style="padding:10px 12px">
            <div class="flex items-center gap-2 text-xs" id="rtSteps"></div>
            <div class="flex items-center justify-between mt-1"><span class="font-bold" id="rtName"></span><span class="chip" id="rtClock"></span>
            <button class="btn btn-gray text-xs" id="rtSkip">다음 단계 ▶</button></div></div></div><div id="rtBody"></div>`;
        const body = el.querySelector('#rtBody');
        const head = () => {
            el.querySelector('#rtSteps').innerHTML = steps.map((s, k) => `<span class="${k === si ? 'font-bold text-blue-600' : k < si ? 'text-green-600' : 'muted'}">${k < si ? '✓ ' : ''}${s.name} ${s.min}분</span>`).join('<span class="muted">→</span>');
            el.querySelector('#rtName').textContent = steps[si] ? steps[si].name : '끝';
        };
        const tick = () => {
            const s = steps[si]; if (!s) return;
            const left = s.min * 60 - (Date.now() - stepStart) / 1000;
            const c = el.querySelector('#rtClock'); if (!c) return;
            c.textContent = left >= 0 ? `남은 ${U.fmtSec(left)}` : `권장 시간 +${U.fmtSec(-left)}`;
            c.className = left >= 0 ? 'chip' : 'chip chip-amber';
        };
        timer = setInterval(tick, 500);
        UI.onTeardown(() => clearInterval(timer));
        const next = async () => {
            TTS.stop(false);
            si++; stepStart = Date.now();
            if (si >= steps.length) {
                clearInterval(timer); UI.busy = false;
                await DB.put('sessions', { date: U.today(), startedAt: started, mode: 'routine' + len, minutes: 0, totalMinutes: Math.round((Date.now() - started) / 60000) });
                el.innerHTML = `<div class="wrap"><div class="card text-center"><div class="text-3xl mb-2">✅</div><div class="font-bold text-lg mb-1">오늘 루틴 끝</div>
                    <div class="text-sm muted mb-4">${Math.round((Date.now() - started) / 60000)}분</div><button class="btn btn-primary" id="rtDone">오늘 화면으로</button></div></div>`;
                el.querySelector('#rtDone').onclick = () => { location.hash = '#/today'; };
                return;
            }
            head(); tick();
            steps[si].run(body, next);
            UI.busy = true;
        };
        el.querySelector('#rtSkip').onclick = () => { if (Rec.isRecording()) Rec.cancel(); next(); };
        head(); tick();
        steps[0].run(body, next);
    },

    review(box, next) {
        const due = Palace.dueForks().slice(0, 15);
        if (due.length) { Predict.cards(box, due, { scope: '*due', onDone: next }); return; }
        const exprDue = SRS.dueKeys([...Data.expressions.map(x => x.key), ...Stuck.list().map(x => x.key)]).length;
        box.innerHTML = `<div class="wrap"><div class="card text-center"><p class="mb-3">복습할 갈림길이 없습니다.${exprDue ? ` 표현 카드 ${exprDue}장이 남아 있습니다.` : ''}</p>
            <button class="btn btn-primary" id="rvNext">말하기로</button></div></div>`;
        box.querySelector('#rvNext').onclick = next;
    },

    speak(box, next, stage, len) {
        const count = len === 25 ? 3 : 1;
        const run = items => Runner.mount(box, items, { mode: 'routine', showModel: true, onExit: next, onFinish: next });
        if (stage === 1) {
            // 아직 안 배운 갈림길이 있는 첫 방(동선 순서)을 골라 갈림길을 익히고, 그 방의 콤보 하나를 답해 봅니다
            const t = Palace.houseTopics().find(x => Data.forks(x).some(f => !SRS.get(f.key))) || U.pick(Data.topics('서베이'));
            const fresh = Data.forks(t).filter(f => !SRS.get(f.key)).slice(0, len === 25 ? 6 : 3);
            const thenSpeak = () => { const c = U.pick(t.combos.filter(x => x.length === 3)) || t.combos[0]; run(len === 25 ? Drill.comboItems(t, c) : Drill.comboItems(t, c).slice(0, 1)); };
            if (fresh.length) { Predict.cards(box, fresh, { newLimit: fresh.length, onDone: thenSpeak }); return; }
            thenSpeak();
            return;
        }
        if (stage === 2) {
            const x = U.pick(Drill.combosOf('서베이', len === 25 ? 3 : 0).length ? Drill.combosOf('서베이', len === 25 ? 3 : 0) : Drill.combosOf('서베이'));
            run(len === 25 ? Drill.comboItems(x.t, x.c) : [Drill.itemFromEl(x.t, x.c[0])]);
            return;
        }
        run(len === 25 ? Drill.improvMix(3) : [U.pick(Drill.improvPool('common'))()]);
    },

    note(box, next) {
        box.innerHTML = `<div class="wrap"><div class="card">
            <div class="font-bold mb-1">막힌 표현 적기</div>
            <p class="text-xs muted mb-2">방금 녹음에서 막히거나 한국어로 떠오른 표현을 한 줄에 하나씩 적으세요. '영어 = 뜻' 형식이면 뜻도 저장됩니다. 블록 카드에서 복습합니다.</p>
            <div class="field mb-3"><textarea id="ntText" rows="5" placeholder="It slipped my mind = 깜빡했다&#10;be swamped with = ~로 정신없이 바쁘다"></textarea></div>
            <button class="btn btn-primary w-full" id="ntSave">저장하고 끝내기</button></div></div>`;
        box.querySelector('#ntSave').onclick = () => {
            const lines = box.querySelector('#ntText').value.split('\n').map(l => l.trim()).filter(Boolean);
            lines.forEach(l => { const [en, ko] = l.split('='); Stuck.add(en || '', ko || ''); });
            if (lines.length) UI.toast(`막힌 표현 ${lines.length}개를 카드에 추가했습니다`);
            next();
        };
    }
};

                const sc = seed.find(x => x.id === id); if (!sc) { bad.push(id + ' 스크립트 없음'); return; }
                const sents = U.sentences(sc.answer), have = new Set();
                Object.entries(b.lines).forEach(([n, ks]) => ks.forEach(k => { kws++; have.add(Kw.norm(k)); if (!sents[n - 1] || !Kw.norm(sents[n - 1]).includes(Kw.norm(k))) bad.push(`${id}:${n} ${k}`); }));
                b.edges.forEach(([a, c]) => { edges++; if (!have.has(Kw.norm(a)) || !have.has(Kw.norm(c))) bad.push(`${id} 연결 ${a} > ${c}`); });
            });
            const q1 = Kw.forScript(seed.find(x => x.id === 'Q001')), q2 = Kw.forScript(seed.find(x => x.id === 'Q002'));
            const share = q1.edges.length > 5 && q2.edges.length === q1.edges.length && q1.sents.every(x => x.kws.length);
            return [!bad.length && kws > 2000 && share, `블록 ${Object.keys(blocks).length}, 키워드 ${kws}, 연결 ${edges}, Q001 연결 ${q1.edges.length} / Q002 ${q2.edges.length}, 문제 ${bad.slice(0, 5).join(' | ')}`];
        });
        await tryCheck('답변 암기 화면: 문장 키워드·첫 글자 재생, 연결 지도', async () => {
            const errs = [], keep = Cards.mode;
            const at = async m => { Cards.mode = m; history.replaceState(null, '', '#/drill/cards/answer/Q004'); await UI.render(); return UI.el; };
            let v = await at('sent');
            const chip = v.querySelector('.kw-chip[data-say]'), row = chip && chip.closest('[data-say-row]');
            if (!chip || !row || row.dataset.sayRow !== chip.dataset.say || UI.sayMap.get(chip.dataset.say) !== U.sentences(Data.byKey.get('Q004').answer)[0]) errs.push('문장 키워드 칩이 그 문장을 읽지 않음');
            if (!v.querySelector('.kw-mark')) errs.push('문장 속 키워드 표시 없음');
            v = await at('first');
            if (v.querySelectorAll('.sentence[data-say]').length !== U.sentences(Data.byKey.get('Q004').answer).length) errs.push('첫 글자 문장에 재생 연결 안 됨');
            v = await at('map');
            if (!v.querySelector('.kw-map svg path') || !v.querySelector('[data-act="kw"]')) errs.push('연결 지도 없음');
            v.querySelector('[data-act="kw"]').dispatchEvent(new MouseEvent('click', { bubbles: true }));
            if (!v.querySelector('.reveal [data-say]')) errs.push('키워드를 눌러도 문장 듣기가 안 나옴');
            v = await at('keys');
            if (v.querySelector('.missing')) errs.push('키워드만 화면이 비어 있음');
            Cards.mode = keep; UI.teardown();
            return [!errs.length, errs.join(' || ')];
        });
        if (typeof SelfTest.extra === 'function') await SelfTest.extra(tryCheck, check);

        const pass = results.every(r => r.ok);
        document.title = pass ? 'SELFTEST PASS' : 'SELFTEST FAIL';
        const pre = document.createElement('pre'); pre.id = 'selftest';
        pre.textContent = JSON.stringify({ pass, results }, null, 1);
        document.getElementById('view').innerHTML = ''; document.getElementById('view').appendChild(pre);
    }
};

// 자체 점검: 드릴 흐름 (클릭을 흉내 냅니다)
SelfTest.extra = async (tryCheck) => {
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const waitFor = async (cond, tries = 60) => { for (let k = 0; k < tries && !cond(); k++) await wait(50); return cond(); };
    const click = async (root, act, extra = '') => {
        const b = root.querySelector(`[data-act="${act}"]${extra}`);
        if (!b) throw new Error(`버튼 없음: ${act}${extra} / 있는 버튼: ${[...root.querySelectorAll('[data-act]')].map(x => x.dataset.act).join(',')} / 화면: ${root.textContent.replace(/\s+/g, ' ').slice(0, 300)}`);
        b.click(); await wait(60);
    };

    await tryCheck('모의고사 15문항 구성 (5-5 배치)', () => {
        const m = Drill.buildMock();
        const rp = m.slice(10, 13).every(x => x.topicType === 'RP');
        const survey = m.slice(1, 7).every(x => x.topicType === '서베이');
        const common = m.slice(7, 10).every(x => x.topicType === '공통형') && m.slice(13, 15).every(x => x.topicType === '공통형');
        return [m.length === 15 && m[0].key === 'intro' && rp && survey && common, `${m.length}문항 / ${m.map(x => x.topicType).join(',')}`];
    });
    await tryCheck('즉흥 3단계 구성: 돌발 1 + 비교·이슈/RP 1 + 무작위 1', () => {
        const m = Drill.improvMix(3);
        return [m.length === 3 && m[0].topicType === '공통형', m.map(x => `${x.topicType}:${x.qType}`).join(', ')];
    });
    await tryCheck('진행기 → 자기평가 → 세션 저장 (녹음 없이 시간만)', async () => {
        const box = document.createElement('div'); document.body.appendChild(box);
        const t = Data.topic('집');
        let saved = null;
        const autoQ = Settings.v.autoQuestion; Settings.v.autoQuestion = false;
        Runner.mount(box, Drill.comboItems(t, t.combos[0]).slice(0, 2), { mode: 'selftest', showModel: true, onFinish: s => { saved = s; } });
        for (let k = 0; k < 2; k++) {
            await click(box, Rec.supported() ? 'watch' : 'record');
            await click(box, 'stop');
            if (k === 0) { await click(box, 'model'); if (!/전체 듣기/.test(box.textContent)) throw new Error('모범답변이 안 보임'); }
            await click(box, 'next');
        }
        box.querySelector('input[data-k="0"][data-c="0"]').click();
        await click(box, 'save'); await waitFor(() => saved, 300);
        Settings.v.autoQuestion = autoQ;
        box.remove();
        const ok = saved && saved.items.length === 2 && saved.items[0].checklist[0] === true && saved.items[0].score === 1;
        if (saved) await DB.del('sessions', saved.id);
        return [ok, saved ? `문항 ${saved.items.length}, 첫 문항 점수 ${saved.items[0].score}, 라벨 ${saved.items[0].label}` : '저장 안 됨'];
    });
    await tryCheck('주제 순서 (서베이 8 · 돌발 20 · 동네 길 번호 · 표현 모음)', () => {
        const s = Data.topics('서베이').map(t => t.name).join(','), c = Data.topics('공통형').map(t => t.name).join(',');
        const S = '집,음악,국내여행,해외여행,집휴가,영화,TV,쇼핑';
        const C = '가구,재활용,산업,음식점,모임,식품(추정),건강,지형,인터넷,전화기,기술,날씨,교통,패션,은행,호텔,예약,자유시간,휴일,가족친구';
        const places = Data.topics('공통형').every((t, i) => Data.place(t).startsWith(`동네 길 ${i + 1} `));
        const exprTopics = [...new Set(Data.expressions.map(x => x.topic))].join(',');
        const exprOk = exprTopics === C.split(',').filter(n => exprTopics.split(',').includes(n)).join(',');
        const palaceOk = Palace.houseTopics().map(t => t.name).join(',') === S;
        return [s === S && c === C && places && exprOk && palaceOk, `서베이 ${s} | 돌발 ${c} | 길 번호 ${places} | 표현 ${exprTopics}`];
    });
    await tryCheck('갈림길 트리 계산 (집, 경로 기준)', () => {
        const t = Data.topic('집'), tr = Data.tree(t);
        const j = x => (x || []).join(',');
        const ok = j(tr.as1.get('집')) === '일과,예전집,문제들' && j(tr.q3by.get('집|일과')) === '예전집,문제들'
            && j(tr.q3by.get('집|예전집')) === '변화,추억' && j(tr.q3by.get('집|문제들')) === '문제1' && j(tr.pair.get('부모')) === '집구하기'
            && Data.roles(t, '변화').length === 0;
        return [ok, `집→${j(tr.as1.get('집'))} | 예전집→${j(tr.q3by.get('집|예전집'))} | 부모→${j(tr.pair.get('부모'))}`];
    });
    await tryCheck('갈림길 카드 수와 장면 데이터 (장면의 → 후보 = 트리)', () => {
        const s = Data.allForks('서베이'), c = Data.allForks('공통형');
        const bad = [...s, ...c].filter(f => {
            if (!f.scene) return true;
            const got = f.scene.split('→').pop().replace(/\(.*?\)\s*$/, '').split('/').map(x => x.trim()).filter(Boolean);
            return got.join(',') !== f.next.join(',');
        }).map(f => `${f.t.name}/${f.name}/${f.role}`);
        const shop = Data.roles(Data.topic('쇼핑'), '루틴').map(r => r.role).join('');
        return [s.length === 41 && c.length === 103 && !bad.length && shop === '12', `서베이 ${s.length}, 돌발 ${c.length}, 장면 문제 ${bad.length}건 ${bad.slice(0, 5).join(' ')} · 쇼핑 루틴 역할 ${shop}`];
    });
    await tryCheck('다음 질문 맞히기: 칩 선택 → 확인 → 정확 채점 → 다음 복습 내일', async () => {
        const box = document.createElement('div'); document.body.appendChild(box);
        const t = Data.topic('집'), f = Data.forks(t).find(x => x.name === '집' && x.role === '1');
        let done = false;
        Predict.cards(box, [f], { newLimit: 5, onDone: () => { done = true; } });
        for (const n of ['일과', '예전집', '문제들']) await click(box, 'chip', `[data-n="${n}"]`);
        await click(box, 'check');
        await waitFor(() => /정확/.test(box.textContent));
        const graded = /정확/.test(box.textContent), sawScene = /열쇠로 문을 열자/.test(box.textContent);
        const card = SRS.get(f.key);
        await click(box, 'next'); await waitFor(() => /갈림길 1개 끝/.test(box.textContent));
        await click(box, 'done');
        const ok = graded && sawScene && card && card.due === U.today(1) && done;
        await DB.del('cards', f.key); SRS.cards.delete(f.key);
        UI.busy = false; box.remove();
        return [ok, `정확 ${graded}, 장면 ${sawScene}, 다음 복습 ${card && card.due}, 끝 콜백 ${done}`];
    });
    await tryCheck('콤보 흐름: 예측 → 공개 → 실제 다음 질문 → 콤보 끝', async () => {
        const box = document.createElement('div'); document.body.appendChild(box);
        const autoQ = Settings.v.autoQuestion; Settings.v.autoQuestion = false;
        Predict.flow(box, [Data.topic('기술')]);
        let steps = 0;
        while (!/콤보 끝/.test(box.textContent) && steps < 4) {
            const chip = box.querySelector('[data-act="chip"]'); chip.click(); await wait(40);
            await click(box, 'check'); await waitFor(() => /실제 다음 질문/.test(box.textContent));
            await click(box, 'go'); steps++;
        }
        const ended = /콤보 끝/.test(box.textContent);
        for (const k of [...SRS.cards.keys()].filter(k => k.startsWith('fork/기술/'))) { await DB.del('cards', k); SRS.cards.delete(k); }
        Settings.v.autoQuestion = autoQ; UI.busy = false; box.remove();
        return [ended && steps >= 1, `예측 ${steps}회, 끝 ${ended}`];
    });
    await tryCheck('드릴에서 답한 뒤 다음 질문 예상', async () => {
        const box = document.createElement('div'); document.body.appendChild(box);
        const t = Data.topic('집'), c = t.combos[0];   // 집 / 일과 / 예전집
        const autoQ = Settings.v.autoQuestion; Settings.v.autoQuestion = false;
        Runner.mount(box, Drill.comboItems(t, c), { mode: 'selftest', showModel: true, onFinish: () => {} });
        await click(box, Rec.supported() ? 'watch' : 'record'); await click(box, 'stop');
        const shown = /다음 질문 예상/.test(box.textContent);
        for (const n of ['일과', '예전집', '문제들']) await click(box, 'chip', `[data-n="${n}"]`);
        await click(box, 'pcheck'); await waitFor(() => /정확/.test(box.textContent));
        const ok = shown && /정확/.test(box.textContent);
        const k = Data.forkKey(t, '1', '집'); await DB.del('cards', k); SRS.cards.delete(k);
        Rec.cancel(); Settings.v.autoQuestion = autoQ; UI.busy = false; box.remove();
        return [ok, `예상 칸 ${shown}, 채점 ${/정확/.test(box.textContent)}`];
    });
    // 녹음은 실제 시간이 흘러야 해서 가상 시간 headless 실행에서는 건너뜁니다 (?selftest=rec 로 따로 실행)
    if (new URLSearchParams(location.search).get('selftest') === 'rec') await tryCheck('녹음: 마이크 → Blob → IndexedDB 저장·삭제', async () => {
        if (!Rec.supported()) return [false, '녹음 미지원'];
        await Rec.start(); await wait(1200);
        const res = await Rec.stop();
        const rec = await Rec.save({ mode: 'selftest', label: 'selftest' }, res);
        const got = await DB.get('recordings', rec.id);
        await DB.del('recordings', rec.id);
        return [res.blob.size > 0 && got && got.blob && got.blob.size === res.blob.size, `형식 ${res.mime}, ${res.blob.size}바이트, 저장본 ${got && got.blob && got.blob.size}`];
    });
    await tryCheck('요소 편집 → combos 텍스트 반영 → 되돌리기', () => {
        const before = Data.combosText();
        const t = Data.topic('음악');
        Data.updateEl(t, '장르', { 위치: '1. 책상 스피커', 기호: '테스트 기호', K: 'pop, jazz' });
        const txt = Data.combosText();
        const block = txt.slice(txt.indexOf('- 장르\n'), txt.indexOf('- 루틴\n', txt.indexOf('- 장르\n')));
        const keys = block.split('\n').slice(1).map(l => l.trim().split(':')[0]).filter(Boolean);
        const ok = keys.join(',') === '유형,답변,위치,기호,연결,신호,장면,K' && /위치: 1\. 책상 스피커/.test(block) && Data.el(t, '장르').symbol === '테스트 기호';
        Data.replaceCombosText(before);
        return [ok && Data.combosText() === before, ok ? '형식 정상' : block];
    });
    await tryCheck('궁전 게임: 모든 주제 그림·위치, 걷기, 맞히기 흐름', async () => {
        const errs = [];
        for (const t of Data.topics()) {
            history.replaceState(null, '', '#/palace/game/' + encodeURIComponent(t.name)); await UI.render();
            const n = UI.el.querySelectorAll('.pg-locus').length;
            if (n !== t.chain.length) errs.push(`${t.name} 위치 ${n}/${t.chain.length}`);
        }
        history.replaceState(null, '', '#/palace/game/' + encodeURIComponent('집')); await UI.render();
        const st = PalaceGame._state, keep = { mode: st.mode, visited: [...st.visited] };
        UI.el.querySelector('[data-mode="walk"]').click(); st.visited.clear();
        UI.el.querySelector('[data-act="walkNext"], .pg-locus[data-no="1"]').dispatchEvent(new MouseEvent('click', { bubbles: true }));
        if (!UI.el.querySelector('.pg-link') || !/스위치/.test(UI.el.querySelector('.pg-link').textContent)) errs.push('걷기: 1번 연결 카드 없음');
        UI.el.querySelector('[data-mode="quiz"]').click();
        const z = st.quiz, first = Data.el(Data.topic('집'), z.combo[0]).locusNo;
        UI.el.querySelector(`.pg-locus[data-no="${first}"]`).dispatchEvent(new MouseEvent('click', { bubbles: true }));
        if (!['predict', 'done'].includes(st.quiz.phase)) errs.push('맞히기: 정답을 눌러도 다음 단계로 안 감 ' + st.quiz.phase);
        if (!UI.el.querySelector('.pg-sym')) errs.push('맞히기: 기호 말풍선 없음');
        const kw = UI.el.querySelector('.pg-panel .kw-chip[data-say]');
        if (kw && !UI.sayMap.get(kw.dataset.say)) errs.push('키워드 칩에 문장 재생 연결 안 됨');
        st.mode = keep.mode; st.visited = new Set(keep.visited); U.lsSet('opicTrainer.palaceGame.t.집.visited', keep.visited); U.lsSet('opicTrainer.palaceGame.mode', keep.mode);
        UI.teardown();
        return [!errs.length, errs.join(' || ')];
    });
};

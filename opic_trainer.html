        .catch(e => { throw e.name === 'AbortError' ? new Error(`응답 없음 (${ms / 1000}초)`) : e; })
        .finally(() => clearTimeout(timer));
}

// =========================================================================
//  미리 만든 음성 (TTS_STATIC_BASE 폴더, trainer_src/tts_build.py 가 만듦)
//  - 문장 하나 = mp3 하나, 파일 이름 = sha1(정리한 문장) 앞 20자리. tts_build.py 의 sentence_key 와 같아야 합니다.
//  - 여러 문장은 mp3 를 이어 붙여 하나로 재생합니다 (같은 형식의 mp3 프레임이라 그대로 붙음).
//  - 한 문장이라도 없으면 null → 실시간 엔진으로 넘어가고, 빠진 문장은 기록해 두었다가 '목록 내보내기'에 넣습니다.
// =========================================================================
const TtsStatic = {
    MISSING_KEY: 'opicTrainer.ttsMissing',
    CACHE: 'opic-tts-v1',
    loading: null,
    voices: new Map(),      // 성우 → Set(파일 이름)
    keys: new Map(),        // 문장 → 파일 이름

    norm(t) { return String(t || '').normalize('NFC').replace(/[\s﻿]+/g, ' ').trim(); },

    async key(sentence) {
        const n = this.norm(sentence);
        if (this.keys.has(n)) return this.keys.get(n);
        const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(n));
        const k = [...new Uint8Array(buf)].slice(0, 10).map(b => b.toString(16).padStart(2, '0')).join('');
        this.keys.set(n, k);
        return k;
    },

    // manifest.json 을 한 번 읽습니다. 실패하면 1분 뒤 다시 시도할 수 있게 합니다.
    load() {
        if (this.loading) return this.loading;
        this.loading = (async () => {
            if (location.protocol === 'file:' || !window.crypto || !crypto.subtle) return false;
            const url = new URL(TTS_STATIC_BASE + 'manifest.json', location.href).href;
            let m = null;
            try {
                const res = await fetchWithTimeout(url, { cache: 'no-cache' }, 5000);
                if (res.ok) {
                    m = await res.clone().json();
                    if (window.caches) caches.open(this.CACHE).then(c => c.put(url, res)).catch(() => {});
                }
            } catch (e) {}
            if (!m && window.caches) {   // 오프라인: 마지막으로 받은 목록
                const hit = await caches.match(url).catch(() => null);
                if (hit) m = await hit.json().catch(() => null);
            }
            if (!m || !m.voices) { setTimeout(() => { this.loading = null; }, 60000); return false; }
            this.voices = new Map(Object.entries(m.voices).map(([v, ks]) => [v, new Set(ks)]));
            return true;
        })().catch(() => false);
        return this.loading;
    },

    async audio(text, voice) {
        if (!await this.load()) return null;
        const have = this.voices.get(voice);
        if (!have) return null;
        const sents = U.sentences(text).map(s => this.norm(s)).filter(Boolean);
        if (!sents.length) return null;
        const keys = await Promise.all(sents.map(s => this.key(s)));
        const missing = sents.filter((s, i) => !have.has(keys[i]));
        if (missing.length) { this.noteMissing(missing); return null; }
        const parts = await Promise.all(keys.map(k => this.file(voice, k)));
        return new Blob(parts, { type: 'audio/mpeg' });
    },

    // 파일 이름이 내용의 해시라 한 번 받은 파일은 바뀌지 않습니다 → 기기에 영구 보관(오프라인 재생)
    async file(voice, key) {
        const url = new URL(`${TTS_STATIC_BASE}${encodeURIComponent(voice)}/${key}.mp3`, location.href).href;
        const cache = window.caches ? await caches.open(this.CACHE).catch(() => null) : null;
        const hit = cache && await cache.match(url).catch(() => null);
        if (hit) return hit.blob();
        const res = await fetchWithTimeout(url);
        if (!res.ok) throw new Error('mp3 HTTP ' + res.status);
        if (cache) await cache.put(url, res.clone()).catch(() => {});
        return res.blob();
    },

    noteMissing(sents) {
        const list = U.lsGet(this.MISSING_KEY, []);
        const set = new Set(list);
        sents.forEach(s => { if (!set.has(s)) { set.add(s); list.push(s); } });
        U.lsSet(this.MISSING_KEY, list.slice(-3000));
    },

    // 앱이 읽을 수 있는 모든 문장 (답변 파일 전부 + 표현 + 막힌 표현 + 재생하다 빠졌던 문장)
    allSentences() {
        const texts = [INTRO_QUESTION, TTS_SAMPLE];
        Data.allFiles().forEach(f => (f.scripts || []).forEach(s => { if (Parse.hasQuestion(s)) texts.push(s.question); texts.push(s.answer); }));
        Data.expressions.forEach(x => texts.push(x.en));
        Stuck.list().forEach(x => texts.push(x.en));
        texts.push(...U.lsGet(this.MISSING_KEY, []));
        const seen = new Set();
        texts.forEach(t => U.sentences(t || '').forEach(s => { const n = this.norm(s); if (n) seen.add(n); }));
        return [...seen];
    },

    exportData() {
        return { app: 'opic-trainer', kind: 'tts-texts', version: 1, voice: currentVoice('edge'), createdAt: new Date().toISOString(), sentences: this.allSentences() };
    },

    async status(voice) {
        if (!await this.load()) return { available: false };
        const have = this.voices.get(voice) || new Set();
        const sents = this.allSentences();
        const keys = await Promise.all(sents.map(s => this.key(s)));
        return { available: true, total: sents.length, ready: keys.filter(k => have.has(k)).length };
    }
};

function voiceOptions(engine) {
    if (engine === 'edge') return EDGE_VOICES.map(v => ({ value: v.id, text: v.label }));
    if (!window.speechSynthesis) return [];
    const voices = (window.speechSynthesis.getVoices() || []).filter(v => (v.lang || "").toLowerCase().startsWith('en'));
    voices.sort((a, b) => voiceScore(b) - voiceScore(a));
    return voices.map(v => ({ value: v.voiceURI, text: (voiceScore(v) >= 60 ? '★ ' : '') + v.name }));
}

// =========================================================================
//  녹음 (MediaRecorder → IndexedDB). 30일 · 최대 300개, 별표는 보존
// =========================================================================
const Rec = {
    stream: null, mr: null, chunks: [], startedAt: 0, mime: '',

    supported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); },

    async start() {
        if (!this.supported()) throw new Error('이 브라우저는 녹음을 지원하지 않습니다');
        TTS.stop(false);
        this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
        this.mime = types.find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
        this.mr = new MediaRecorder(this.stream, this.mime ? { mimeType: this.mime } : undefined);
        this.chunks = [];
        this.mr.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
        this.mr.start(1000);
        this.startedAt = performance.now();
    },

    elapsed() { return this.mr && this.mr.state === 'recording' ? (performance.now() - this.startedAt) / 1000 : 0; },
    isRecording() { return !!(this.mr && this.mr.state === 'recording'); },

    stop() {
        return new Promise(res => {
            if (!this.mr || this.mr.state === 'inactive') { res(null); return; }
            const durationSec = (performance.now() - this.startedAt) / 1000;
            this.mr.onstop = () => {
                const blob = new Blob(this.chunks, { type: this.mime || 'audio/webm' });
                this.release();
                res({ blob, durationSec, mime: this.mime });
            };
            this.mr.stop();
        });
    },

    cancel() { if (this.mr && this.mr.state !== 'inactive') { this.mr.onstop = () => this.release(); this.mr.stop(); } else this.release(); },
    release() { if (this.stream) this.stream.getTracks().forEach(t => t.stop()); this.stream = null; this.mr = null; this.chunks = []; },

    async save(meta, result) {
        const rec = {
            createdAt: Date.now(), date: U.today(), starred: false, checklist: null,
            durationSec: Math.round(result.durationSec), mime: result.mime, blob: result.blob, ...meta
        };
        rec.id = await DB.put('recordings', rec);
        return rec;
    },

    async prune() {
        const all = await DB.all('recordings');
        const cutoff = Date.now() - RECORDING_KEEP_DAYS * 864e5;
        let removed = 0;
        for (const r of all) if (!r.starred && r.createdAt < cutoff) { await DB.del('recordings', r.id); removed++; }
        const left = (await DB.all('recordings')).filter(r => !r.starred).sort((a, b) => a.createdAt - b.createdAt);
        while (left.length > RECORDING_MAX) { await DB.del('recordings', left.shift().id); removed++; }
        return removed;
    }
};

// =========================================================================
//  클라우드 동기화 (내용만). 기존 앱과 같은 방 코드·경로를 써서 답변 파일을 공유합니다.
//  콤보 데이터는 기존 앱이 읽지 않도록 별도 컬렉션(room_<코드>__trainer)에 둡니다.
// =========================================================================
const Sync = {
    id: '', fs: null, db: null, user: null, unsubs: [], status: 'off', lastError: '',

    init() {
        this.id = U.lsGet(LS.syncId, null) ?? (localStorage.getItem('scriptBrowserSyncId') || '');
        if (this.id) this.connect();
    },

    async connect() {
        this.status = 'connecting'; UI.refreshSyncBadge();
        try {
            const [appMod, authMod, fs] = await Promise.all([
                import(`${FIREBASE_SDK}/firebase-app.js`),
                import(`${FIREBASE_SDK}/firebase-auth.js`),
                import(`${FIREBASE_SDK}/firebase-firestore.js`)
            ]);
            this.fs = fs;
            const app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(USER_FIREBASE_CONFIG);
            const auth = authMod.getAuth(app);
            this.db = fs.getFirestore(app);
            await authMod.signInAnonymously(auth);
            authMod.onAuthStateChanged(auth, user => { this.user = user; if (user) this.listen(); });
        } catch (e) {
            console.error('동기화 연결 실패', e);
            this.status = 'error'; this.lastError = e.message; UI.refreshSyncBadge();
        }
    },

    setRoom(code) {
        this.id = code.trim(); U.lsSet(LS.syncId, this.id);
        this.unsubs.forEach(u => u()); this.unsubs = [];
        Data.setCloudFiles([]);
        if (!this.id) { this.status = 'off'; UI.refreshSyncBadge(); return; }
        if (this.user) this.listen(); else this.connect();
    },

    filesCol() { return this.fs.collection(this.db, 'artifacts', SYNC_APP_ID, 'public', 'data', 'room_' + this.id); },
    combosDoc() { return this.fs.doc(this.db, 'artifacts', SYNC_APP_ID, 'public', 'data', 'room_' + this.id + '__trainer', 'combos'); },

    listen() {
        if (!this.user || !this.id || !this.fs) return;
        this.unsubs.forEach(u => u()); this.unsubs = [];
        this.unsubs.push(this.fs.onSnapshot(this.filesCol(), snap => {
            const files = []; snap.forEach(d => { const v = d.data(); if (v && Array.isArray(v.scripts)) files.push(v); });
            files.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
            Data.setCloudFiles(files);
            this.status = 'on'; UI.refreshSyncBadge(); UI.onDataChanged('files');
        }, err => { this.status = 'error'; this.lastError = err.message; UI.refreshSyncBadge(); }));

        this.unsubs.push(this.fs.onSnapshot(this.combosDoc(), d => {
            if (!d.exists()) {
                // 방에 콤보가 아직 없으면 이 기기의 것을 올립니다
                this.pushCombos(Data.combosText(), Data.combosUpdatedAt || Date.now());
                return;
            }
            const v = d.data();
            if (v && v.text && (v.updatedAt || 0) > (Data.combosUpdatedAt || 0)) {
                Data.replaceCombosText(v.text, true, v.updatedAt);
                UI.onDataChanged('combos');
                UI.toast('다른 기기에서 바꾼 콤보 데이터를 불러왔습니다');
            } else if ((v.updatedAt || 0) < (Data.combosUpdatedAt || 0)) {
                this.pushCombos(Data.combosText(), Data.combosUpdatedAt);
            }
        }, err => console.warn('콤보 동기화 오류 (방 규칙이 막고 있을 수 있음)', err)));
    },

    async pushFile(file) {
        if (!this.user || !this.id || !this.fs) { UI.toast('동기화가 꺼져 있어 저장하지 못했습니다'); return; }
        const { origin, ...plain } = file;
        try { await this.fs.setDoc(this.fs.doc(this.filesCol(), file.fileId), plain); }
        catch (e) { console.error(e); UI.toast('클라우드 저장 실패: ' + e.message); }
    },
    async deleteFile(fileId) {
        if (!this.user || !this.fs) return;
        try { await this.fs.deleteDoc(this.fs.doc(this.filesCol(), fileId)); } catch (e) { console.error(e); }
    },
    async pushCombos(text, at) {
        if (!this.user || !this.id || !this.fs) return;
        try { await this.fs.setDoc(this.combosDoc(), { text, updatedAt: at }); }
        catch (e) { console.warn('콤보 업로드 실패', e); }
    }
};

// =========================================================================
//  화면 공통: 라우터, 토스트, 모달, 설정, 답변 패널
// =========================================================================
const Views = {};

const UI = {
    el: null, teardowns: [], urls: [], busy: false, sayMap: new Map(), saySeq: 0,

    init() {
        this.el = document.getElementById('view');
        document.getElementById('tabbar').onclick = e => {
            const b = e.target.closest('[data-tab]'); if (!b) return;
            if (UI.busy && !confirm('진행 중인 훈련을 멈추고 이동할까요?')) return;
            UI.busy = false;
            location.hash = '#/' + b.dataset.tab;
        };
        document.getElementById('backBtn').onclick = () => {
            if (UI.busy && !confirm('진행 중인 훈련을 멈추고 나갈까요?')) return;
            UI.busy = false; history.back();
        };
        document.getElementById('settingsBtn').onclick = () => UI.openSettings();
        document.getElementById('ttsStopTop').onclick = () => TTS.stop(false);
        window.addEventListener('hashchange', () => this.render());

        // 전역: [data-say] 버튼은 등록된 문장을 읽습니다 (같은 버튼을 다시 누르면 정지)
        document.addEventListener('click', e => {
            const b = e.target.closest('[data-say]'); if (!b) return;
            e.preventDefault();
            const id = b.dataset.say;
            if (TTS.state !== 'idle' && TTS.ctx && TTS.ctx.sayId === id) { TTS.stop(false); return; }
            const text = this.sayMap.get(id); if (!text) return;
            TTS.play(text, 'once', { sayId: id, title: text.slice(0, 40) });
        });
        TTS.on(state => {
            document.querySelectorAll('[data-say]').forEach(b => {
                const active = state !== 'idle' && TTS.ctx && TTS.ctx.sayId === b.dataset.say;
                b.classList.toggle('playing', active && (b.classList.contains('sentence') || b.classList.contains('kw-chip')));
                const icon = b.querySelector(':scope > i'); if (!icon) return;
                icon.className = active ? (state === 'loading' ? 'fas fa-spinner fa-spin' : 'fas fa-stop') : (b.dataset.icon || 'fas fa-volume-high');
            });
            // 키워드 칩으로 재생할 때 그 문장 줄 전체도 표시합니다
            document.querySelectorAll('[data-say-row]').forEach(r => r.classList.toggle('playing', state !== 'idle' && !!TTS.ctx && TTS.ctx.sayId === r.dataset.sayRow));
        });
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') TTS.recover(); });
        window.addEventListener('focus', () => TTS.recover());
    },

    // 읽을 문장을 등록하고 버튼 속성을 돌려줍니다
    say(text, icon = 'fas fa-volume-high') {
        const id = 's' + (++this.saySeq); this.sayMap.set(id, text);
        return `data-say="${id}" data-icon="${icon}"`;
    },

    parseHash() {
        const h = decodeURIComponent((location.hash || '#/today').slice(2));
        const parts = h.split('/').filter(Boolean);
        return { tab: parts[0] || 'today', parts: parts.slice(1) };
    },

    render() {
        this.teardown();
        const { tab, parts } = this.parseHash();
        document.querySelectorAll('#tabbar [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
        const fn = Views[tab] || Views.today;
        this.el.scrollTop = 0;
        const fail = e => { console.error(e); this.el.innerHTML = `<div class="wrap"><div class="card text-red-600">화면을 그리지 못했습니다: ${U.esc(e.message)}</div></div>`; };
        try { return Promise.resolve(fn(this.el, parts)).catch(fail); }
        catch (e) { fail(e); return Promise.resolve(); }
    },

    title(text, back = false) {
        document.getElementById('pageTitle').textContent = text;
        document.getElementById('backBtn').classList.toggle('hidden', !back);
    },

    onTeardown(fn) { this.teardowns.push(fn); },
    teardown() {
        this.teardowns.splice(0).forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
        this.urls.splice(0).forEach(u => URL.revokeObjectURL(u));
        this.sayMap.clear();
        if (Rec.isRecording()) Rec.cancel();
        TTS.stop(false);
        this.busy = false;
    },

    audioUrl(blob) { const u = URL.createObjectURL(blob); this.urls.push(u); return u; },

    // 다른 기기에서 데이터가 바뀌었을 때: 훈련 중이 아니면 지금 화면을 다시 그립니다
    onDataChanged() { if (!this.busy && !document.querySelector('.modal')) this.render(); },

    // 화면 안의 [data-act] 버튼을 한곳에서 처리합니다
    bind(root, handlers) {
        root.onclick = e => {
            const b = e.target.closest('[data-act]'); if (!b || !root.contains(b)) return;
            const fn = handlers[b.dataset.act]; if (fn) fn(b, e);
        };
    },

    toast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
    },

    modal(html, onMount) {
        const root = document.getElementById('modalRoot');
        const bg = document.createElement('div'); bg.className = 'modal-bg';
        bg.innerHTML = `<div class="modal" role="dialog">${html}</div>`;
        root.appendChild(bg);
        const close = () => bg.remove();
        bg.addEventListener('click', e => { if (e.target === bg) close(); });
        if (onMount) onMount(bg.querySelector('.modal'), close);
        return close;
    },

    confirm(title, msg, okText = '확인', danger = false) {
        return new Promise(res => {
            this.modal(`
                <h3 class="text-lg font-bold mb-2">${U.esc(title)}</h3>
                <p class="text-sm text-gray-600 mb-5 whitespace-pre-line">${U.esc(msg)}</p>
                <div class="flex justify-end gap-2">
                    <button class="btn btn-gray" data-r="0">취소</button>
                    <button class="btn ${danger ? 'btn-red' : 'btn-primary'}" data-r="1">${U.esc(okText)}</button>
                </div>`, (m, close) => {
                m.onclick = e => { const b = e.target.closest('[data-r]'); if (!b) return; close(); res(b.dataset.r === '1'); };
            });
        });
    },

    refreshSyncBadge() {
        const b = document.getElementById('syncBadge'); if (!b) return;
        const map = { off: ['오프라인', 'chip'], connecting: ['연결 중', 'chip chip-amber'], on: [Sync.id, 'chip chip-blue'], error: ['오류', 'chip chip-red'] };
        const [text, cls] = map[Sync.status] || map.off;
        b.className = cls; b.textContent = text;
    },

    // ---------------- 설정 ----------------
    openSettings() {
        const s = Settings.v;
        const engineOpts = [['edge', 'Edge TTS (미리 만든 음성 우선)'],['browser', '내장 음성']];
        const voiceHtml = engine => voiceOptions(engine).map(o => `<option value="${U.esc(o.value)}" ${o.value === currentVoice(engine) ? 'selected' : ''}>${U.esc(o.text)}</option>`).join('') || '<option value="">음성 없음</option>';
        this.modal(`
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold">설정</h3>
                <button class="icon-btn" data-close><i class="fas fa-xmark"></i></button>
            </div>
            <div class="sec-title" style="margin-top:0">음성 (TTS)</div>
            <div class="grid grid-cols-2 gap-3">
                <div class="field"><label>엔진</label><select id="setEngine">${engineOpts.map(([v, t]) => `<option value="${v}" ${s.engine === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
                <div class="field"><label>속도</label><select id="setRate">${['0.7', '0.85', '1', '1.15'].map(r => `<option value="${r}" ${s.rate === r ? 'selected' : ''}>${r}x</option>`).join('')}</select></div>
                <div class="field col-span-2"><label>성우</label><select id="setVoice">${voiceHtml(s.engine)}</select></div>
            </div>
            <label class="flex items-center gap-2 mt-3 text-sm"><input type="checkbox" id="setAutoQ" ${s.autoQuestion ? 'checked' : ''}> 문항이 나오면 질문을 자동으로 읽기</label>
            <label class="flex items-center gap-2 mt-2 text-sm"><input type="checkbox" id="setPredict" ${s.predictInDrill !== false ? 'checked' : ''}> 드릴에서 답한 뒤 "다음 질문 예상" 단계 넣기</label>
            <button class="btn btn-soft mt-3 w-full" id="setTest"><i class="fas fa-play"></i> 음성 테스트</button>
            <p class="text-xs muted mt-2" id="setTtsStatic">미리 만든 음성 확인 중…</p>
            <button class="btn btn-gray mt-2 w-full text-sm" id="setTtsExport"><i class="fas fa-file-export"></i> 음성 문장 목록 내보내기 (mp3 만들기용)</button>

            <div class="sec-title">동기화 (내용만: 답변 파일 · 콤보 데이터)</div>
            <div class="flex items-center gap-2 mb-2 text-sm">상태: <span id="syncBadge" class="chip">오프라인</span></div>
            <div class="flex gap-2">
                <div class="field flex-1"><input id="setRoom" placeholder="방 코드 (기존 앱과 같은 코드)" value="${U.esc(Sync.id)}"></div>
                <button class="btn btn-primary" id="setRoomBtn">연결</button>
            </div>
            <p class="text-xs muted mt-1">진도·녹음은 이 기기에만 저장됩니다.</p>

            <div class="sec-title">커리큘럼 단계</div>
            <div class="field"><select id="setStage">${STAGES.map(st => `<option value="${st.n}" ${s.stage === st.n ? 'selected' : ''}>${st.n}단계 · ${st.name}</option>`).join('')}</select></div>
            <p class="text-xs muted mt-1">보통은 통과 기준을 달성하면 '오늘' 화면에서 올라갑니다. 여기서는 직접 바꿀 수 있습니다.</p>

            <div class="sec-title">데이터</div>
            <div class="grid grid-cols-2 gap-2">
                <button class="btn btn-gray" id="setExport"><i class="fas fa-download"></i> combos.txt 내보내기</button>
                <label class="btn btn-gray cursor-pointer"><i class="fas fa-upload"></i> combos.txt 가져오기<input type="file" accept=".txt" id="setImport" class="hidden"></label>
                <button class="btn btn-gray" id="setResetCombos">콤보 내장본으로</button>
                <button class="btn btn-gray text-red-600" id="setResetProgress">진도 초기화</button>
            </div>
            <p class="text-xs muted mt-2" id="setStorageInfo"></p>
        `, (m, close) => {
            this.refreshSyncBadge();
            const $ = id => m.querySelector('#' + id);
            m.querySelector('[data-close]').onclick = close;
            $('setEngine').onchange = () => { Settings.set('engine', $('setEngine').value); TTS.stop(false); $('setVoice').innerHTML = voiceHtml(Settings.v.engine); };
            $('setVoice').onchange = () => { Settings.v.voices[Settings.v.engine] = $('setVoice').value; Settings.save(); TTS.stop(false); showStatic(); };
            $('setRate').onchange = () => { Settings.set('rate', $('setRate').value); TTS.stop(false); };
            $('setAutoQ').onchange = () => Settings.set('autoQuestion', $('setAutoQ').checked);
            $('setPredict').onchange = () => Settings.set('predictInDrill', $('setPredict').checked);
            $('setTest').onclick = () => TTS.play(TTS_SAMPLE, 'once');
            const showStatic = () => TtsStatic.status(currentVoice('edge')).then(r => {
                const el = $('setTtsStatic'); if (!el) return;
                if (!r.available) { el.textContent = '미리 만든 음성: 없음 (Netlify 주소로 열었을 때만 쓰입니다)'; return; }
                const name = currentVoice('edge').replace(/^en-\w+-|Neural$/g, '');
                el.textContent = r.ready
                    ? `미리 만든 음성(${name}): ${r.ready}/${r.total} 문장 준비됨${r.ready < r.total ? ' · 스크립트가 바뀌었다면 목록을 내보내 mp3를 새로 만드세요' : ''}`
                    : `미리 만든 음성: 이 성우(${name})는 아직 없습니다`;
            });
            showStatic();
            $('setTtsExport').onclick = () => { U.download('tts_texts.json', JSON.stringify(TtsStatic.exportData(), null, 1)); this.toast('tts_texts.json을 저장했습니다'); };
            $('setRoomBtn').onclick = () => { Sync.setRoom($('setRoom').value); this.toast(Sync.id ? `'${Sync.id}' 방에 연결합니다` : '동기화를 껐습니다'); };
            $('setStage').onchange = () => { Settings.set('stage', Number($('setStage').value)); this.render(); };
            $('setExport').onclick = () => U.download('combos.txt', Data.combosText());
            $('setImport').onchange = async e => {
                const f = e.target.files[0]; if (!f) return;
                const r = Data.replaceCombosText(await U.readFile(f));
                if (!r.ok) { this.toast('가져오기 실패: ' + r.errors[0]); return; }
                this.toast(r.errors.length ? `가져왔습니다 (확인할 것 ${r.errors.length}건, 자료실 > 콤보 데이터 참고)` : 'combos.txt를 가져왔습니다');
                close(); this.render();
            };
            $('setResetCombos').onclick = async () => {
                if (!await this.confirm('콤보 내장본으로 되돌리기', '앱에서 입력한 위치·장면·키워드가 모두 사라집니다. 먼저 내보내기를 권합니다.', '되돌리기', true)) return;
                Data.replaceCombosText(Data.seed('seed-combos')); close(); this.render(); this.toast('내장본으로 되돌렸습니다');
            };
            $('setResetProgress').onclick = async () => {
                if (!await this.confirm('진도 초기화', '복습 일정, 훈련 기록, 녹음이 모두 지워집니다. 되돌릴 수 없습니다.', '모두 지우기', true)) return;
                await DB.clear('cards'); await DB.clear('sessions'); await DB.clear('recordings'); SRS.cards.clear();
                close(); this.render(); this.toast('진도를 초기화했습니다');
            };
            if (navigator.storage && navigator.storage.estimate) {
                navigator.storage.estimate().then(est => { $('setStorageInfo').textContent = `이 기기 사용량: 약 ${Math.round((est.usage || 0) / 1048576)}MB · 녹음은 ${RECORDING_KEEP_DAYS}일 · 최대 ${RECORDING_MAX}개 보관 (별표는 보존)`; });
            }
        });
    },

    // ---------------- 답변 패널 (문장 단위 TTS) ----------------
    answerHtml(script, { showQuestion = true, showKeywords = true } = {}) {
        if (!script) return '<p class="missing">연결된 모범답변이 없습니다</p>';
        const sents = U.sentences(script.answer);
        const kw = (script.keywords || '').split(',').map(k => k.trim()).filter(Boolean);
        return `
            ${showQuestion ? `<div class="text-xs muted mb-1">${U.esc(script.id)} · ${U.esc(script.title)}</div>
            ${Parse.hasQuestion(script) ? `<p class="font-medium mb-3">${U.esc(script.question)}</p>` : ''}` : ''}
            ${showKeywords && kw.length ? `<div class="flex flex-wrap gap-1 mb-3">${kw.map(k => `<span class="chip">${U.esc(k)}</span>`).join('')}</div>` : ''}
            <div class="flex items-center gap-2 mb-2">
                <button class="btn btn-soft text-sm" ${this.say(script.answer, 'fas fa-play')}><i class="fas fa-play"></i> 전체 듣기</button>
                <span class="text-xs muted">문장을 누르면 그 문장만 읽습니다</span>
            </div>
            <div class="answer-text">${sents.map((s, i) => `<span class="sentence" ${this.say(s, '')}><span class="sentence-num">${U.circled(i + 1)}</span>${U.esc(s)}</span>`).join('')}</div>`;
    },

    // 녹음 길이 표시용 색
    durClass(sec) { return sec < ANSWER_TARGET.min ? 'under' : sec <= ANSWER_TARGET.max ? 'good' : 'over'; },
    durChip(sec) {
        const c = this.durClass(sec);
        return `<span class="chip ${c === 'good' ? 'chip-green' : c === 'over' ? 'chip-amber' : ''}">${U.fmtSec(sec)}</span>`;
    }
};

// =========================================================================
//  자료실: 답변 파일(기존 스크립트 브라우저) · 콤보 데이터 · 표현
// =========================================================================
const Lib = { search: '', fileId: null, ttsMode: 'once', range: {} };

Views.library = (el, parts) => {
    const sub = parts[0] || 'answers';
    if (sub === 'script') return Lib.renderScript(el, parts[1], parts[2]);
    if (sub === 'topic') return Lib.renderTopic(el, parts[1]);
    UI.title('자료실');
    const tabs = [['answers', '답변 파일'], ['combos', '콤보 데이터'], ['expr', '표현']];
    el.innerHTML = `<div class="wrap">
        <div class="seg mb-4">${tabs.map(([k, t]) => `<button data-act="tab" data-k="${k}" class="${sub === k ? 'on' : ''}">${t}</button>`).join('')}</div>
        <div id="libBody"></div></div>`;
    UI.bind(el.querySelector('.seg'), { tab: b => { location.hash = '#/library/' + b.dataset.k; } });
    const body = el.querySelector('#libBody');
    if (sub === 'combos') Lib.renderCombos(body);
    else if (sub === 'expr') Lib.renderExpr(body);
    else Lib.renderFiles(body);
};

// ---------------- 답변 파일 ----------------
Lib.currentFile = () => Data.file(Lib.fileId) || Data.activeFile();

Lib.renderFiles = (body) => {
    const files = Data.allFiles();
    const f = Lib.currentFile(); Lib.fileId = f ? f.fileId : null;
    const originLabel = { builtin: '내장', local: '이 기기', cloud: '클라우드' };
    const q = Lib.search.toLowerCase();
    const list = f ? f.scripts.filter(s => !q || [s.id, s.category, s.title, s.question, s.answer].some(v => (v || '').toLowerCase().includes(q))) : [];
    body.innerHTML = `
        <div class="card mb-3">
            <div class="field mb-2"><label>파일</label>
                <select id="libFile">${files.map(x => `<option value="${U.esc(x.fileId)}" ${f && x.fileId === f.fileId ? 'selected' : ''}>[${originLabel[x.origin]}] ${U.esc(x.fileName)}${x.fileId === Data.activeFileId ? ' ★훈련용' : ''}</option>`).join('')}</select>
            </div>
            <div class="flex flex-wrap gap-2">
                <button class="btn btn-soft text-sm" data-act="useFile" ${f && f.fileId === Data.activeFileId ? 'disabled' : ''}><i class="fas fa-star"></i> 훈련에 이 파일 사용</button>
                <label class="btn btn-gray text-sm cursor-pointer"><i class="fas fa-upload"></i> 업로드<input type="file" accept=".txt" id="libUpload" class="hidden"></label>
                <button class="btn btn-gray text-sm" data-act="download"><i class="fas fa-download"></i> 다운로드</button>
                <button class="btn btn-gray text-sm" data-act="newScript"><i class="fas fa-plus"></i> 새 스크립트</button>
                ${f && f.origin !== 'builtin' ? `<button class="btn btn-gray text-sm text-red-600" data-act="delFile"><i class="fas fa-trash"></i> 파일 삭제</button>` : ''}
            </div>
            <p class="text-xs muted mt-2">훈련(궁전·드릴)은 ★훈련용 파일의 답변을 씁니다. 동기화 방에 연결하면 기존 앱의 파일도 여기에 나타납니다 (설정 ⚙).</p>
        </div>
        <div class="field mb-3"><input id="libSearch" placeholder="검색 (제목·질문·답변)" value="${U.esc(Lib.search)}"></div>
        <div class="text-xs muted mb-2">${list.length}개</div>
        <div class="space-y-2" id="libList">${list.map(s => `
            <button class="row-item" data-act="open" data-u="${U.esc(s.uuid)}">
                <span class="num">${U.esc((s.id || '').replace(/^Q0*/, ''))}</span>
                <span class="flex-1 min-w-0">
                    <span class="block text-xs muted">${U.esc(s.category)} · ${U.esc(s.id)}</span>
                    <span class="block font-semibold truncate">${U.esc(s.title)}</span>
                </span>
                <i class="fas fa-chevron-right text-gray-300"></i>
            </button>`).join('') || '<p class="missing">스크립트가 없습니다</p>'}</div>`;

    body.querySelector('#libFile').onchange = e => { Lib.fileId = e.target.value; Lib.renderFiles(body); };
    const search = body.querySelector('#libSearch');
    search.oninput = () => { Lib.search = search.value; clearTimeout(Lib._t); Lib._t = setTimeout(() => { Lib.renderFiles(body); const s = body.querySelector('#libSearch'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }, 250); };
    body.querySelector('#libUpload').onchange = async e => {
        const file = e.target.files[0]; if (!file) return;
        const scripts = Parse.scripts(await U.readFile(file));
        if (!scripts.length) { UI.toast("스크립트를 찾지 못했습니다. 헤더는 '분류-Q번호-제목: 질문' 모양이어야 합니다"); return; }
        const nf = { fileId: 'file-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7), fileName: file.name, scripts, updatedAt: Date.now() };
        if (Sync.user && Sync.id) { nf.origin = 'cloud'; Data.cloudFiles.unshift(nf); Sync.pushFile(nf); }
        else { nf.origin = 'local'; Data.files.push(nf); Data.saveFiles(); }
        Lib.fileId = nf.fileId; UI.toast(`${scripts.length}개 스크립트를 올렸습니다`); Lib.renderFiles(body);
    };
    UI.bind(body, {
        open: b => { location.hash = `#/library/script/${encodeURIComponent(f.fileId)}/${encodeURIComponent(b.dataset.u)}`; },
        useFile: () => { Data.setActiveFile(f.fileId); UI.toast('훈련에 이 파일을 씁니다'); Lib.renderFiles(body); },
        download: () => { if (f) U.download(f.fileName, Parse.serializeScripts(f.scripts)); },
        newScript: () => Lib.insertScript(f, f.scripts.length),
        delFile: async () => {
            if (!await UI.confirm('파일 삭제', `'${f.fileName}' 파일을 삭제할까요?`, '삭제', true)) return;
            if (f.origin === 'cloud') { Sync.deleteFile(f.fileId); Data.cloudFiles = Data.cloudFiles.filter(x => x.fileId !== f.fileId); }
            else { Data.files = Data.files.filter(x => x.fileId !== f.fileId); }
            if (Data.activeFileId === f.fileId) Data.activeFileId = 'builtin';
            Data.saveFiles(); Data.reindex(); Lib.fileId = null; Lib.renderFiles(body);
        }
    });
};

Lib.nextQ = (file) => {
    const max = Math.max(0, ...file.scripts.map(s => parseInt((s.id || '').replace(/\D/g, ''), 10) || 0));
    return 'Q' + String(max + 1).padStart(3, '0');
};

Lib.insertScript = (file, at, base) => {
    const id = Lib.nextQ(file);
    const s = { uuid: U.uid(), key: id, category: base ? base.category : '기본01', id, title: '새 스크립트', question: '', answer: '', keywords: '' };
    file.scripts.splice(at, 0, s);
    Data.commitFile(file);
    location.hash = `#/library/script/${encodeURIComponent(file.fileId)}/${encodeURIComponent(s.uuid)}`;
    setTimeout(() => Lib.editScript(file, s), 50);
};

// 스크립트 상세: TTS 연속 재생 중에도 화면만 바꿀 수 있게 해시 이동 없이 다시 그립니다
Lib.renderScript = (el, fileId, uuid) => {
    const file = Data.file(fileId);
    if (!file) { el.innerHTML = '<div class="wrap"><p class="missing">파일을 찾을 수 없습니다</p></div>'; UI.title('자료실', true); return; }
    Lib.fileId = file.fileId;
    const range = Lib.range[file.fileId] || (Lib.range[file.fileId] = { start: 1, end: file.scripts.length });
    let cur = file.scripts.find(s => s.uuid === uuid) || file.scripts[0];

    const draw = () => {
        const i = file.scripts.indexOf(cur), n = file.scripts.length;
        UI.title(cur ? cur.title : '스크립트', true);
        UI.sayMap.clear();
        const ranged = ['range', 'random'].includes(Lib.ttsMode);
        el.innerHTML = `<div class="wrap">
            <div class="flex items-center justify-between mb-3">
                <button class="btn btn-gray text-sm" data-act="nav" data-d="-1" ${i <= 0 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i> 이전</button>
                <span class="text-sm font-bold muted">${i + 1} / ${n}</span>
                <button class="btn btn-gray text-sm" data-act="nav" data-d="1" ${i >= n - 1 ? 'disabled' : ''}>다음 <i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="card">
                <div class="flex items-start justify-between gap-2 mb-3">
                    <div><span class="chip chip-blue">${U.esc(cur.category)}</span> <span class="text-sm muted font-mono">${U.esc(cur.id)}</span>
                        <h2 class="text-xl font-bold mt-1">${U.esc(cur.title)}</h2></div>
                    <button class="btn btn-gray text-sm flex-shrink-0" data-act="edit"><i class="fas fa-pen"></i> 수정</button>
                </div>
                <div class="sec-title" style="margin-top:4px">QUESTION</div>
                <p class="bg-gray-50 border border-gray-100 rounded-xl p-3 mb-3">${Parse.hasQuestion(cur) ? U.esc(cur.question) : '<span class="missing">영어 질문 없음</span>'}</p>
                <div class="flex flex-wrap items-center gap-2 bg-gray-50 border rounded-xl p-2 mb-3">
                    <select id="ttsMode" class="text-sm font-bold text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-lg py-1.5 px-2">
                        ${[['once', '1번 읽기'], ['repeat', '현재 항목 반복'], ['continuous', '이후 항목 연속'], ['range', '구간 순서대로 반복'], ['random', '구간 랜덤 반복']].map(([v, t]) => `<option value="${v}" ${Lib.ttsMode === v ? 'selected' : ''}>${t}</option>`).join('')}
                    </select>
                    <button class="btn btn-green text-sm" data-act="play" id="libPlay"><i class="fas fa-play"></i> 재생</button>
                    <button class="btn btn-red text-sm" data-act="stop"><i class="fas fa-stop"></i></button>
                </div>
                <div class="${ranged ? '' : 'hidden'} flex flex-wrap items-center gap-2 bg-indigo-50 border border-indigo-100 rounded-xl px-3 py-2 mb-3 text-sm">
                    <span class="font-bold text-indigo-700">반복 구간</span>
                    <input id="rStart" type="number" min="1" max="${n}" value="${range.start}" class="w-16 text-center border rounded-md py-1">
                    ~ <input id="rEnd" type="number" min="1" max="${n}" value="${range.end}" class="w-16 text-center border rounded-md py-1">
                    <button class="btn btn-gray text-xs" data-act="rFrom">시작＝현재</button>
                    <button class="btn btn-gray text-xs" data-act="rTo">끝＝현재</button>
                    <button class="btn btn-gray text-xs" data-act="rAll">전체</button>
                </div>
                ${UI.answerHtml(cur, { showQuestion: false })}
            </div>
            <div class="grid grid-cols-2 gap-2 mt-3">
                <button class="btn btn-gray text-sm" data-act="insert" data-o="0"><i class="fas fa-arrow-up"></i> 위에 새로</button>
                <button class="btn btn-gray text-sm" data-act="insert" data-o="1"><i class="fas fa-arrow-down"></i> 아래에 새로</button>
                <button class="btn btn-gray text-sm" data-act="move" data-d="-1" ${i <= 0 ? 'disabled' : ''}>▲ 위로 이동</button>
                <button class="btn btn-gray text-sm" data-act="move" data-d="1" ${i >= n - 1 ? 'disabled' : ''}>▼ 아래로 이동</button>
            </div>
        </div>`;
        history.replaceState(null, '', `#/library/script/${encodeURIComponent(file.fileId)}/${encodeURIComponent(cur.uuid)}`);
        el.querySelector('#ttsMode').onchange = e => { Lib.ttsMode = e.target.value; TTS.stop(false); draw(); };
        const rs = el.querySelector('#rStart'), re = el.querySelector('#rEnd');
        rs.onchange = () => { range.start = Number(rs.value) || 1; fixRange(); };
        re.onchange = () => { range.end = Number(re.value) || 1; fixRange(); };
        syncPlayIcon(TTS.state);
    };
    const fixRange = () => {
        const n = file.scripts.length;
        range.start = Math.min(Math.max(range.start, 1), n); range.end = Math.min(Math.max(range.end, 1), n);
        if (range.start > range.end) [range.start, range.end] = [range.end, range.start];
        draw();
    };
    const syncPlayIcon = state => {
        const b = el.querySelector('#libPlay'); if (!b) return;
        const mine = TTS.ctx && TTS.ctx.lib;
        b.innerHTML = mine && state === 'loading' ? '<span class="spinner"></span>' : mine && state === 'playing' ? '<i class="fas fa-volume-high"></i> 재생 중' : '<i class="fas fa-play"></i> 재생';
    };
    UI.onTeardown(TTS.on(syncPlayIcon));

    const pickNext = mode => {
        const n = file.scripts.length, i = file.scripts.indexOf(cur);
        const lo = range.start - 1, hi = range.end - 1;
        let next = null;
        if (mode === 'continuous') next = i < n - 1 ? file.scripts[i + 1] : null;
        else if (mode === 'range') next = file.scripts[(i < lo || i >= hi) ? lo : i + 1];
        else if (mode === 'random') {
            let j = i;
            if (hi === lo) j = lo; else for (let k = 0; k < 12 && j === i; k++) j = lo + Math.floor(Math.random() * (hi - lo + 1));
            next = file.scripts[j];
        }
        return next ? { text: next.answer, script: next } : null;
    };
    const ctx = () => ({
        lib: true, title: cur.title, artist: `${cur.category} · ${cur.id}`, pickNext,
        onNext: item => { cur = item.script; draw(); TTS.ctx && (TTS.ctx.title = cur.title); },
        onSkip: d => { const j = file.scripts.indexOf(cur) + d; if (file.scripts[j]) { cur = file.scripts[j]; draw(); TTS.play(cur.answer, Lib.ttsMode, ctx()); } }
    });

    UI.bind(el, {
        nav: b => { TTS.stop(false); const j = file.scripts.indexOf(cur) + Number(b.dataset.d); if (file.scripts[j]) { cur = file.scripts[j]; draw(); el.scrollTop = 0; } },
        play: () => {
            const i = file.scripts.indexOf(cur);
            if (['range', 'random'].includes(Lib.ttsMode) && (i + 1 < range.start || i + 1 > range.end)) { cur = file.scripts[range.start - 1]; draw(); }
            TTS.play(cur.answer, Lib.ttsMode, ctx());
        },
        stop: () => TTS.stop(false),
        rFrom: () => { range.start = file.scripts.indexOf(cur) + 1; fixRange(); },
        rTo: () => { range.end = file.scripts.indexOf(cur) + 1; fixRange(); },
        rAll: () => { range.start = 1; range.end = file.scripts.length; fixRange(); },
        edit: () => Lib.editScript(file, cur, s => { cur = s; draw(); }),
        insert: b => Lib.insertScript(file, file.scripts.indexOf(cur) + Number(b.dataset.o), cur),
        move: b => {
            const i = file.scripts.indexOf(cur), j = i + Number(b.dataset.d);
            if (j < 0 || j >= file.scripts.length) return;
            [file.scripts[i], file.scripts[j]] = [file.scripts[j], file.scripts[i]];
            Data.commitFile(file); draw();
        }
    });
    draw();
};

//  궁전: 시험 중 "지금 질문 다음에 무슨 질문이 올지" 떠올리기 위한 체계
//  1층 공통 규칙 · 2층 주제별 갈림길(방 = 주제, 위치 = 질문, 기호 + 가리키는 장면) · 3층 신호어
//  예측할 지점은 둘뿐: 1번째 → 2번째, 2번째 → 3번째 (3번째 뒤에는 주제가 바뀜). 2문항 콤보는 14번 → 15번
// =========================================================================
const STREET = '동네 길';

const RULE_HTML = `
    <div class="font-bold mb-1">1층 · 공통 규칙 (모든 주제, 처음 보는 돌발에도)</div>
    <ol class="list-decimal pl-5 text-sm space-y-1">
        <li><b>묘사로 연다</b> → 2번째는 <b>루틴</b>(평소 하는 일) 또는 바로 <b>과거·비교·경험</b></li>
        <li>2번째가 루틴이면 → 3번째는 <b>과거·비교</b> 또는 <b>경험</b></li>
        <li>2번째가 과거·비교면 → 3번째는 <b>경험</b>(최근·기억·문제)</li>
        <li><b>14번이 변화·비교</b>면 → 15번은 <b>이슈·우려·뉴스</b></li>
    </ol>
    <p class="text-xs muted mt-2">콤보 3문항짜리 86개 중 84개가 이 순서를 지킵니다. 규칙으로 '종류'를 좁히고, 갈림길 장면으로 '구체적인 질문'을 떠올립니다.</p>`;

const Palace = {
    // 주제 순서는 combos.txt에 적힌 순서를 그대로 따릅니다
    houseTopics() { return Data.topics('서베이'); },
    forkStats(t) {
        const keys = Data.forks(t).map(f => f.key);
        return { total: keys.length, known: keys.filter(k => SRS.mastered(k)).length, due: SRS.dueKeys(keys).length, fresh: keys.filter(k => !SRS.get(k)).length };
    },
    dueForks() { const t = U.today(); return Data.allForks().filter(f => { const c = SRS.get(f.key); return c && c.due <= t; }); },
    roleBadges(t, name, tree) {
        const r = Data.roles(t, name, tree);
        if (!r.length) return '<span class="chip">끝</span>';
        return r.map(x => `<span class="chip ${x.role === 'p' ? 'chip-red' : 'chip-blue'}">${Data.roleLabel(x.role)}</span>`).join(' ');
    },
    // 콤보 지도: 경로가 정확하도록 (1번째, 2번째) 쌍으로 3번째를 계산합니다
    treeHtml(t) {
        const tree = Data.tree(t);
        const sym = n => { const i = Data.el(t, n); return i.symbol ? `<span class="muted text-xs"> · ${U.esc(i.symbol)}</span>` : ''; };
        const node = (n, cls = '') => `<span class="tnode ${cls}">${U.esc(n)}${sym(n)}</span>`;
        const triples = [...tree.as1.entries()].map(([q1, q2s]) => `
            <div class="mb-3">${node(q1, 'q1')}
                <div class="tkids">${q2s.map(q2 => `<div class="mt-1">${node(q2)}
                    <div class="tkids">${(tree.q3by.get(q1 + '|' + q2) || []).map(q3 => `<div class="mt-1">${node(q3, 'q3')}</div>`).join('')}</div></div>`).join('')}
                </div></div>`).join('');
        const pairs = [...tree.pair.entries()].map(([a, bs]) => `<div class="mt-1">${node(a, 'q14')} <span class="muted">→</span> ${bs.map(b => node(b, 'q3')).join(' ')}</div>`).join('');
        return `${triples || '<p class="missing text-sm">3문항 콤보 없음</p>'}${pairs ? `<div class="sec-title">14 → 15번 (2문항 콤보)</div>${pairs}` : ''}`;
    }
};

// ---------------- 다음 질문 맞히기 ----------------
const Predict = {
    scopeTopics(scope) {
        if (scope === '*survey') return Data.topics('서베이');
        if (scope === '*common') return Data.topics('공통형');
        if (scope && scope[0] !== '*') { const t = Data.topic(scope); return t ? [t] : []; }
        return Data.topics();
    },
    start(el, scope, mode) {
        const topics = Predict.scopeTopics(scope);
        UI.title(mode === 'flow' ? '콤보 흐름' : (scope === '*due' ? '갈림길 복습' : '다음 질문 맞히기'), true);
        if (mode === 'flow') return Predict.flow(el, topics);
        let forks = scope === '*due' ? Palace.dueForks() : topics.flatMap(t => Data.forks(t));
        return Predict.cards(el, forks, { scope });
    },

    // 같은 주제의 질문 칩 (지금 질문 제외, 사슬 순서)
    chips(t, current, sel, reveal) {
        return `<div class="flex flex-wrap gap-2">${t.chain.filter(n => n !== current).map(n => {
            let cls = sel.has(n) ? 'chip-blue' : '';
            if (reveal) {
                const ok = reveal.has(n);
                cls = ok && sel.has(n) ? 'chip-green' : ok ? 'chip-amber' : sel.has(n) ? 'chip-red' : '';
            }
            return `<button class="chip ${cls}" style="padding:6px 12px;font-size:.9rem" data-act="chip" data-n="${U.esc(n)}" ${reveal ? 'disabled' : ''}>${reveal && reveal.has(n) && !sel.has(n) ? '＋ ' : ''}${U.esc(n)}</button>`;
        }).join('')}</div>`;
    },
    judge(sel, correct) {
        const hit = [...sel].filter(n => correct.has(n)).length;
        if (hit === correct.size && sel.size === correct.size) return 'good';
        return hit > 0 ? 'hard' : 'again';
    },
    questionCard(info, roleText, extra = '') {
        const q = Data.question(info);
        return `<div class="card">
            <div class="text-xs muted mb-1">${U.esc(info.topic.name)} · ${roleText}</div>
            <div class="text-xl font-bold mb-2">${U.esc(info.name)}</div>
            ${extra}
            ${q.en ? `<div class="flex gap-2 items-start"><button class="icon-btn flex-shrink-0" style="width:32px;height:32px" ${UI.say(q.en)}><i class="fas fa-volume-high"></i></button><p class="text-sm">${U.esc(q.en)}</p></div>` : `<p class="text-sm muted">${U.esc(q.ko)}</p>`}
        </div>`;
    },
    revealCard(fork, correct, grade) {
        const g = { good: ['chip-green', '정확'], hard: ['chip-amber', '일부만'], again: ['chip-red', '놓침'] }[grade];
        return `<div class="card space-y-2">
            <div class="flex items-center gap-2"><span class="chip ${g[0]}">${g[1]}</span><span class="text-sm">다음 후보: <b>${[...correct].map(U.esc).join(' / ')}</b></span></div>
            ${fork.info.symbol ? `<div class="text-sm">🔹 ${U.esc(fork.info.symbol)}</div>` : ''}
            ${fork.info.link ? `<div class="link-box text-sm">🔗 ${U.esc(fork.info.link)}</div>` : ''}
            ${fork.scene ? `<div class="scene text-sm">🎬 ${U.esc(fork.scene)}</div>` : '<p class="missing text-sm">장면 미작성 — 연필 버튼으로 써 두면 다음부터 떠올리기 쉽습니다</p>'}
            <p class="text-xs muted">${U.esc(Data.ruleHint(fork.info.type, fork.role))}</p>
        </div>`;
    },

    // 카드 모드: 갈림길 하나씩 (복습할 것 → 새것 순서)
    cards(el, forks, opts = {}) {
        const due = U.shuffle(forks.filter(f => SRS.dueKeys([f.key]).length));
        const fresh = forks.filter(f => !SRS.get(f.key)).slice(0, opts.newLimit || 12);
        // 복습 일정과 상관없이 전부 연습할 때는 받은 목록 그대로
        const queue = opts.practiceAll ? [...forks] : opts.scope === '*due' ? due : [...due, ...fresh];
        if (!queue.length) {
            el.innerHTML = `<div class="wrap"><div class="card">지금 볼 갈림길이 없습니다. ${forks.length ? '모두 복습 일정 전입니다.' : ''}</div>
                ${forks.length ? '<button class="btn btn-soft w-full mt-3" data-act="all">그래도 전부 연습하기</button>' : ''}</div>`;
            UI.bind(el, { all: () => Predict.cards(el, U.shuffle(forks), { practiceAll: true, onDone: opts.onDone }) });
            return;
        }
        UI.busy = true;
        const started = Date.now();
        let i = 0, sel = new Set(), revealed = null, ctxFirst = null;
        const results = [];
        const draw = () => {
            UI.sayMap.clear();
            const f = queue[i];
            // 3번째 후보가 1번째 질문에 따라 달라지는 경우: 1번째를 하나 정해서 보여 줍니다
            if (f.byFirst.length && !ctxFirst) ctxFirst = U.pick(f.byFirst);
            const correct = new Set(ctxFirst ? ctxFirst.next : f.next);
            const extra = ctxFirst ? `<p class="text-sm mb-2">1번째 질문은 <b>${U.esc(ctxFirst.first)}</b>였습니다</p>` : '';
            el.innerHTML = `<div class="wrap space-y-3">
                <div class="bar"><span style="width:${Math.round(i / queue.length * 100)}%"></span></div>
                <div class="text-xs muted">${i + 1}/${queue.length} · ${SRS.get(f.key) ? '복습' : '새 갈림길'}</div>
                ${Predict.questionCard(f.info, `이 주제의 ${Data.roleLabel(f.role)} 질문으로 나왔습니다`, extra)}
                <div class="card"><div class="text-sm font-semibold mb-2">다음에 올 수 있는 질문을 모두 고르세요</div>
                    ${Predict.chips(f.t, f.name, sel, revealed && correct)}</div>
                ${revealed ? Predict.revealCard(f, correct, revealed) + `<button class="btn btn-primary w-full" data-act="next">${i < queue.length - 1 ? '다음' : '끝'}</button>`
                    : `<div class="grid grid-cols-3 gap-2"><button class="btn btn-primary col-span-2" data-act="check" ${sel.size ? '' : 'disabled'}>확인</button><button class="btn btn-gray" data-act="dunno">모름</button></div>`}
                ${revealed ? '' : '<button class="btn btn-gray w-full text-sm" data-act="edit"><i class="fas fa-pen"></i> 이 위치 편집</button>'}
            </div>`;
            el.scrollTop = 0;
        };
        const doReveal = async (grade) => {
            const f = queue[i];
            const correct = new Set(ctxFirst ? ctxFirst.next : f.next);
            revealed = grade || Predict.judge(sel, correct);
            results.push(revealed);
            draw();   // 공개는 바로, 복습 일정 저장은 뒤에서
            SRS.grade(f.key, revealed).catch(e => console.error('채점 저장 실패', e));
        };
        UI.bind(el, {
            chip: b => { if (revealed) return; const n = b.dataset.n; sel.has(n) ? sel.delete(n) : sel.add(n); draw(); },
            check: () => doReveal(),
            dunno: () => doReveal('again'),
            edit: () => ElementEditor.open(queue[i].t, queue[i].name, draw),
            next: () => {
                TTS.stop(false);
                if (revealed === 'again') queue.push(queue[i]);   // 놓친 것은 이번 묶음 끝에 한 번 더
                i++; sel = new Set(); revealed = null; ctxFirst = null;
                if (i < queue.length) { draw(); return; }
                UI.busy = false;
                const c = g => results.filter(x => x === g).length;
                DB.put('sessions', { date: U.today(), startedAt: started, mode: 'predict', minutes: Math.round((Date.now() - started) / 6000) / 10, count: results.length }).catch(console.error);
                el.innerHTML = `<div class="wrap"><div class="card text-center"><div class="font-bold text-lg mb-2">갈림길 ${results.length}개 끝</div>
                    <div class="grid grid-cols-3 gap-2 mb-4 text-sm"><div class="reveal"><b class="text-green-600 text-lg">${c('good')}</b><br>정확</div><div class="reveal"><b class="text-amber-600 text-lg">${c('hard')}</b><br>일부만</div><div class="reveal"><b class="text-lg">${c('again')}</b><br>놓침</div></div>
                    <button class="btn btn-primary" data-act="done">${opts.onDone ? '다음 단계로' : '끝내기'}</button></div></div>`;
            },
            done: () => opts.onDone ? opts.onDone(results) : history.back()
        });
        draw();
    },

    // 콤보 흐름 모드: 실제 콤보 하나를 따라가며 매 질문마다 다음을 예측
    flow(el, topics, opts = {}) {
        const pool = topics.flatMap(t => t.combos.map(c => ({ t, c })));
        if (!pool.length) { el.innerHTML = '<div class="wrap"><p class="missing">콤보가 없습니다</p></div>'; return; }
        UI.busy = true;
        const started = Date.now();
        let combo = null, i = 0, sel = new Set(), revealed = null, count = 0;
        const newCombo = () => { combo = U.pick(pool); i = 0; sel = new Set(); revealed = null; };
        const draw = (speak) => {
            UI.sayMap.clear();
            const { t, c } = combo;
            const tree = Data.tree(t);
            const info = Data.el(t, c[i]);
            const last = i === c.length - 1;
            const role = c.length === 2 ? 'p' : (i === 0 ? '1' : '2');
            const correct = last ? null : new Set(c.length === 2 ? tree.pair.get(c[0]) : i === 0 ? tree.as1.get(c[0]) : tree.q3by.get(c[0] + '|' + c[1]));
            const posText = c.length === 2 ? (i === 0 ? '14번' : '15번') : `${i + 1}번째`;
            const fork = last ? null : Data.forks(t).find(f => f.role === role && f.name === c[i]);
            el.innerHTML = `<div class="wrap space-y-3">
                <div class="flex items-center justify-between text-sm"><span class="font-bold">${U.esc(t.name)} · ${U.esc(Data.place(t))}</span><span class="muted">${posText} / ${c.length}문항 콤보</span></div>
                <div class="text-xs muted">지나온 질문: ${c.slice(0, i).map(U.esc).join(' → ') || '(첫 질문)'}</div>
                ${Predict.questionCard(info, `${posText} 질문`)}
                ${last ? `<div class="card text-center"><p class="mb-3">콤보 끝 — 다음은 <b>새 주제</b>입니다</p>
                        <div class="grid grid-cols-2 gap-2"><button class="btn btn-primary" data-act="again">다음 콤보</button><button class="btn btn-gray" data-act="quit">그만</button></div></div>`
                : `<div class="card"><div class="text-sm font-semibold mb-2">다음 질문은? (가능한 것 모두)</div>${Predict.chips(t, c[i], sel, revealed && correct)}</div>
                   ${revealed ? Predict.revealCard(fork, correct, revealed) + `<div class="card text-sm">실제 다음 질문: <b>${U.esc(c[i + 1])}</b></div>
                        <button class="btn btn-primary w-full" data-act="go">다음 질문 듣기</button>`
                   : `<div class="grid grid-cols-3 gap-2"><button class="btn btn-primary col-span-2" data-act="check" ${sel.size ? '' : 'disabled'}>확인</button><button class="btn btn-gray" data-act="dunno">모름</button></div>`}`}
            </div>`;
            el.scrollTop = 0;
            const q = Data.question(info);
            if (speak && Settings.v.autoQuestion && q.en) TTS.play(q.en, 'once', { title: info.name });
        };
        const reveal = async grade => {
            const { t, c } = combo, tree = Data.tree(t);
            const role = c.length === 2 ? 'p' : (i === 0 ? '1' : '2');
            const correct = new Set(c.length === 2 ? tree.pair.get(c[0]) : i === 0 ? tree.as1.get(c[0]) : tree.q3by.get(c[0] + '|' + c[1]));
            revealed = grade || Predict.judge(sel, correct);
            // 3번째 후보가 1번째에 따라 달라지는 갈림길은 이 경로의 정답으로 채점합니다
            count++;
            draw();
            SRS.grade(Data.forkKey(t, role, c[i]), revealed).catch(e => console.error('채점 저장 실패', e));
        };
        UI.bind(el, {
            chip: b => { if (revealed) return; const n = b.dataset.n; sel.has(n) ? sel.delete(n) : sel.add(n); draw(); },
            check: () => reveal(),
            dunno: () => reveal('again'),
            go: () => { TTS.stop(false); i++; sel = new Set(); revealed = null; draw(true); },
            again: () => { TTS.stop(false); newCombo(); draw(true); },
            quit: () => {
                UI.busy = false;
                DB.put('sessions', { date: U.today(), startedAt: started, mode: 'predict', minutes: Math.round((Date.now() - started) / 6000) / 10, count }).catch(console.error);
                if (opts.onDone) opts.onDone(); else history.back();
            }
        });
        newCombo(); draw(true);
    }
};

function layout(els) {

    const k = kindOf(e.locus), wantWall = WALL_KINDS.includes(k);
    const z0 = Math.floor(i * ZONES.length / n);
    const order = [...ZONES.keys()].filter(z => z >= z0).concat([...ZONES.keys()].filter(z => z < z0).reverse());
    for (const z of order) {
      const Z = ZONES[z], tryList = wantWall ? ['w', 'f'] : ['f', 'w'];
      const pick = tryList.find(t => Z[t] && !used.has(z + t));
      if (pick) { used.add(z + pick); out[e.no] = { zone: z, at: pick, kind: k, Z }; return; }

  } else {
    // 동네 길: 보도블록 + 앞쪽 차도, 뒤쪽은 가게 건물 두 줄
    s += poly([[0, 0, 0], [10, 0, 0], [10, 10, 0], [0, 10, 0]], 'var(--pave)');
    for (let i = 1; i < 10; i++) s += line([i, 0, 0], [i, 8.6, 0], 'var(--floor-line)', 0.7) + line([0, i * 0.86, 0], [10, i * 0.86, 0], 'var(--floor-line)', 0.7);
    s += poly([[0, 8.7, 0], [10, 8.7, 0], [10, 10, 0], [0, 10, 0]], 'var(--road)');
    for (let i = 0.5; i < 10; i += 1.6) s += line([i, 9.35, 0.01], [i + 0.8, 9.35, 0.01], 'var(--paper)', 2);
    s += poly([[0, 0, 0], [0, 10, 0], [0, 10, 9], [0, 0, 9]], tint('--brick', hue, 15)) + poly([[0, 0, 0], [10, 0, 0], [10, 0, 9], [0, 0, 9]], tint('--brick', hue + 40, 15));
    for (let c = 1.2; c < 10; c += 2.4) { s += lw(c - 0.7, 6.4, 1.4, 1.5, 'var(--glass)') + rw(c - 0.7, 6.4, 1.4, 1.5, 'var(--glass)'); }
    s += line([0, 0, 5.9], [0, 10, 5.9], 'var(--paper)', 3) + line([0, 0, 5.9], [10, 0, 5.9], 'var(--paper)', 3);
  }
  return s;
}

// ---------- 주제 데이터 ----------
function buildTopic(name) {
  const t = Data.topic(name); if (!t) return null;
  const els = t.chain.map((n, i) => {
    const info = Data.el(t, n);
    let link = info.link || '', why = '';
    const m = link.match(/^(.*)\s\(([^()]*)\)\s*$/); if (m) { link = m[1].trim(); why = m[2].trim(); }
    const scenes = [info.scene, info.scene1, info.scene2].filter(Boolean).map(v => {
      const [txt, nx = ''] = v.split('→');
      return { t: txt.trim(), next: nx.replace(/\(.*?\)/g, '').split('/').map(x => x.trim()).filter(x => t.chain.includes(x)) };
    });
    const s = info.scripts[0];
    const q = Data.question(info).en;
    return { name: n, type: info.type, no: info.locusNo || i + 1, locus: info.locus || `위치 ${i + 1}`, symbol: info.symbol, emoji: EMOJI[info.symbol] || '❔',
      link, why, signal: info.signal, scenes, q: info.answer.partial ? '' : q, refs: info.answer.refs, partial: info.answer.partial,
      sents: s ? Kw.forScript(s).sents.map(x => ({ t: x.text, k: x.kws })) : [] };
  });
  return { name, kind: Data.topicType(t), place: Data.place(t), chain: t.chain, combos: t.combos, els };
}

// ---------- 상태 ----------
const KEY = 'opicTrainer.palaceGame.';
const store = { get: (k, d) => U.lsGet(KEY + k, d), set: (k, v) => U.lsSet(KEY + k, v) };
let T, EL, tree, POS, ART, root, svg, panel, storyEl;
const st = { mode: 'walk', visited: new Set(), cur: null, combosDone: new Set(), streak: 0, best: 0, quiz: null };
const save = () => { store.set('mode', st.mode); store.set('topic', T.name); store.set('t.' + T.name + '.visited', [...st.visited]); store.set('t.' + T.name + '.combos', [...st.combosDone]); store.set('best', st.best); };

function loadTopic(name) {
  T = buildTopic(name);
  EL = Object.fromEntries(T.els.map(e => [e.name, e]));
  tree = { as1: {}, q3by: {}, pair: {} };
  const add = (m, k, v) => { (m[k] = m[k] || []).includes(v) || m[k].push(v); };
  T.combos.forEach(c => { if (c.length === 3) { add(tree.as1, c[0], c[1]); add(tree.q3by, c[0] + '|' + c[1], c[2]); } else add(tree.pair, c[0], c[1]); });
  if (T.name === '집' && T.els.every(e => HOME_LOCI[e.no])) { POS = HOME_LOCI; ART = homeArt(); }
  else {
    const slots = layout(T.els), hue = hueOf(T.name), props = []; POS = {};
    T.els.forEach(e => { const p = propArt(slots[e.no], hue); POS[e.no] = p.m; props.push({ s: `<g><title>${e.no}. ${esc(e.locus)}</title>${p.s}</g>`, d: slots[e.no].at === 'w' ? -1 : p.m[0] + p.m[1] }); });
    props.sort((a, b) => a.d - b.d);
    ART = roomArtFor(T) + props.map(p => p.s).join('');
  }
  st.visited = new Set(store.get('t.' + T.name + '.visited', [])); st.combosDone = new Set(store.get('t.' + T.name + '.combos', []));
  st.cur = null; st.quiz = null;
}
const candidates = (combo, step) => (combo.length === 3 ? (step === 0 ? tree.as1[combo[0]] : tree.q3by[combo[0] + '|' + combo[1]]) : tree.pair[combo[0]]) || [];
const nextsOf = e => [...new Set(e.scenes.flatMap(s => s.next))];
const pos = no => iso(...POS[no]);
const byNo = no => T.els.find(e => e.no === no);
const isHome = () => T.name === '집';
const homeIcon = e => isHome() && HOME_ICON[e.symbol];
const iconInner = e => homeIcon(e) ? `<g transform="scale(.93)">${HOME_ICON[e.symbol]}</g>` : `<text>${e.emoji}</text>`;
const iconHtml = e => homeIcon(e) ? `<svg viewBox="-20 -20 40 40" aria-hidden="true">${HOME_ICON[e.symbol]}</svg>` : `<span aria-hidden="true">${e.emoji}</span>`;
const say = text => { if (text) TTS.play(text, 'once', { title: T.name }); };

// ---------- 방 그리기 ----------
function drawRoom(opts = {}) {
  const { classes = {}, symbols = [], ghosts = [], beams = [], popId = null, mini = [] } = opts;
  let s = ART;
  s += `<polyline class="pg-path" points="${T.els.map(e => e.no).sort((a, b) => a - b).map(n => { const l = POS[n]; return pt(iso(l[0], l[1], 0.02)); }).join(' ')}"/>`;
  beams.forEach(([a, b]) => { const [x1, y1] = pos(a), [x2, y2] = pos(b); s += `<path class="pg-beam" d="M${x1},${y1} Q${(x1 + x2) / 2},${Math.min(y1, y2) - 60} ${x2},${y2}"/>`; });
  T.els.forEach(e => {
    const [x, y] = pos(e.no);
    const inner = mini.includes(e.no) && !symbols.includes(e.no)
      ? `<circle class="ring" cx="${x}" cy="${y}" r="14"/>${homeIcon(e) ? `<g transform="translate(${x},${y}) scale(.5)">${HOME_ICON[e.symbol]}</g>` : `<text class="emo" x="${x}" y="${y + 1}">${e.emoji}</text>`}
         <circle cx="${x + 12}" cy="${y - 11}" r="7.5" style="fill:var(--accent)" stroke="#fff" stroke-width="1.5"/><text x="${x + 12}" y="${y - 10.5}" style="fill:#fff;font-size:9px">${e.no}</text>`
      : `<circle class="ring" cx="${x}" cy="${y}" r="12"/><text x="${x}" y="${y + 0.5}">${e.no}</text>`;
    s += `<g class="pg-locus ${classes[e.no] || ''}" data-no="${e.no}" tabindex="0" role="button" aria-label="${e.no}번 ${esc(e.locus)}"><title>${e.no}. ${esc(e.locus)}</title>
      <circle class="pulse" cx="${x}" cy="${y}" r="13"/><circle cx="${x}" cy="${y}" r="22" fill="transparent"/>${inner}</g>`;
  });
  [...ghosts.map(n => [n, true]), ...symbols.map(n => [n, false])].forEach(([no, ghost]) => {
    const e = byNo(no), [x, y] = pos(no);
    s += `<g class="pg-sym ${ghost ? 'ghost' : ''} ${popId === no ? 'pop' : ''}"><g transform="translate(${x},${y - 40})">
      <path class="bubble" d="M-24 -22 h48 a6 6 0 0 1 6 6 v32 a6 6 0 0 1 -6 6 h-18 l-6 8 l-6 -8 h-18 a6 6 0 0 1 -6 -6 v-32 a6 6 0 0 1 6 -6 z"/>
      <g transform="translate(0,-1)">${iconInner(e)}</g></g></g>`;
  });
  svg.innerHTML = s;
}

// ---------- 패널 조각 ----------
function keywordBlock(e) {
  if (!e.sents.length) return '<p class="pg-hint">연결된 모범답변이 없습니다.</p>';
  return `<details class="pg-kws"><summary>답변 키워드 (${e.refs[0]}${e.partial ? ', 일부만 맞는 답변' : ''})</summary><div class="pg-sents">
    ${e.sents.map((x, i) => { const sa = UI.say(x.t, ''); return `<div class="pg-sent"><span class="n">${i + 1}</span><div class="flex flex-wrap gap-1">${(x.k.length ? x.k : ['문장 듣기']).map(k => `<button class="chip chip-blue kw-chip" ${sa}>${esc(k)}</button>`).join('')}</div></div>`; }).join('')}
  </div></details>`;
}
function questionBlock(e, showSignal = true) {
  const q = e.q;
  const text = q ? esc(q).replace(new RegExp(esc(e.signal).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), m => `<span class="pg-signal">${m}</span>`) : `… <span class="pg-signal">${esc(e.signal)}</span> …`;
  return `<p class="pg-q">${text}</p><div class="flex flex-wrap items-center gap-2"><button class="btn btn-soft text-sm" ${UI.say(q || e.signal)}><i class="fas fa-volume-high"></i> 질문 듣기</button>${showSignal ? `<span class="pg-hint">신호: <b>${esc(e.signal)}</b></span>` : ''}</div>`;
}
const nxtLabel = n => `${EL[n].no}. ${esc(EL[n].symbol)}`;
const sceneBlock = e => e.scenes.length
  ? e.scenes.map(sc => `<div class="scene text-sm">🎬 ${esc(sc.t)}<div class="pg-hint mt-1">→ 다음 후보: ${sc.next.map(nxtLabel).join(' · ')}</div></div>`).join('')
  : '<div class="scene text-sm">이 질문은 콤보의 마지막으로 나옵니다.</div>';
const linkCard = e => `<div class="pg-link">
    <div class="pg-link-head"><span class="place">📍 ${e.no}. ${esc(e.locus)}</span><span class="pg-hint">+</span><span class="obj">${esc(e.symbol)}</span></div>
    <div class="flex items-center gap-3"><div class="pg-badge">${iconHtml(e)}</div><p>${e.link ? esc(e.link) : '<span class="missing">연결 서술 미작성 (궁전 탭 연필 버튼으로 쓸 수 있음)</span>'}</p></div>
    ${e.why ? `<div class="pg-hint">왜 이 질문? ${esc(e.why)}</div>` : ''}</div>`;

function drawHeader() {
  root.querySelector('.pg-sub').textContent = `${T.kind} · ${T.place} · 위치 ${T.els.length}곳 · 콤보 ${T.combos.length}개`;
  root.querySelector('.pg-stats').innerHTML = `<span class="pg-stat">걸은 위치 <b>${st.visited.size}</b>/${T.els.length}</span><span class="pg-stat">완성한 콤보 <b>${st.combosDone.size}</b>/${T.combos.length}</span><span class="pg-stat">연속 정답 <b>${st.streak}</b> · 최고 ${st.best}</span>`;
  root.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === st.mode));
  root.querySelectorAll('.pg-pick').forEach(b => {
    b.classList.toggle('on', b.dataset.t === T.name);
    const t = Data.topic(b.dataset.t);
    b.classList.toggle('done', !!t && store.get('t.' + t.name + '.combos', []).length >= t.combos.length);
  });
}

// ---------- ① 걷기 ----------
const nextNo = () => { for (const e of T.els) if (!st.visited.has(e.no)) return e.no; return null; };
function renderWalk(pop) {
  UI.sayMap.clear();
  const nx = nextNo(), classes = {};
  st.visited.forEach(n => classes[n] = 'visited');
  if (nx) classes[nx] = (classes[nx] || '') + ' next';
  const cur = st.cur ? byNo(st.cur) : null;
  if (cur) classes[cur.no] += ' current';
  const nexts = cur ? nextsOf(cur).map(n => EL[n].no) : [];
  drawRoom({ classes, symbols: cur ? [cur.no] : [], mini: [...st.visited], beams: nexts.map(n => [cur.no, n]), popId: pop, ghosts: nexts });
  drawStory(cur ? cur.no : null);
  if (!cur) {
    panel.innerHTML = `<span class="pg-eyebrow">① 걷기 · 사슬 순서대로</span>
      <h2 class="pg-title">${nx ? `${nx}번 위치부터 걸어 보세요` : `${T.els.length}곳을 모두 걸었습니다`}</h2>
      <p class="pg-hint">${nx ? `빛나는 ${nx}번(${esc(byNo(nx).locus)})을 누르면 그 자리에 기호가 나타나고, 기호가 다음에 올 수 있는 질문 쪽으로 빛을 쏩니다.` : '이제 ② 다음 질문 맞히기에서 콤보를 맞혀 보세요.'}</p>
      ${nx ? '' : '<div class="flex gap-2"><button class="btn btn-primary text-sm" data-act="toQuiz">② 다음 질문 맞히기</button><button class="btn btn-gray text-sm" data-act="resetWalk">처음부터 다시 걷기</button></div>'}`;
    return;
  }
  const nn = nextNo();
  panel.innerHTML = `<span class="pg-eyebrow">${cur.no} / ${T.els.length} · ${esc(cur.type)} 질문 · ${esc(cur.name)}</span>
    <h2 class="pg-title">${cur.no}. ${esc(cur.locus)}</h2>
    ${linkCard(cur)}${questionBlock(cur)}${sceneBlock(cur)}${keywordBlock(cur)}
    <div>${nn ? `<button class="btn btn-primary text-sm" data-act="walkNext">다음: ${nn}. ${esc(byNo(nn).locus)}</button>` : '<button class="btn btn-primary text-sm" data-act="toQuiz">사슬 완주! ② 다음 질문 맞히기</button>'}</div>`;
}
function walkTo(no) {
  const nx = nextNo();
  if (!st.visited.has(no) && no !== nx) { flash(no, 'shake'); UI.toast(`순서대로 걸어요. 다음은 ${nx}번 ${byNo(nx).locus}입니다.`); return; }
  const fresh = !st.visited.has(no);
  st.visited.add(no); st.cur = no; save(); drawHeader(); renderWalk(fresh ? no : null);
}

// ---------- ② 다음 질문 맞히기 ----------
function newCombo() {
  const all = T.combos.map((c, i) => i), left = all.filter(i => !st.combosDone.has(i)), pool = left.length ? left : all;
  const idx = pool[Math.floor(Math.random() * pool.length)];
  st.quiz = { idx, combo: T.combos[idx], step: 0, phase: 'find', misses: 0, found: [], picks: new Set(), result: null };
}
function renderQuiz(pop) {
  UI.sayMap.clear();
  if (!st.quiz) newCombo();
  const z = st.quiz, e = EL[z.combo[z.step]], classes = {}, found = z.found.map(n => EL[n].no);
  let beams = [], ghosts = [];
  found.forEach(n => classes[n] = 'right');
  if (z.phase === 'find' && z.misses >= 2) classes[e.no] = 'cand';
  if (z.phase === 'predict') z.picks.forEach(n => classes[n] = 'picked');
  if (z.phase === 'checked') {
    const cand = candidates(z.combo, z.step).map(n => EL[n].no);
    cand.forEach(n => classes[n] = z.picks.has(n) ? 'right' : 'missed');
    z.picks.forEach(n => { if (!cand.includes(n)) classes[n] = 'wrong'; });
    beams = cand.map(n => [e.no, n]); ghosts = cand.filter(n => !found.includes(n));
  }
  const last = found.length ? found[found.length - 1] : null;
  drawRoom({ classes, symbols: z.phase === 'find' ? [] : (last ? [last] : []), mini: found, beams, ghosts, popId: pop });
  drawStory(z.phase === 'find' ? null : last);
  const head = `<span class="pg-eyebrow">② 콤보 ${z.idx + 1} · 질문 ${Math.min(z.step + 1, z.combo.length)} / ${z.combo.length}</span>`;
  const trail = `<div class="flex flex-wrap items-center gap-1">${z.combo.map((n, i) => `<span class="chip ${i < z.found.length ? 'chip-blue' : ''}">${i < z.found.length ? `${EL[n].no}. ${esc(EL[n].symbol)}` : `질문 ${i + 1}`}</span>`).join('<span class="pg-hint">→</span>')}</div>`;
  if (z.phase === 'find') {
    panel.innerHTML = `${head}${trail}<h2 class="pg-title">이 질문의 기호는 어디에 있나요?</h2>${questionBlock(e, false)}
      <p class="pg-hint">방에서 이 질문의 기호가 놓인 번호를 누르세요.${z.misses ? ` 틀린 횟수 ${z.misses}` : ''}${z.misses >= 2 ? ' · 정답 위치가 깜빡입니다.' : ''}</p>
      ${z.result ? `<div class="pg-msg bad">${z.result}</div>` : ''}`;
  } else if (z.phase === 'predict') {
    const cand = candidates(z.combo, z.step);
    panel.innerHTML = `${head}${trail}<div class="pg-msg good">정답! ${e.no}. ${esc(e.locus)} · <b>${esc(e.symbol)}</b></div>${linkCard(e)}
      <h2 class="pg-title">다음에 나올 수 있는 질문은?</h2>
      <p class="pg-hint">기호가 얽히는 장면을 떠올리며, 다음 후보 위치 <b>${cand.length}곳</b>을 방에서 골라 주세요. 다시 누르면 취소됩니다.</p>
      <div class="flex gap-2"><button class="btn btn-primary text-sm" data-act="check" ${z.picks.size ? '' : 'disabled'}>확인 (${z.picks.size}곳 고름)</button><button class="btn btn-gray text-sm" data-act="giveUp">모르겠어요</button></div>${keywordBlock(e)}`;
  } else if (z.phase === 'checked') {
    const cand = candidates(z.combo, z.step).map(n => EL[n].no), hit = cand.filter(n => z.picks.has(n)).length, extra = [...z.picks].filter(n => !cand.includes(n)).length;
    panel.innerHTML = `${head}${trail}<div class="pg-msg ${hit === cand.length && !extra ? 'good' : 'info'}">후보 ${cand.length}곳 중 ${hit}곳 맞힘${extra ? ` · 후보가 아닌 곳 ${extra}곳` : ''}</div>
      ${sceneBlock(e)}<p class="pg-hint">실제 시험에서는 이 중 하나가 나옵니다. 이번 콤보의 다음 질문을 들어 보세요.</p>
      <div><button class="btn btn-primary text-sm" data-act="nextQ">다음 질문 듣기 (질문 ${z.step + 2})</button></div>`;
  } else {
    st.combosDone.add(z.idx); save(); drawHeader();
    panel.innerHTML = `${head}${trail}<div class="pg-msg good"><b>콤보 완성!</b> ${z.combo.map(n => esc(EL[n].symbol)).join(' → ')}</div>${linkCard(e)}
      <p class="pg-hint">각 질문의 키워드를 보며 말로 이어 보세요.</p>${z.combo.map(n => keywordBlock(EL[n])).join('')}
      <div><button class="btn btn-primary text-sm" data-act="newCombo">${st.combosDone.size >= T.combos.length ? `${T.combos.length}개 모두 완성 · 다시 섞기` : '다른 콤보'}</button></div>`;
  }
}
function quizTap(no) {
  const z = st.quiz, e = EL[z.combo[z.step]];
  if (z.phase === 'find') {
    if (no === e.no) {
      z.found.push(e.name); st.streak++; st.best = Math.max(st.best, st.streak); save(); drawHeader();
      z.phase = z.step < z.combo.length - 1 ? 'predict' : 'done'; z.picks = new Set(); z.result = null; renderQuiz(no);
    } else { z.misses++; st.streak = 0; drawHeader(); z.result = `${no}번(${esc(byNo(no).symbol)})이 아닙니다.`; renderQuiz(); flash(no, 'wrong shake'); }
  } else if (z.phase === 'predict') {
    if (z.found.some(n => EL[n].no === no)) return;
    z.picks.has(no) ? z.picks.delete(no) : z.picks.add(no); renderQuiz();
  }
}

// ---------- 옆 목록: 한 바퀴 이야기 ----------
function drawStory(activeNo) {
  storyEl.innerHTML = T.els.map(e => {
    const locked = st.mode === 'walk' && !st.visited.has(e.no) && e.no !== nextNo();
    return `<li class="pg-item ${e.no === activeNo ? 'on' : ''} ${locked ? 'locked' : ''}" data-story="${e.no}">
      <span class="si">${iconHtml(e)}</span><div class="st">${e.no}. ${esc(e.locus)} <span>+ ${esc(e.symbol)} · ${esc(e.name)}</span></div>
      <p>${esc(e.link)}</p>
      ${e.scenes.length ? e.scenes.map(sc => `<div class="to">장면: ${esc(sc.t)} → <b>${sc.next.map(nxtLabel).join(' · ')}</b></div>`).join('') : '<div class="to">콤보의 마지막 질문 (다음 후보 없음)</div>'}</li>`;
  }).join('');
  root.querySelector('.pg-combos').innerHTML = `<b>콤보 ${T.combos.length}개</b>` + T.combos.map((c, i) =>
    `<div class="${st.combosDone.has(i) ? 'done' : ''}">${st.combosDone.has(i) ? '✓' : '·'} ${c.map(n => esc(EL[n].symbol)).join(' → ')} <span class="pg-hint">(${c.map(esc).join(' / ')})</span></div>`).join('');
  const on = storyEl.querySelector('.on');
  if (on) storyEl.scrollTo({ top: on.offsetTop - storyEl.offsetTop - 8, behavior: 'smooth' });
}

function flash(no, cls) { const g = svg.querySelector(`.pg-locus[data-no="${no}"]`); if (!g) return; g.classList.add(...cls.split(' ')); setTimeout(() => g.classList.remove(...cls.split(' ')), 600); }
const ACT = {
  walkNext: () => { const n = nextNo(); if (n) walkTo(n); },
  toQuiz: () => setMode('quiz'),
  resetWalk: () => { st.visited.clear(); st.cur = null; save(); draw(); },
  check: () => { st.quiz.phase = 'checked'; renderQuiz(); },
  giveUp: () => { st.quiz.picks = new Set(); st.quiz.phase = 'checked'; st.streak = 0; drawHeader(); renderQuiz(); },

                    <div class="kw-text ${Cards.hideSent ? 'hidden' : ''}" data-act="peek">${Cards.markKw(x.text, x.kws)}</div></div></div>`; }).join('')}</div>`;
            else if (mode === 'map') main = info.edges.length ? Cards.kwMap(info, focus) : '<p class="missing">이 답변에는 키워드 연결이 없습니다</p>';

                <div class="card">

                    ${linked.length ? `<div class="text-xs muted mb-2">궁전: ${linked.map(i => `${U.esc(i.topic.name)} · ${U.esc(i.name)}${i.symbol ? ' 🔹' + U.esc(i.symbol) : ''}`).join(' / ')}</div>` : ''}

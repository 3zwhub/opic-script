<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    <title>OPIc 트레이너</title>

    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        html, body { height: 100%; margin: 0; font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #f3f4f6; color: #1f2937; }
        body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        button, a, label, select, input { -webkit-tap-highlight-color: transparent; }
        #view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 24px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 16px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 0.95rem; transition: background-color .15s, opacity .15s; }
        .btn:disabled { opacity: .4; cursor: not-allowed; }
        .btn-primary { background: #2563eb; color: #fff; } .btn-primary:hover { background: #1d4ed8; }
        .btn-soft { background: #eff6ff; color: #1d4ed8; } .btn-soft:hover { background: #dbeafe; }
        .btn-gray { background: #e5e7eb; color: #374151; } .btn-gray:hover { background: #d1d5db; }
        .btn-red { background: #ef4444; color: #fff; } .btn-red:hover { background: #dc2626; }
        .btn-green { background: #16a34a; color: #fff; } .btn-green:hover { background: #15803d; }
        .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; }
        .chip-blue { background: #dbeafe; color: #1d4ed8; border-color: #bfdbfe; }
        .chip-amber { background: #fef3c7; color: #92400e; border-color: #fde68a; }
        .chip-green { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
        .chip-red { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
        .muted { color: #6b7280; }
        .missing { color: #9ca3af; font-style: italic; }
        .sec-title { font-size: 0.8rem; font-weight: 700; color: #6b7280; letter-spacing: .02em; margin: 18px 0 8px; }
        .tabbar { display: flex; background: #fff; border-top: 1px solid #e5e7eb; padding-bottom: env(safe-area-inset-bottom); }
        .tabbar button { flex: 1; padding: 8px 0 6px; font-size: 0.72rem; color: #6b7280; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .tabbar button i { font-size: 1.1rem; }
        .tabbar button.on { color: #2563eb; font-weight: 700; }
        .topbar { display: flex; align-items: center; gap: 8px; background: #fff; border-bottom: 1px solid #e5e7eb; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); }
        .topbar h1 { flex: 1; font-size: 1.05rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .icon-btn { width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: #4b5563; }
        .icon-btn:hover { background: #f3f4f6; }
        .row-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: #fff; border: 1px solid #e5e7eb; width: 100%; text-align: left; }
        .row-item:hover { border-color: #93c5fd; }
        .num { min-width: 28px; height: 28px; border-radius: 8px; background: #eff6ff; color: #1d4ed8; font-weight: 700; font-size: 0.85rem; display: inline-flex; align-items: center; justify-content: center; }
        .bar { height: 8px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
        .bar > span { display: block; height: 100%; background: #2563eb; border-radius: 999px; }
        .reveal { border: 1px dashed #cbd5e1; border-radius: 12px; padding: 12px; background: #f8fafc; }
        .link-box { background: #f0fdfa; border: 1px solid #99f6e4; border-radius: 12px; padding: 10px 12px; line-height: 1.6; font-size: 0.9rem; }
        .link-text { color: #0f766e; line-height: 1.5; }
        .scene { background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 12px; line-height: 1.6; }
        .answer-text { line-height: 1.9; font-size: 1.02rem; }
        .sentence { display: block; padding: 2px 6px; border-radius: 6px; margin-bottom: 4px; cursor: pointer; }
        .sentence:hover { background: #fef9c3; }
        .sentence.playing { background: #fde68a; }
        .sentence-num { color: #2563eb; font-weight: 700; font-size: 0.85em; margin-right: 4px; }
        .kw-row { display: flex; gap: 6px; align-items: flex-start; padding: 8px 6px; border-radius: 8px; border-top: 1px solid #f3f4f6; }
        .kw-row:first-child { border-top: 0; }
        .kw-row.playing { background: #fef3c7; }
        .kw-row .sentence-num { padding-top: 3px; }
        .kw-chip { cursor: pointer; }
        .kw-chip::before { content: ''; border-left: 6px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; margin-right: 2px; }
        .kw-chip.playing { background: #2563eb; color: #fff; border-color: #2563eb; }
        .kw-text { font-size: 0.95rem; line-height: 1.75; }
        .kw-text.hidden { color: transparent; user-select: none; cursor: pointer; background: repeating-linear-gradient(90deg, #e5e7eb 0 70%, transparent 70% 100%) 0 70% / 22px 2px repeat-x; }
        .kw-text.hidden .kw-mark { background: transparent; color: transparent; }
        .kw-mark { background: #fef3c7; color: #92400e; border-radius: 4px; padding: 0 2px; }
        .kw-map { overflow-x: auto; overflow-y: hidden; }
        /* 궁전 게임 (.pg 안에서만) */
        .pg { --accent: #1f6f78; --accent-soft: #e0f0f1; --glow: #f0a83a; --glow-soft: #fdf0d9; --bad: #d64545; --good: #2f8f4e;
              --wall-l: #dfe3ee; --wall-r: #cfd5e5; --floor: #c8b394; --floor-line: #b8a283; --rug: #8fa6c8; --wood: #a7774f; --sofa: #3f8274; --cushion: #e7b85a;
              --metal: #9aa3b5; --dark: #2c3142; --glass: #b9d6ea; --paper: #f7f3ea; --pave: #c9c4bb; --road: #555b68; --brick: #b98a74; --surface: #fff;
              max-width: 1320px; margin: 0 auto; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 12px; }
        .pg-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
        .pg-sub { color: #6b7280; font-size: .85rem; }
        .pg-stats { display: flex; gap: 6px; flex-wrap: wrap; }
        .pg-stat { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 3px 10px; font-size: .78rem; color: #6b7280; font-variant-numeric: tabular-nums; }
        .pg-stat b { color: #1f2937; }
        .pg-picker { display: flex; flex-direction: column; gap: 6px; }
        .pg-row { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding-bottom: 2px; }
        .pg-row > span { font-size: .72rem; font-weight: 700; color: #6b7280; white-space: nowrap; min-width: 62px; }
        .pg-pick { border: 1px solid #e5e7eb; background: #fff; border-radius: 999px; font-size: .8rem; padding: 3px 10px; white-space: nowrap; }
        .pg-pick small { color: #6b7280; margin-left: 4px; }
        .pg-pick.on { background: var(--accent); border-color: var(--accent); color: #fff; }
        .pg-pick.on small { color: #fff; opacity: .8; }
        .pg-pick.done::after { content: ' ✓'; color: var(--good); }
        .pg-pick.on.done::after { color: #fff; }
        .pg-modes { display: inline-flex; align-self: flex-start; background: #e5e7eb; border-radius: 12px; padding: 3px; gap: 3px; }
        .pg-modes button { font-weight: 700; font-size: .88rem; color: #6b7280; padding: 7px 13px; border-radius: 9px; }
        .pg-modes button.on { background: #fff; color: #1f2937; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
        .pg-stage { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, .95fr); gap: 12px; align-items: start; }
        @media (max-width: 1100px) { .pg-stage { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); } .pg-story { grid-column: 1 / -1; } }
        @media (max-width: 720px) { .pg-stage { grid-template-columns: 1fr; } }
        .pg-room, .pg-panel, .pg-story { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; min-width: 0; }
        .pg-room { padding: 6px; }
        .pg-room svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
        .pg-room-label { display: flex; justify-content: space-between; padding: 4px 8px 0; font-size: .8rem; color: #6b7280; }
        .pg-room-label b { font-size: 1rem; color: #1f2937; }
        .pg-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .75rem; color: #6b7280; padding: 2px 8px 6px; }
        .pg-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
        .pg-panel { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .pg-eyebrow { font-size: .72rem; font-weight: 700; color: #6b7280; letter-spacing: .04em; }
        .pg-title { font-size: 1.2rem; font-weight: 700; margin: 0; line-height: 1.3; }
        .pg-hint { color: #6b7280; font-size: .82rem; margin: 0; }
        .pg-q { font-style: italic; font-size: 1rem; line-height: 1.5; margin: 0; }
        .pg-signal { background: var(--glow-soft); border-radius: 4px; padding: 0 3px; font-weight: 600; }
        .pg-link { border: 1px solid #e5e7eb; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: #f9fafb; }
        .pg-link p { margin: 0; font-size: .93rem; line-height: 1.65; }
        .pg-link-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-weight: 700; font-size: .88rem; }
        .pg-link-head .place { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1px 8px; }
        .pg-link-head .obj { background: var(--glow-soft); border-radius: 8px; padding: 1px 8px; }
        .pg-badge { width: 48px; height: 48px; border-radius: 12px; background: var(--glow-soft); display: grid; place-items: center; flex-shrink: 0; font-size: 28px; line-height: 1; }
        .pg-badge svg { width: 38px; height: 38px; }
        .pg-msg { border-radius: 12px; padding: 9px 12px; font-size: .88rem; }
        .pg-msg.good { background: #dcfce7; } .pg-msg.bad { background: #fee2e2; } .pg-msg.info { background: var(--glow-soft); }
        .pg-kws summary { cursor: pointer; font-weight: 700; font-size: .88rem; }
        .pg-sents { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 280px; overflow-y: auto; }
        .pg-sent { display: flex; gap: 6px; align-items: flex-start; }
        .pg-sent .n { color: #2563eb; font-weight: 700; font-size: .78rem; padding-top: 3px; min-width: 18px; }
        .pg-story { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .pg-story h2 { font-weight: 700; font-size: 1rem; margin: 0; }
        .pg-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 720px; overflow-y: auto; }
        .pg-item { display: grid; grid-template-columns: 28px 1fr; gap: 0 8px; padding: 7px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
        .pg-item:hover { background: #f9fafb; }
        .pg-item.on { background: var(--glow-soft); border-color: var(--glow); }
        .pg-item.locked { opacity: .55; }
        .pg-item .si { width: 26px; height: 26px; border-radius: 8px; background: var(--glow-soft); display: grid; place-items: center; font-size: 16px; }
        .pg-item .si svg { width: 20px; height: 20px; }
        .pg-item .st { font-size: .82rem; font-weight: 700; line-height: 1.35; }
        .pg-item .st span { color: #6b7280; font-weight: 500; }
        .pg-item p { grid-column: 2; margin: 2px 0 0; font-size: .8rem; line-height: 1.55; }
        .pg-item .to { grid-column: 2; font-size: .76rem; color: #6b7280; margin-top: 3px; }
        .pg-item .to b { color: #1f2937; }
        .pg-combos { border-top: 1px solid #e5e7eb; padding-top: 8px; display: flex; flex-direction: column; gap: 3px; font-size: .78rem; }
        .pg-combos div.done { color: var(--good); }
        .pg .sh-r { filter: brightness(.88); } .pg .sh-l { filter: brightness(.74); }
        .pg-path { fill: none; stroke: var(--floor-line); stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; }
        .pg-beam { fill: none; stroke: var(--glow); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 6 8; animation: pgflow 1s linear infinite; opacity: .9; }
        .pg-locus { cursor: pointer; }
        .pg-locus .ring { fill: #fff; stroke: var(--accent); stroke-width: 2.5; }
        .pg-locus text { font-weight: 700; font-size: 12px; fill: var(--accent); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
        .pg-locus text.emo { font-size: 15px; }
        .pg-locus.visited .ring { fill: var(--glow-soft); }
        .pg-locus.current .ring { stroke: var(--glow); stroke-width: 3.5; }
        .pg-locus .pulse { fill: none; stroke: none; }
        .pg-locus.next .pulse, .pg-locus.cand .pulse { stroke: var(--glow); stroke-width: 3; animation: pgpulse 1.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
        .pg-locus.picked .ring { stroke: var(--glow); stroke-width: 4; fill: var(--glow-soft); }
        .pg-locus.wrong .ring { stroke: var(--bad); fill: #fee2e2; }
        .pg-locus.right .ring { stroke: var(--good); stroke-width: 3.5; fill: var(--glow-soft); }
        .pg-locus.missed .ring { stroke: var(--glow); stroke-dasharray: 3 3; }
        .pg-locus.shake { animation: pgshake .35s; }
        .pg-sym { pointer-events: none; }
        .pg-sym .bubble { fill: #fff; stroke: var(--glow); stroke-width: 2; }
        .pg-sym text { font-size: 28px; text-anchor: middle; dominant-baseline: central; }
        .pg-sym.pop { animation: pgpop .45s cubic-bezier(.2, 1.6, .4, 1) both; transform-box: fill-box; transform-origin: 50% 100%; }
        .pg-sym.ghost { opacity: .55; }
        @keyframes pgpulse { from { transform: scale(1); opacity: .9; } to { transform: scale(2.1); opacity: 0; } }
        @keyframes pgshake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
        @keyframes pgpop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pgflow { to { stroke-dashoffset: -28; } }
        @media (prefers-reduced-motion: reduce) { .pg-beam, .pg-locus .pulse, .pg-sym.pop, .pg-locus.shake { animation: none !important; } }
        .kw-map svg { display: block; }
        .blank { display: inline-block; min-width: 2.5em; border-bottom: 2px solid #94a3b8; color: transparent; cursor: pointer; }
        .blank.shown { color: #1d4ed8; border-color: transparent; }
        .timer { font-variant-numeric: tabular-nums; font-size: 2.4rem; font-weight: 700; }
        .timer.under { color: #6b7280; } .timer.good { color: #16a34a; } .timer.over { color: #d97706; }
        .rec-dot { width: 12px; height: 12px; border-radius: 50%; background: #ef4444; animation: pulse 1s infinite; display: inline-block; }
        @keyframes pulse { 50% { opacity: .3; } }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; width: 18px; height: 18px; animation: spin 1s linear infinite; display: inline-block; }
        .spinner.dark { border-color: rgba(0,0,0,.1); border-top-color: #2563eb; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
        @media (min-width: 640px) { .modal-bg { align-items: center; } }
        .modal { background: #fff; width: 100%; max-width: 560px; max-height: 90dvh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
        @media (min-width: 640px) { .modal { border-radius: 20px; } }
        .field label { display: block; font-size: 0.8rem; font-weight: 700; color: #4b5563; margin-bottom: 4px; }
        .field input, .field textarea, .field select { width: 100%; border: 1px solid #d1d5db; border-radius: 10px; padding: 9px 10px; font-size: 0.95rem; outline: none; background: #fff; }
        .field input:focus, .field textarea:focus, .field select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px #dbeafe; }
        .seg { display: inline-flex; background: #f3f4f6; border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
        .seg button { padding: 6px 12px; border-radius: 9px; font-size: 0.85rem; font-weight: 600; color: #4b5563; }
        .seg button.on { background: #fff; color: #1d4ed8; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
        #toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; transition: all .25s; background: #111827; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 0.9rem; z-index: 200; pointer-events: none; max-width: calc(100% - 32px); }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }
        .tnode { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 8px; background: #f3f4f6; border: 1px solid #e5e7eb; font-weight: 600; font-size: 0.9rem; }
        .tnode.q1 { background: #dbeafe; border-color: #93c5fd; color: #1e3a8a; }
        .tnode.q14 { background: #fee2e2; border-color: #fca5a5; color: #7f1d1d; }
        .tnode.q3 { background: #fff; font-weight: 500; }
        .tkids { margin-left: 14px; padding-left: 12px; border-left: 2px solid #e5e7eb; }
        .check-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f3f4f6; }
        .check-row input { width: 20px; height: 20px; margin-top: 2px; flex-shrink: 0; }
    </style>
</head>
<body>
    <header class="topbar">
        <button id="backBtn" class="icon-btn hidden" aria-label="뒤로"><i class="fas fa-chevron-left"></i></button>
        <h1 id="pageTitle">OPIc 트레이너</h1>
        <button id="ttsStopTop" class="icon-btn hidden" aria-label="음성 정지"><i class="fas fa-stop text-red-500"></i></button>
        <button id="settingsBtn" class="icon-btn" aria-label="설정"><i class="fas fa-gear"></i></button>
    </header>

    <main id="view"></main>

    <nav class="tabbar" id="tabbar">
        <button data-tab="today"><i class="fas fa-sun"></i>오늘</button>
        <button data-tab="palace"><i class="fas fa-house"></i>궁전</button>
        <button data-tab="drill"><i class="fas fa-dumbbell"></i>드릴</button>
        <button data-tab="records"><i class="fas fa-chart-simple"></i>기록</button>
        <button data-tab="library"><i class="fas fa-book"></i>자료실</button>

    <div id="modalRoot"></div>
    <div id="toast"></div>

<!-- 내장 데이터 (빌드할 때 프로젝트 폴더의 파일을 그대로 넣음) -->
<script type="text/plain" id="seed-combos">
# OPIc 서베이 콤보 원본 (source of truth)
# 이 파일만 고치면 앱용 txt와 문서 표를 다시 만들 수 있게 하는 것이 목표.
#
# 형식
#   == 주제 | 유형: 서베이 | 공통형 | 장소: 궁전의 위치 | 출처: (선택)
#   사슬: 요소 > 요소 > ...          방 안에서 위치를 걷는 순서 (전체 목록 암송용. 시험 순서가 아님)
#   콤보: 요소 / 요소 / 요소          시험에서 연달아 나오는 묶음 (2~3개). 갈림길 트리는 이 줄들로 계산
#   - 요소                            요소 블록 시작. 아래 필드는 2칸 들여쓰기
#     유형: 묘사 | 루틴 | 경험 | 비교 | 이슈
#     답변: Q번호 (여러 개면 쉼표, 없으면 "없음", 일부만 맞으면 "일부 Q번호")
#     위치: 번호. 방 안의 실제 물건·자리
#     기호: 이 질문을 뜻하는 물건 하나 (주제 안에서 겹치지 않게)
#     연결: 위치와 기호를 한 그림으로 묶는 서술 (그 자리에 기호가 어떻게 놓였나, 괄호 안 = 기호가 그 질문인 이유)
#     신호: 영어 질문을 듣고 이 질문임을 알아보는 단서 구절
#     장면: 이 기호가 '다음에 올 수 있는 질문들'의 기호와 얽히는 장면 → 후보1 / 후보2
#           (마지막에만 나오는 질문은 비움. 1번째·2번째로 나올 때 후보가 다르면 장면1/장면2로 나눔)
#     K: 영어 키워드 (쉼표 구분, 답변 연습용)
#     원문: 교재 문항 설명 그대로 (선택, '||' = 표기가 다른 같은 문항)
#     난이도: Int | Adv (선택, 교재 표시)
#     메모: 자유 기록 (선택)
#
# 규칙
#   - 사슬의 모든 요소는 요소 블록이 하나씩 있어야 하고, 콤보의 요소는 모두 사슬에 있어야 한다.
#   - 주제 추가: == 블록을 새로 쓴다. 콤보 수정: 콤보 줄만 고친다.
#   - 사슬은 콤보에서 요소가 처음 나온 순서와 같아야 한다 (기존 8개 주제 모두 이 규칙).
#   - 궁전은 '다음 질문 예측'용이다: 방 = 주제, 위치 = 질문, 장면 = 다음 후보를 가리킴.
#     공통 규칙: 묘사로 열고 → (루틴) → 과거·비교 → 경험·문제로 닫는다. 14번 변화 → 15번 이슈.
#   - 공통형(돌발) 답변은 '일반 묘사 → 나의 습관 → 과거 비교 → 문제·기억' 4칸 틀로 조립한다.
#   - '#'으로 시작하는 줄은 주석.

  기호: 반쯤 싼 여행 가방
  연결: 현관 바닥에 반쯤 싼 여행 가방이 지퍼가 벌어진 채 누워 있다. 나갈 때마다 발에 걸린다. (반쯤 싼 가방 = 떠나기 전 → 여행 준비 과정)
  신호: prepare to take trips
  장면: 여행 가방을 닫으려 누르자 낡은 폴라로이드 카메라가 튀어나오고 그 사이로 금 간 스노볼이 굴러 나와 눈보라를 뿜는다 → 경험 / 어릴때
- 경험
  유형: 경험
  답변: Q022
  위치: 3. 현관문 손잡이
  기호: 금 간 스노볼
  연결: 현관문 손잡이에 금 간 스노볼이 끈으로 매달려 흔들린다. 그 여행에서 사 온 기념품이다. (금 간 스노볼 = 잊지 못할 사건 → 특별한 여행 경험)
  신호: one unforgettable travel experience
- 어릴때
  유형: 경험
  답변: Q023
  위치: 4. 우산꽂이
  기호: 낡은 폴라로이드 카메라
  연결: 우산꽂이 안에 우산 대신 낡은 폴라로이드 카메라가 꽂혀 있다. 어릴 때 가족 여행에 들고 다니던 것이다. (폴라로이드 = 어린 시절 사진 → 어릴 때 여행)
  신호: trips you took in your youth
  장면: 폴라로이드 카메라가 사진 대신 금 간 스노볼을 퉤 뱉어내 바닥에서 산산조각 난다 → 경험
- 어려워진이유
  유형: 비교
  답변: Q024
  위치: 5. 중문
  기호: 내려간 톨게이트 차단기
  연결: 현관 중문 앞에 톨게이트 차단기가 내려와 있어 들어가려면 허리를 숙여야 한다. (내려간 차단기 = 길이 막힘 → 여행이 어려워진 이유)
  신호: more difficult in the past
  장면: 톨게이트 차단기가 쾅 내려오자 갇힌 운전자들이 걱정 인형을 창밖으로 한 움큼씩 던진다 → 걱정
- 걱정
  유형: 이슈
  답변: Q025
  위치: 6. 현관 거울
  기호: 걱정 인형
  연결: 현관 거울 테두리에 걱정 인형들이 빼곡히 꽂혀 있어, 거울을 볼 때마다 걱정스러운 얼굴들이 함께 비친다. (걱정 인형 = 걱정거리 → 여행 관련 걱정)
  신호: main issues or concerns

== 해외여행 | 유형: 서베이 | 장소: 베란다
사슬: 장소 > 하는일 > 처음 > 경험 > 관광객장소 > 관광객루틴 > 과거현재
콤보: 장소 / 하는일 / 처음
콤보: 장소 / 처음 / 경험

콤보: 과거현재 / 관광객루틴

- 장소
  유형: 묘사
  답변: Q026
  위치: 1. 베란다 창문
  기호: 외국 도시 그림엽서
  연결: 베란다 창문 유리에 외국 도시 그림엽서들이 붙어 있어, 창밖 풍경 대신 외국 거리가 보인다. (그림엽서 = 가 본 도시 → 방문한 나라 묘사)
  신호: countries or cities you've visited
  장면: 그림엽서 속 도시에서 빵빵한 관광 배낭이 걸어 나오더니 빨간 첫 여권을 꺼내 엽서에 도장을 쾅 찍는다 → 하는일 / 처음
- 하는일
  유형: 루틴
  답변: Q027
  위치: 2. 빨래 건조대
  기호: 빵빵한 관광 배낭
  연결: 빨래 건조대에 빵빵한 관광 배낭이 걸려 있고, 지도와 카메라가 주머니마다 삐져나와 있다. (관광 배낭 = 여행지에서 하는 일 → 해외여행 활동)
  신호: things you like to do when visiting
  장면: 관광 배낭이 펑 터지며 빨간 첫 여권이 하늘로 솟구쳐 펄럭인다 → 처음
- 처음
  유형: 경험
  답변: Q028
  위치: 3. 화분 받침
  기호: 빨간 첫 여권
  연결: 화분 받침 위에 빨간 첫 여권이 흙에 반쯤 묻혀 있다. 처음 나라 밖으로 나가던 날 받은 여권이다. (첫 여권 = 첫 해외여행 → 첫 경험)
  신호: your first trip to another country
  장면: 첫 여권을 펼치자 입국 도장들이 튀어나와 분실 캐리어 꼬리표에 마구 찍히고, 단체 관광 가이드 깃발을 빼앗아 흔든다 → 경험 / 관광객루틴 (장소에서 왔으면 경험만)
- 경험
  유형: 경험
  답변: Q029
  위치: 4. 세탁기 위
  기호: 분실 캐리어 꼬리표
  연결: 세탁기 위에 분실 캐리어 꼬리표가 수북하다. 짐을 잃어버렸던 그 여행에서 받은 것이다. (분실 꼬리표 = 해외에서 생긴 일 → 특별한 해외 경험)
  신호: a specific story abroad
- 관광객장소
  유형: 묘사
  답변: 일부 Q031
  위치: 5. 베란다 난간
  기호: 에펠탑 열쇠고리
  연결: 베란다 난간에 에펠탑 열쇠고리가 주렁주렁 매달려 바람에 흔들린다. (에펠탑 = 관광객이 보러 가는 곳 → 관광객 관심 장소)
  신호: most interested in seeing
  장면: 에펠탑 열쇠고리가 창처럼 날아가 빨간 첫 여권을 꿰뚫고 대롱대롱 매달린다 → 처음
- 관광객루틴
  유형: 루틴
  답변: Q031
  위치: 6. 접이식 의자
  기호: 단체 관광 가이드 깃발
  연결: 접이식 의자에 단체 관광 가이드 깃발이 꽂혀 있고, 의자 앞에 줄을 서라는 발자국 스티커가 붙어 있다. (가이드 깃발 = 단체 관광 → 관광객의 일정)
  신호: what tourists usually do
- 과거현재
  유형: 비교
  답변: Q030
  위치: 7. 베란다 수납장
  기호: 낡은 종이 비행기표
  연결: 베란다 수납장 문을 열면 낡은 종이 비행기표 묶음이 쏟아진다. 요즘은 모바일 탑승권이라 볼 일 없는 물건이다. (종이 비행기표 = 예전 여행 → 해외여행 변화)
  신호: how has traveling changed
  장면: 낡은 종이 비행기표가 바람에 휘날리다 단체 관광 가이드 깃발로 변해 펄럭인다 → 관광객루틴

== 집휴가 | 유형: 서베이 | 장소: 욕실
사슬: 사람 > 할일 > 지난번 > 경험 > 과거현재 > 중요이유
콤보: 사람 / 할일 / 지난번
콤보: 사람 / 지난번 / 경험
콤보: 과거현재 / 중요이유

- 사람
  유형: 묘사
  답변: Q032
  위치: 1. 욕실 문
  기호: 초대 손님 명단
  연결: 욕실 문에 초대 손님 명단이 테이프로 붙어 있어, 들어갈 때마다 보고 싶은 사람들 이름을 읽게 된다. (초대 명단 = 만나고 싶은 사람 → 휴가 때 볼 사람)
  신호: people you would like to see
  장면: 초대 명단이 두루마리처럼 길게 풀려 보드게임 상자를 꽁꽁 묶고, 찢어진 휴가 달력까지 칭칭 감는다 → 할일 / 지난번
- 할일
  유형: 루틴
  답변: Q033
  위치: 2. 세면대
  기호: 보드게임 상자
  연결: 세면대 위에 보드게임 상자가 놓여 있고, 말 몇 개가 비누 받침에 굴러가 있다. (보드게임 = 함께 할 일 → 휴가 때 하고 싶은 일)
  신호: things you would like to do with
  장면: 보드게임 상자에서 말들이 뛰쳐나와 찢어진 휴가 달력 위를 줄지어 행진한다 → 지난번
- 지난번
  유형: 경험
  답변: Q034
  위치: 3. 욕실 거울
  기호: 찢어진 휴가 달력
  연결: 욕실 거울에 찢어진 휴가 달력 한 장이 붙어 있어, 지난 휴가 날짜에 동그라미가 쳐져 있다. (찢어진 달력 = 지난 휴가 → 지난번 집 휴가)
  신호: last vacation you spent at home
  장면: 찢어진 달력 장이 휙휙 넘어가다 마지막 장에서 깜짝 선물 상자가 펑 터져 나온다 → 경험
- 경험
  유형: 경험
  답변: Q035
  위치: 4. 욕조
  기호: 깜짝 선물 상자
  연결: 욕조 안에 깜짝 선물 상자가 리본째 담겨 있다. 물을 틀려다 깜짝 놀란다. (깜짝 상자 = 뜻밖의 일 → 예상치 못한 휴가 경험)
  신호: unusual, unexpected, or satisfying
- 과거현재
  유형: 비교
  답변: Q036
  위치: 5. 수건 선반
  기호: 옛날 비디오테이프
  연결: 수건 선반 맨 위에 수건 대신 옛날 비디오테이프가 쌓여 있다. 예전 휴가엔 비디오를 빌려 봤다. (비디오테이프 = 예전 휴가 → 과거와 달라진 점)
  신호: vacations different from the past
  장면: 옛날 비디오테이프가 줄줄 풀려 나와 비타민 병을 칭칭 감아 꽉 조인다 → 중요이유
- 중요이유
  유형: 이슈
  답변: Q037
  위치: 6. 약장
  기호: 비타민 병
  연결: 약장 문을 열면 비타민 병이 한가득이다. 쉬어야 몸이 산다는 뜻이다. (비타민 = 건강 회복 → 휴가가 중요한 이유)
  신호: important benefits of vacation

  유형: 루틴
  답변: Q039
  위치: 2. 침대 머리맡
  기호: 커다란 팝콘 통
  연결: 침대 머리맡에 커다란 팝콘 통이 놓여 있어, 누우면 버터 냄새가 난다. (팝콘 통 = 극장에서 하는 일 → 영화관 루틴)

  장면: 팝콘 통이 폭발하며 튀어나온 팝콘이 구겨진 영화표에 덕지덕지 들러붙는다 → 최근

  신호: last time you went to the movies
  장면: 구겨진 영화표가 날개를 펴고 명작 DVD 케이스 사이를 날아다니다 배우 사인 색지를 휘감는다 → 기억 / 배우

  답변: Q042

  신호: a memorable movie

  위치: 5. 옷장 문

  신호: one of your favorite actors

  신호: compare movies made today
  장면: 흑백 필름 릴이 끝없이 풀리며 만화 말풍선 쿠션들이 줄줄이 튀어나와 시끄럽게 떠든다 → 토픽

  답변: Q045

  신호: topics or issues regarding movies

A: The two types of music I want to compare are hip-hop and R&B. There are similarities and differences between the two types. Let me start off with the similarities first. As far as I know, both types put people in a good mood. In addition, I believe that both hip-hop and R&B never go out of style. Both types have been all the rage over the past few decades. However, the differences between the two outweigh such similarities. R&B is characterized by mellow melodies and soaring vocals. The songs are usually about falling in love or breaking up, so they make me think about my own relationships a lot. On the other hand, hip-hop has much more energy. There’s usually a strong underlying beat. It always makes me want to get up and dance. I personally believe hip-hop is better. This is mainly because of the way that it is sung. The lyrics are rapped, which makes it sound more like a chant rather than singing. It’s cool because rappers use their voice as a sort of musical instrument. No matter what, I love listening to both types of music!

A: Haeundae is probably the most renowned beach in Korea.
Actually, it is known as the number one tourist site among tourists.
Since it is located along the sea, you can enjoy the beautiful scenery 24/7.
However, I recommend you go at nighttime.
At night, the lights from the bridge over the sea create a stunning view.
I feel like I am over the moon when I admire the view at night.
What’s more, there are many facilities in Haeundae Beach, such as bicycle rental shops and drinking fountains.

It’s much faster than ordinary trains.

A: Without a doubt, the people I want to see most during my vacation are my close friends. Life gets so busy, and honestly, it feels like it’s been way too long since we’ve all had a chance to properly connect. My ideal plan would be to just find a comfortable spot, maybe grab a coffee or some drinks, and simply talk for hours. It’s not about doing anything fancy; it's really about the conversation itself. We could catch up on what’s really going on in our lives, discuss our plans for the future, and just share stories and laugh like we used to. Honestly, for me, reconnecting with them and sharing that kind of genuine time together would be the most relaxing and fulfilling vacation I can imagine.

기술04-Q125-기술 의존성으로 인한 문제 경험 (고장 등): Problems often come up because of our dependence on technology. Think about a time when you experienced a problem because some piece of technology was not working properly. Maybe your computer crashed or maybe your cell phone had no service. Tell me about a time when you had some kind of problem getting your technology to work.
A: I recently had a genuinely annoying experience while trying to meet a colleague downtown. I rely entirely on my phone for everything—navigation, ride-share apps, and contactless payment. I thought I had plenty of charge, maybe 30 percent, but the GPS and running background apps drained it almost instantly. It died right when I was halfway through confirming my Lyft.

날씨01-Q126-국내 날씨 (사계절, 특징): Tell me about the weather in your country. Are there different seasons? What is the weather typically like?
A: Korea has four distinct seasons: spring, summer, fall and winter. The weather is very nice in spring and fall. The temperatures are mild and it is great for outdoor activities. People like to go hiking or camping and go on picnics during these seasons. They also do a lot of outdoor sports such as soccer, basketball or tennis. On the other hand, summer is scorching hot. It is very humid and sticky and people sweat a lot. We have the rainy season in summer and it pours. Winter is the complete opposite. It is freezing cold and the morning lows drop to -10 degrees Celsius very often. We need to bundle up to keep ourselves warm when we go outside. Plus, we get a lot of snow in winter. It is very slippery when it snows, so we have to be careful NOT to slip and fall. Once again, there are four distinct seasons in Korea.

A: When I have to make appointments, I first look for a phone number. Sometimes, I have it on my phone. If not, I do a search online. And then, I make a call to make an appointment. I ask them when they are available. I tell them when I want to come in and fix the time. I usually get a text message confirming my appointment. So, this is what I do when I make appointments.

서비스 예약03-Q149-어린 시절 약속 관련 추억 (장소, 느낌): Tell me about an appointment you remember from your childhood. Maybe you visited a doctor, the dentist or a new school. Tell me about the place you went to for this appointment. What were your impressions? How did you feel?
A: The appointment I vividly remember wasn't scary, but totally new: my first proper haircut at a real salon, not just the local barber. The place was overwhelming. It smelled strongly of chemicals, and the noise from all the hairdryers was constant, buzzing with activity. I felt tiny sitting up high in the huge chair, staring at myself in the massive mirror under the harsh fluorescent lights.
My stylist, who had bright purple hair, seemed impossibly cool. The initial feeling was a mix of nervousness and excitement—I kept worrying she would accidentally snip my ear. But when she finally spun me around and I saw the finished style, I felt incredibly grown up and proud. It was the first time I realized a haircut could actually make you feel completely transformed.
K: first proper haircut, real salon, not the local barber, overwhelming, smell of chemicals, hairdryers buzzing, tiny in the huge chair, massive mirror, fluorescent lights, stylist with purple hair, impossibly cool, nervousness and excitement, snip my ear, grown up and proud, completely transformed

서비스 예약04-Q150-기억에 남는 약속 경험 (예상치 못한 일): Sometimes, funny or surprising things happen during an appointment. Tell me about an appointment that you remember for some reason. Tell me everything that happened and why this appointment was so memorable.
A: I had a pretty standard dentist appointment just last month, but it turned into the most memorable, and hilarious, visit ever. The hygienist—she was actually quite new—started talking excitedly about her recent engagement while her tools were literally still in my mouth.
She pulled out her phone and was like, "Wait, you have to see this ring! Isn't he cute?" Naturally, I couldn't say a single word back, so I was stuck making these muffled "Mmmph" noises, trying to nod enthusiastically with my mouth stretched open. She kept asking questions about wedding venues, totally oblivious to the fact that she was trapped in a completely one-sided conversation.
When she finally removed the tools and let me rinse, I just burst out laughing. We both realized how ridiculous the whole scenario was, and she apologized profusely. It was such a silly, genuine moment; definitely the most human interaction I’ve ever had while getting my teeth cleaned.

자유시간01-Q151-국내 사람들이 여가 시간에 가는 장소: Tell me about some places people in your country like to spend their free time. Do they visit parks, beaches or other places? What are some popular free time locations?
A: Koreans do various types of outdoor activities in their free time. Because there are many rivers, there are riverside parks along the river. People can get some exercise and get some fresh air there. Also, because there are many mountains, people like to go hiking or camping to the mountains. There are many ski resorts on the mountains, so many people like to go skiing or snowboarding in the winter season. Next, because there are many beaches, some people like to go on vacations to coastal areas. Once again, people do various types of outdoor activities.

자유시간02-Q152-국내 인기 여가 활동: What do people in your country like to do in their free time? What are some popular free time activities?
A: People commonly have gatherings at bars in their free time. First, they typically have social gatherings. When they get together, they grab some drinks with their friends. Drinks break the ice and loosen up the mood. They sometimes play drinking games. They also do several rounds moving from one bar to another. Plus, people have staff-dinners at bars. It is a great chance to bond with their co-workers. They can get closer after they have some drinks together. Also, people go to bars for after-parties. These parties are normally held after a main event. Next, people go to bars for special occasions such as birthday parties. Drinks spice up the mood at these events. So, these are the types of gatherings people commonly have in their free time.

자유시간03-Q153-과거 대비 현재 여가 시간 변화: Do you have more or less free time now than you did in the past? Describe for me how your free time has changed over time.
A: That’s a great question. Honestly, I have significantly more free time now than I did when I was younger, even if my schedule today still feels packed.
My student years, particularly high school, were absolutely relentless. We’d be in regular classes from early morning, then immediately transition to cram schools or academies until late at night. Free time wasn't about relaxing; it was just the small, panicked gaps between studying for the next major exam. I remember staying up all night constantly just preparing for midterms or final applications.
The biggest shift is the *nature* of that time. Back then, all pressure was external—dictated by grades and college requirements. Now, even when I’m busy with work, the free time I do carve out is intentional. It’s for hobbies, fitness, or socializing—time that I *choose* to spend. That ability to choose is the definition of having 'more' free time.
K: more free time now, schedule still packed, student years relentless, regular classes from early morning, cram schools until late, small panicked gaps, major exams, staying up all night, midterms, the nature of that time, external pressure, grades and college, intentional free time, hobbies fitness socializing, ability to choose

자유시간04-Q154-최근 여가 시간에 했던 일: Tell me about the last time you had some free time. What did you do? Who did you spend your free time with? Tell me everything that happened the last time you had some free time.
A: I remember going to watch a movie with my friend recently. We went to a theater in the downtown area. Before watching the movie, we did some shopping at some stores. We bought a shirt, a jacket, a hat and some earrings. We also had some coffee at a coffee shop. After watching the movie, we went to a decent Italian restaurant. They had the best Italian food in town. The food tasted extra good because I was starving. The seafood in the dish was so juicy and tender. We also ordered various side dishes. Plus, we grabbed some drinks while having the meal. I was very happy with the meal I had there. I look forward to going there again if I have the chance. After dinner, we went to a bar to have some beer. Looking back, it was a very enjoyable day.

휴일01-Q155-국내 인기 공휴일, 기념 장소 및 방식: Tell me about some popular holidays in your country. Where do people typically celebrate their holidays? What kinds of things do they use to celebrate?
A: In Korea, the two most important holidays are Seollal, or Lunar New Year, and Chuseok, the Harvest Festival. These are intense periods of family reunion, often called the ‘great migration’ because everyone travels back to their hometowns, usually gathering at the parental or grandparents’ home.
The celebration focuses heavily on food and tradition. We prepare huge festive tables for ancestor rites, called *charye*, and then share specialized foods like *tteokguk* or *songpyeon*. While celebrating, the biggest items exchanged are modern gift sets. These days, rather than small trinkets, people rely on practical, high-value items—think premium beef, health supplements, or large gift certificates. It’s a hectic but cherished time devoted entirely to family connections.
K: Seollal and Chuseok, Lunar New Year, Harvest Festival, family reunion, great migration, back to hometowns, grandparents' home, food and tradition, festive tables, charye ancestor rites, tteokguk or songpyeon, modern gift sets, premium beef, health supplements, gift certificates, hectic but cherished

휴일02-Q156-특정 공휴일 기념 방식 (상세 활동): Choose one of the holidays you just told me about. Tell me all of the things people typically do to celebrate this holiday. What activities are involved?
A: I’ll choose Chuseok, our Korean Thanksgiving. It is truly the biggest family holiday of the year, and the celebration actually begins with massive national travel; millions of people hit the road to go back to their ancestral homes, so the highway traffic is always insane!
Once the family gathers, the main focus shifts to ancestral respect and food. We spend hours preparing a massive feast, including traditional dishes like *songpyeon* rice cakes. Early on the morning of Chuseok, we hold the ancestral memorial ceremony, called *charye*, to thank them for the harvest. After that, we typically visit the family graves to clean them and pay our respects. The rest of the holiday is spent feasting, drinking traditional rice wine, catching up, and playing board games like *yutnori*. It’s a meaningful blend of honoring the past and celebrating the present.
K: Chuseok, Korean Thanksgiving, biggest family holiday, massive national travel, ancestral homes, insane highway traffic, ancestral respect and food, massive feast, songpyeon rice cakes, charye memorial ceremony, thank for the harvest, visit family graves, rice wine, yutnori, honoring the past

휴일03-Q157-어린 시절 특별한 공휴일 추억: Describe for me a special holiday memory that you have from your childhood. Tell me where you were and what the place looked like and everything you remember from the holiday scene.
A: I remember going to a theme park during the holidays when I was a kid. I was jumping up and down because I was so excited. There were many rides at the amusement park. I could NOT wait to go on the rides. The one I remember the most was the rollercoaster. There was a long line for it, but it was worth the wait. I remember being a bit scared at first, but it was fun at the end. For lunch, I remember getting some burgers and fries. I also ate some pizza and pasta. The food tasted extra good because I was starving. I also remember getting some ice-cream and cotton candy. So, this was what I did during the holidays when I was a kid.

휴일04-Q158-공휴일 관련 이슈/걱정거리 및 해결 노력: What are some issues or concerns people have regarding holidays? What do people do to address those issues or concerns.
A: One of the biggest concerns is overdrinking when it comes to holidays. Drinking is fine if you drink moderately. However, people sometimes drink too much and get drunk. Bad things could happen when this happens. First, people could make embarrassing mistakes. They could also fall asleep at odd places. They could also cause trouble and noise. They could even get into fights. Worse things can happen when people get wasted. People could get into accidents. They could also get hurt or get injured. They could also lose something important. Plus, they could have a terrible hangover and get sick the next day. So, I think one of the biggest concerns is overdrinking. People should always drink in moderation when they get together for drinks.

A: Let me tell you about my parents. My mom and dad are similar in many ways. First, my parents are very family-oriented. They like to have family gatherings. They especially love to see their grandchildren. Plus, they are both very active, so they like to do outdoor activities. They like to go hiking, play golf or go on trips. On the other hand, my mom and dad are different in some ways. My mom likes animals, but my dad does NOT. Plus, my dad likes drinking, but my mom does NOT. My parents also have different tastes for food. My dad likes meat, but my mom does NOT. She likes to have seafood instead. So, my mom and dad have some similarities and some differences.

가족/친구02-Q160-친구/가족과 함께 하는 활동 및 이유: When you get together with friends or family, what kinds of things do you like to do together and why?

                });
                pendingComments = []; el = null;
                if (model.topics.some(t => t.name === topic.name)) model.errors.push(`${i + 1}줄: 주제 '${topic.name}'가 두 번 나옵니다`);
                model.topics.push(topic);
                continue;
            }
            if (!line.trim()) { el = null; continue; }
            if (line.trim().startsWith('#')) { pendingComments.push(line); el = null; continue; }

            if (line.startsWith('사슬:')) { topic.chain = line.slice(3).split('>').map(s => s.trim()).filter(Boolean); el = null; continue; }
            if (line.startsWith('콤보:')) { topic.combos.push(line.slice(3).split('/').map(s => s.trim()).filter(Boolean)); el = null; continue; }
            if (line.startsWith('- ')) {
                const name = line.slice(2).trim();
                el = { name, fields: [] };
                topic.elements[name] = el; topic.elOrder.push(name);
                continue;
            }
            const m = line.match(/^\s{2,}([^:]+):\s?(.*)$/);
            if (m && el) { el.fields.push([m[1].trim(), m[2].trim()]); continue; }
            model.errors.push(`${i + 1}줄을 해석하지 못했습니다: ${line.slice(0, 40)}`);
        }
        // 마지막 주제 뒤에 남은 주석은 그 주제에 붙여 둡니다
        if (pendingComments.length && topic) topic.post = pendingComments;

        // 검증: 콤보 요소가 사슬에 있는지, 사슬 요소에 블록이 없으면 빈 블록을 만듭니다
        model.topics.forEach(t => {
            t.combos.forEach(c => c.forEach(e => {
                if (!t.chain.includes(e)) model.errors.push(`${t.name}: 콤보 요소 '${e}'가 사슬에 없습니다`);
            }));
            t.chain.forEach(e => {
                if (!t.elements[e]) { t.elements[e] = { name: e, fields: [] }; t.elOrder.push(e); }
            });
        });
        return model;
    },

    serializeCombos(model) {
        const out = [...model.preamble];
        while (out.length && out[out.length - 1] === '') out.pop();
        model.topics.forEach(t => {
            out.push('');
            if (t.pre && t.pre.length) { t.pre.forEach(l => out.push(l)); out.push(''); }
            out.push('== ' + [t.name, ...t.fields.map(([k, v]) => `${k}: ${v}`)].join(' | '));
            out.push('사슬: ' + t.chain.join(' > '));
            t.combos.forEach(c => out.push('콤보: ' + c.join(' / ')));
            const blocks = t.elOrder.filter(n => t.elements[n] && t.elements[n].fields.length);
            if (blocks.length) {
                out.push('');
                blocks.forEach(n => {
                    out.push('- ' + n);
                    t.elements[n].fields.forEach(([k, v]) => out.push(`  ${k}:${v ? ' ' + v : ''}`));
                });
            }
            if (t.post && t.post.length) { out.push(''); t.post.forEach(l => out.push(l)); }
        });
        return out.join('\n') + '\n';
    },

    field(obj, key) { const f = obj.fields.find(([k]) => k === key); return f ? f[1] : ''; },
    setField(obj, key, value, afterKeys = []) {
        const f = obj.fields.find(([k]) => k === key);
        if (f) { f[1] = value; return; }
        if (!value) return;
        // 정해진 순서(유형, 답변, 위치, 기호, 신호, 장면, K, 메모)에 맞는 자리에 끼워 넣습니다
        let idx = obj.fields.length;
        for (const k of afterKeys) { const j = obj.fields.findIndex(([x]) => x === k); if (j > -1) idx = j + 1; }
        obj.fields.splice(Math.min(idx, obj.fields.length), 0, [key, value]);
    },

    // '답변: 일부 Q003' / 'Q010, Q011' / '없음' → { refs, partial }
    answerRefs(value) {
        const refs = (String(value || '').match(/Q\d{2,4}/g) || []);
        return { refs, partial: /일부/.test(value || ''), none: !refs.length };
    },

    // ---------------- 답변 스크립트 txt ----------------
    // 헤더는 반드시 '분류-Q번호-제목: 질문' 모양이어야 합니다 (본문 속 'xxx: yyy' 문장을 헤더로 오인하지 않게)
    HEADER_RE: /^(.+?)-(Q\d{2,4})-([^:]*):\s*(.*)$/,
    scripts(text) {
        const out = [];
        let cur = null, inAnswer = false;
        String(text || '').replace(/\r/g, '').split('\n').forEach(raw => {
            const line = raw.trim();
            if (!line) return;
            const lower = line.toLowerCase();
            if (lower.startsWith('a:') || lower.startsWith('answer:')) {
                if (cur) { inAnswer = true; cur.answer += (cur.answer ? '\n' : '') + line.slice(line.indexOf(':') + 1).trim(); }
                return;
            }
            if (lower.startsWith('k:') || lower.startsWith('keywords:')) {
                if (cur) { inAnswer = false; cur.keywords = line.slice(line.indexOf(':') + 1).trim(); }
                return;
            }
            const m = line.match(Parse.HEADER_RE);
            if (m) {
                if (cur) out.push(cur);
                cur = { uuid: U.uid(), key: m[2], category: m[1].trim(), id: m[2], title: m[3].trim(), question: m[4].trim(), answer: '', keywords: '' };
                inAnswer = false;
                return;
            }
            if (cur && inAnswer) cur.answer += (cur.answer ? '\n' : '') + line;
        });
        if (cur) out.push(cur);
        return out;
    },

    serializeScripts(scripts) {
        return scripts.map(s => `${s.category}-${s.id}-${s.title}: ${s.question}\nA: ${s.answer}\n${s.keywords ? 'K: ' + s.keywords + '\n' : ''}`).join('\n');
    },

    hasQuestion(s) { return !!(s && s.question && !/^(question\.?|q\.?)$/i.test(s.question.trim())); },
    scriptTopic(s) { return (s.category || '').replace(/\d+$/, '').trim(); },

    // ---------------- 표현 모음 ----------------
    expressions(text) {
        const out = []; let topic = '', group = '';
        String(text || '').replace(/\r/g, '').split('\n').forEach(line => {
            if (line.startsWith('== ')) { topic = line.slice(3).replace(/\s*\(.*$/, '').trim(); return; }
            const g = line.match(/^\s+\[(.+)\]\s*$/);
            if (g) { group = g[1]; return; }
            const m = line.match(/^\s+(.+?)\s+—\s+(.+)$/);
            if (m && topic) out.push({ key: `expr/${topic}/${m[1]}`, topic, group, en: m[1], ko: m[2] });
        });
        return out;
    },

    // ---------------- 문장 키워드 (키워드_문장.txt) ----------------
    // '== Q001' / '3: 키워드 | 키워드' (문장 번호) / '연결: A > B | 관계'  →  { Q001: { lines: { 3: [..] }, edges: [[A, B, 관계]] } }
    KW_RELS: ['이유', '결과', '대조', '구체화', '위치', '같은'],
    sentKeywords(text) {
        const out = {}; let cur = null;
        String(text || '').replace(/\r/g, '').split('\n').forEach(raw => {
            const line = raw.trim();
            if (!line || line.startsWith('#')) return;
            const h = line.match(/^== (Q\d{2,4})$/);
            if (h) { cur = out[h[1]] = { lines: {}, edges: [] }; return; }
            if (!cur) return;
            const e = line.match(/^연결:\s*(.+?)\s+>\s+(.+?)\s*\|\s*(\S+)$/);
            if (e) { if (Parse.KW_RELS.includes(e[3])) cur.edges.push([e[1].trim(), e[2].trim(), e[3]]); return; }
            const n = line.match(/^(\d+):\s*(.*)$/);
            if (n) cur.lines[Number(n[1])] = n[2].split('|').map(s => s.trim()).filter(Boolean);
        });
        return out;
    }
};

// =========================================================================
//  저장소
//  - Data: 내용 데이터(콤보, 답변 파일, 표현). localStorage + 클라우드 동기화 대상
//  - DB:   진도 데이터(카드, 녹음, 세션). IndexedDB, 기기별 저장
//  - SRS:  간격 반복 계산
// =========================================================================
const LS = {
    combos: 'opicTrainer.combosText', combosAt: 'opicTrainer.combosUpdatedAt', seedHash: 'opicTrainer.seedHash',
    files: 'opicTrainer.files', active: 'opicTrainer.activeFile',
    settings: 'opicTrainer.settings', syncId: 'opicTrainer.syncId'
};

// 문장 키워드: 키워드_문장.txt 의 문장 번호를 내장 답변의 문장 내용에 묶어 둡니다.
// 그래서 다른 답변 파일이라도 같은 문장이면 키워드가 보이고, 문장을 고치면 그 문장의 키워드만 빠집니다.
const Kw = {
    byId: new Map(),      // 'Q001' → { sent: Map(문장 → [키워드]), edges }
    any: new Map(),       // 문장 → [키워드] (번호가 다른 스크립트용)
    byAnswer: new Map(),  // 답변 전체 → 'Q001' (답변이 똑같은 Q002 등)

    norm(s) { return String(s || '').toLowerCase().replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/[—–]/g, '-').replace(/\s+/g, ' ').trim(); },

    init(seedScripts, text) {
        this.byId.clear(); this.any.clear(); this.byAnswer.clear();
        const blocks = Parse.sentKeywords(text);
        seedScripts.forEach(s => {
            const a = this.norm(s.answer);
            if (a && !this.byAnswer.has(a)) this.byAnswer.set(a, s.id);
            const b = blocks[s.id]; if (!b) return;
            const sents = U.sentences(s.answer), sent = new Map();
            Object.entries(b.lines).forEach(([n, kws]) => {
                const t = sents[n - 1]; if (!t) return;
                sent.set(this.norm(t), kws);
                if (!this.any.has(this.norm(t))) this.any.set(this.norm(t), kws);
            });
            this.byId.set(s.id, { sent, edges: b.edges });
            if (a && this.byAnswer.get(a) !== s.id && !blocks[this.byAnswer.get(a)]) this.byAnswer.set(a, s.id);
        });
    },

    // { sents: [{ text, kws }], edges: [[A, B, 관계]] } — 키워드는 지금 문장에 실제로 있는 것만
    forScript(s) {
        const block = this.byId.get(s.id) || this.byId.get(this.byAnswer.get(this.norm(s.answer)));
        const sents = U.sentences(s.answer).map(text => {
            const n = this.norm(text);
            const kws = ((block && block.sent.get(n)) || this.any.get(n) || []).filter(k => n.includes(this.norm(k)));
            return { text, kws };
        });
        const have = new Set(sents.flatMap(x => x.kws.map(k => this.norm(k))));
        const edges = block ? block.edges.filter(([a, b]) => have.has(this.norm(a)) && have.has(this.norm(b))) : [];
        return { sents, edges };
    }
};

const Data = {
    model: null, combosUpdatedAt: 0,
    files: [],            // [{ fileId, fileName, scripts, updatedAt, origin: 'builtin'|'local'|'cloud' }]
    cloudFiles: [],
    activeFileId: 'builtin',
    byKey: new Map(),     // 'Q001' → 스크립트 (훈련에 쓰는 답변 파일 기준)
    expressions: [],

    seed(id) { const el = document.getElementById(id); return el ? el.textContent : ''; },

    init() {
        const text = localStorage.getItem(LS.combos);
        this.combosUpdatedAt = U.lsGet(LS.combosAt, 0);
        // 내장본(빌드할 때 넣은 combos.txt)이 바뀌었는지 확인합니다
        const seedText = this.seed('seed-combos'), seedHash = U.hash(seedText), prevSeed = U.lsGet(LS.seedHash, null);
        this.seedChanged = false;
        if (prevSeed !== seedHash) {
            if (text !== null && text !== seedText) this.seedChanged = true;   // 앱에서 고친 내용이 있음 → 오늘 화면에서 물어봄
            else if (prevSeed) { this.combosUpdatedAt = Date.now(); U.lsSet(LS.combosAt, this.combosUpdatedAt); }   // 고친 것 없음 → 새 내장본이 클라우드의 옛것보다 앞서도록
            if (!this.seedChanged) U.lsSet(LS.seedHash, seedHash);
        }
        this.model = Parse.combos(text !== null && this.seedChanged ? text : (text !== null && prevSeed === seedHash ? text : seedText));

        const saved = U.lsGet(LS.files, null);
        if (Array.isArray(saved) && saved.length) {
            this.files = saved.filter(f => f.origin !== 'cloud');
        } else {
            this.files = [];
        }
        const seedScripts = Parse.scripts(this.seed('seed-answers'));
        const builtin = this.files.find(f => f.origin === 'builtin');
        if (!builtin) {
            this.files.unshift({ fileId: 'builtin', fileName: '일반_260727_1_edited.txt', scripts: seedScripts, updatedAt: 0, origin: 'builtin' });
        } else {
            // 예전에 저장된 내장본: 키워드(K)가 비어 있는 스크립트만 새 내장본의 키워드로 채웁니다
            const seedK = new Map(seedScripts.map(s => [s.id, s.keywords]));
            builtin.scripts.forEach(s => { if (!s.keywords && seedK.get(s.id)) s.keywords = seedK.get(s.id); });
        }
        Kw.init(seedScripts, this.seed('seed-keywords'));
        this.activeFileId = U.lsGet(LS.active, 'builtin');
        // 표현 모음도 combos.txt의 주제 순서로 정렬 (같은 주제 안에서는 원래 순서 유지)
        const rank = name => { const i = this.model.topics.findIndex(t => t.name === name); return i < 0 ? 999 : i; };
        this.expressions = Parse.expressions(this.seed('seed-expressions')).map((x, i) => ({ x, i }))
            .sort((a, b) => rank(a.x.topic) - rank(b.x.topic) || a.i - b.i).map(o => o.x);
        this.reindex();
    },

    allFiles() { return [...this.files, ...this.cloudFiles]; },
    file(id) { return this.allFiles().find(f => f.fileId === id); },
    activeFile() { return this.file(this.activeFileId) || this.files[0]; },

    reindex() {
        this.byKey = new Map();
        const f = this.activeFile();
        (f ? f.scripts : []).forEach(s => { if (s.key || s.id) this.byKey.set(s.key || s.id, s); });
    },

    saveFiles() {
        U.lsSet(LS.files, this.files);
        U.lsSet(LS.active, this.activeFileId);
    },

    setActiveFile(id) { this.activeFileId = id; this.saveFiles(); this.reindex(); },

    setCloudFiles(list) {
        this.cloudFiles = list.map(f => ({ ...f, origin: 'cloud', scripts: (f.scripts || []).map(s => ({ ...s, key: s.key || s.id })) }));
        this.reindex();
    },

    // 파일 하나가 바뀌었을 때: 로컬이면 저장, 클라우드면 업로드
    commitFile(file) {
        file.updatedAt = Date.now();
        if (file.origin === 'cloud') Sync.pushFile(file); else this.saveFiles();
        if (file.fileId === this.activeFileId) this.reindex();
    },

    // ---------------- 콤보 ----------------
    saveCombos(fromCloud = false, at = Date.now()) {
        const text = Parse.serializeCombos(this.model);
        localStorage.setItem(LS.combos, text);
        this.combosUpdatedAt = at; U.lsSet(LS.combosAt, at);
        if (!fromCloud) Sync.pushCombos(text, at);
        return text;
    },
    replaceCombosText(text, fromCloud = false, at = Date.now()) {
        const model = Parse.combos(text);
        if (!model.topics.length) return { ok: false, errors: ['주제(== 줄)를 찾지 못했습니다'] };
        this.model = model;
        this.saveCombos(fromCloud, at);
        return { ok: true, errors: model.errors };
    },
    combosText() { return Parse.serializeCombos(this.model); },
    // 새 내장본을 적용하거나(apply) 지금 것을 유지(keep)하고 안내를 닫습니다
    resolveSeed(apply) {
        if (apply) this.replaceCombosText(this.seed('seed-combos'));
        U.lsSet(LS.seedHash, U.hash(this.seed('seed-combos')));
        this.seedChanged = false;
    },

    topics(type) { return this.model.topics.filter(t => !type || this.topicType(t) === type); },
    topic(name) { return this.model.topics.find(t => t.name === name); },
    topicType(t) { return Parse.field(t, '유형') || '서베이'; },
    place(t) { return Parse.field(t, '장소') || '(장소 미정)'; },

    elKey(t, name) { return `el/${t.name}/${name}`; },
    stopKey(t) { return `stop/${t.name}`; },

    el(t, name) {
        const e = t.elements[name] || { name, fields: [] };
        const f = k => Parse.field(e, k);
        const answer = Parse.answerRefs(f('답변'));
        const idx = t.chain.indexOf(name);
        const locusRaw = f('위치');
        const lm = locusRaw.match(/^(\d+)\.\s*(.*)$/);
        return {
            topic: t, name, key: this.elKey(t, name), index: idx,
            type: f('유형'), answer, answerRaw: f('답변'),
            locusNo: lm ? Number(lm[1]) : idx + 1, locus: lm ? lm[2] : locusRaw,
            symbol: f('기호'), link: f('연결'), signal: f('신호'), scene: f('장면'), scene1: f('장면1'), scene2: f('장면2'),
            K: f('K'), memo: f('메모'), orig: f('원문'), level: f('난이도'),
            scripts: answer.refs.map(r => this.byKey.get(r)).filter(Boolean),
            adv1415: /1[45]번 출제/.test(f('메모'))
        };
    },

    // ---------------- 갈림길 트리 (콤보 줄에서 매번 계산, 따로 저장하지 않음) ----------------
    // as1: 3문항 콤보 첫 질문 → 둘째 후보 / as2: 둘째 질문 → 셋째 후보 / pair: 2문항(14·15번) 첫 질문 → 둘째
    // q3by: 둘째 질문의 셋째 후보가 첫 질문에 따라 달라지는 경우를 위한 상세 (첫|둘째 → 셋째 후보)
    tree(t) {
        const order = n => { const i = t.chain.indexOf(n); return i < 0 ? 999 : i; };
        const add = (m, k, v) => { if (!m.has(k)) m.set(k, new Set()); m.get(k).add(v); };
        const as1 = new Map(), as2 = new Map(), pair = new Map(), q3by = new Map();
        t.combos.forEach(c => {
            if (c.length === 3) { add(as1, c[0], c[1]); add(as2, c[1], c[2]); add(q3by, c[0] + '|' + c[1], c[2]); }
            else if (c.length === 2) add(pair, c[0], c[1]);
        });
        const sort = m => new Map([...m.entries()].sort((a, b) => order(a[0]) - order(b[0])).map(([k, v]) => [k, [...v].sort((a, b) => order(a) - order(b))]));
        return { as1: sort(as1), as2: sort(as2), pair: sort(pair), q3by: sort(q3by) };
    },

    // 노드가 맡는 역할들: [{ role: '1'|'2'|'p', next: [...] }]
    roles(t, name, tree = this.tree(t)) {
        const r = [];
        if (tree.as1.has(name)) r.push({ role: '1', next: tree.as1.get(name) });
        if (tree.as2.has(name)) r.push({ role: '2', next: tree.as2.get(name) });
        if (tree.pair.has(name)) r.push({ role: 'p', next: tree.pair.get(name) });
        return r;
    },
    roleLabel(role) { return { '1': '1번째', '2': '2번째', 'p': '14번' }[role]; },
    forkKey(t, role, name) { return `fork/${t.name}/${role}/${name}`; },

    // 갈림길 카드: 다음 질문이 있는 (노드, 역할) 하나가 카드 하나
    forks(t) {
        const tree = this.tree(t), out = [];
        t.chain.forEach(name => this.roles(t, name, tree).forEach(({ role, next }) => {
            const info = this.el(t, name);
            // 역할이 둘이고 다음 후보가 다르면 장면1/장면2, 아니면 장면
            const scene = (role === '1' && info.scene1) || (role === '2' && info.scene2) || info.scene || info.scene1 || info.scene2;
            const byFirst = role === '2' ? [...tree.q3by.entries()].filter(([k]) => k.split('|')[1] === name).map(([k, v]) => ({ first: k.split('|')[0], next: v })) : [];
            out.push({ key: this.forkKey(t, role, name), t, name, role, next, scene, info, byFirst: byFirst.length > 1 && new Set(byFirst.map(x => x.next.join())).size > 1 ? byFirst : [] });
        }));
        return out;
    },
    allForks(type) { return this.topics(type).flatMap(t => this.forks(t)); },

    // 1층 공통 규칙으로 본 다음 질문 종류 (콤보 113개 중 84/86이 이 순서를 지킴)
    ruleHint(type, role) {
        if (role === 'p') return '공통 규칙: 비교·변화 다음에는 이슈·우려·뉴스';
        if (role === '1') return '공통 규칙: 묘사 다음에는 루틴(평소 하는 일) 또는 과거·비교·경험';
        if (type === '루틴') return '공통 규칙: 루틴 다음에는 과거·비교 또는 경험';
        return '공통 규칙: 과거·비교 다음에는 경험(최근·기억·문제)';
    },

    // 질문 문장: 연결된 답변의 영어 질문 → 교재 원문 → 주제·요소 이름 순서로 고릅니다
    question(info) {
        const s = info.scripts.find(x => Parse.hasQuestion(x));
        const ko = info.orig ? info.orig.split('||')[0].trim() : (info.scripts[0] ? info.scripts[0].title : `${info.topic.name} · ${info.name}`);
        return { en: s ? s.question : '', ko };
    },

    updateEl(t, name, values) {
        const e = t.elements[name] || (t.elements[name] = { name, fields: [] });
        if (!t.elOrder.includes(name)) t.elOrder.push(name);
        const order = ['유형', '답변', '위치', '기호', '연결', '신호', '장면', '장면1', '장면2', 'K', '메모'];
        Object.entries(values).forEach(([k, v]) => {
            const before = order.slice(0, order.indexOf(k));
            Parse.setField(e, k, v, before);
        });
        this.saveCombos();
    },
    updateTopicField(t, key, value) { Parse.setField(t, key, value, ['유형']); this.saveCombos(); },

    // 질문 유형이 비어 있는 요소(대부분 돌발)는 원문 표현으로 추정합니다
    guessType(info) {
        if (info.type) return info.type;
        const s = (info.orig || '') + ' ' + info.name;
        if (/비교|변화|과거.?현재|달라/.test(s)) return '비교';
        if (/뉴스|이슈|우려|걱정|문제점|사건|추세|트렌드/.test(s)) return '이슈';
        if (/경험|기억|최근|처음|어릴|추억|에피소드|계기/.test(s)) return '경험';
        if (/루틴|습관|하는 ?일|평소|방법|사용/.test(s)) return '루틴';
        return '묘사';
    },

    rpScripts() {
        return [...this.byKey.values()].filter(s => /^RP/i.test(s.category));
    }
};

// ---------------- IndexedDB (실패하면 메모리로 동작) ----------------
const DB = {
    db: null, mem: { cards: new Map(), recordings: new Map(), sessions: new Map() }, seq: 1,
    STORES: ['cards', 'recordings', 'sessions'],
    async open() {
        try {
            this.db = await new Promise((res, rej) => {
                const r = indexedDB.open('opicTrainer', 1);
                r.onupgradeneeded = () => {
                    const d = r.result;
                    if (!d.objectStoreNames.contains('cards')) d.createObjectStore('cards', { keyPath: 'key' });
                    if (!d.objectStoreNames.contains('recordings')) d.createObjectStore('recordings', { keyPath: 'id', autoIncrement: true });
                    if (!d.objectStoreNames.contains('sessions')) d.createObjectStore('sessions', { keyPath: 'id', autoIncrement: true });
                };
                r.onsuccess = () => res(r.result);
                r.onerror = () => rej(r.error);
            });
        } catch (e) {
            console.warn('IndexedDB를 쓸 수 없어 메모리에 저장합니다 (새로고침하면 사라짐)', e);
            this.db = null;
        }
        return !!this.db;
    },
    _req(store, mode, fn) {
        return new Promise((res, rej) => {
            const tx = this.db.transaction(store, mode);
            const r = fn(tx.objectStore(store));
            tx.oncomplete = () => res(r ? r.result : undefined);
            tx.onerror = () => rej(tx.error);
        });
    },
    async put(store, val) {
        if (!this.db) {
            const kp = store === 'cards' ? 'key' : 'id';
            if (val[kp] === undefined) val[kp] = this.seq++;
            this.mem[store].set(val[kp], val); return val[kp];
        }
        return this._req(store, 'readwrite', s => s.put(val));
    },
    async get(store, key) {
        if (!this.db) return this.mem[store].get(key);
        return this._req(store, 'readonly', s => s.get(key));
    },
    async del(store, key) {
        if (!this.db) { this.mem[store].delete(key); return; }
        return this._req(store, 'readwrite', s => s.delete(key));
    },
    async all(store) {
        if (!this.db) return [...this.mem[store].values()];
        return this._req(store, 'readonly', s => s.getAll());
    },
    async clear(store) {
        if (!this.db) { this.mem[store].clear(); return; }
        return this._req(store, 'readwrite', s => s.clear());
    }
};

// ---------------- 간격 반복 ----------------
// 기억남: 레벨 +1 / 헷갈림: 내일 다시 / 모름: 오늘 다시. 레벨별 간격은 SRS_INTERVALS(1·2·4·7·14일)
const SRS = {
    cards: new Map(),
    async load() { (await DB.all('cards')).forEach(c => this.cards.set(c.key, c)); },
    get(k) { return this.cards.get(k); },
    status(k) {
        const c = this.cards.get(k);
        if (!c) return 'new';
        if (c.due <= U.today()) return 'due';
        return (c.streak || 0) >= 2 ? 'known' : 'learning';
    },
    mastered(k) { const c = this.cards.get(k); return !!(c && (c.streak || 0) >= 2); },
    async grade(k, g) {
        const today = U.today();
        const c = this.cards.get(k) || { key: k, level: 0, streak: 0, due: today, history: [] };
        if (g === 'good') { c.level = Math.min(c.level + 1, SRS_INTERVALS.length - 1); c.streak = (c.streak || 0) + 1; c.due = U.today(SRS_INTERVALS[c.level]); }
        else if (g === 'hard') { c.level = Math.max(1, c.level); c.streak = 0; c.due = U.today(1); }
        else { c.level = 0; c.streak = 0; c.due = today; }
        c.last = today;
        c.history = [...(c.history || []), { d: today, g }].slice(-30);
        this.cards.set(k, c);
        await DB.put('cards', c);
        return c;
    },
    dueKeys(keys) { const t = U.today(); return keys.filter(k => { const c = this.cards.get(k); return c && c.due <= t; }); },
    allDue() { const t = U.today(); return [...this.cards.values()].filter(c => c.due <= t).map(c => c.key); }
};

const Settings = {
    v: null,
    load() {
        this.v = Object.assign({ engine: 'edge', rate: '1', voices: {}, stage: 1, autoQuestion: true }, U.lsGet(LS.settings, {}));
        // 기존 앱에서 고른 엔진·성우를 이어받습니다
        if (!localStorage.getItem(LS.settings)) {
            const oldEngine = localStorage.getItem('scriptBrowserEngine');
            if (oldEngine) this.v.engine = oldEngine;
            ['edge', 'browser'].forEach(e => { const v = localStorage.getItem('scriptBrowserVoice_' + e); if (v) this.v.voices[e] = v; });
        }
        if (this.v.engine !== 'browser') this.v.engine = 'edge';   // 없어진 엔진(gemini 등)을 골라 뒀던 경우
    },
    save() { U.lsSet(LS.settings, this.v); },
    set(k, val) { this.v[k] = val; this.save(); }
};

// =========================================================================
//  TTS 매니저 (기존 스크립트 브라우저에서 이식)
//  - Edge 는 미리 만든 mp3(TtsStatic) → 실시간 Worker → 내장 음성 순서로 시도합니다.
//  - Edge 실시간 호출은 Cloudflare Worker(TTS_PROXY_URL)를 거칩니다.
//  - 엔진은 'edge' | 'browser' 두 가지입니다.
//  - 화면 요소에 직접 묶여 있던 부분만 콜백(ctx)으로 바꿨습니다.
//    ctx = { pickNext(mode) → {text,...}|null, onNext(item), onDone(), title, artist, onSkip(delta) }
// =========================================================================
const TTS = {
    audioEl: null,
    lastBlobUrl: null,
    currentUtterance: null,
    playToken: 0,
    session: 0,     // 정지하거나 다른 항목을 고르면 증가 -> 연속 재생 체인이 끊김
    cache: new Map(),
    plannedNext: null,
    liveDown: {},           // 엔진 → { until, err }: 실패한 실시간 엔진은 잠시 건너뜁니다
    fallbackWarned: false,
    wantPlaying: false,
    currentAdvance: null,
    ctx: null,
    state: 'idle',
    listeners: new Set(),

    on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
    emit(state) {
        this.state = state;
        this.listeners.forEach(fn => { try { fn(state); } catch (e) { console.error(e); } });
        const top = document.getElementById('ttsStopTop');
        if (top) top.classList.toggle('hidden', state === 'idle');
    },

    engine() { return Settings.v.engine || 'browser'; },

    // iOS/안드로이드는 사용자가 직접 누른 순간에만 소리를 낼 수 있습니다.
    // 오디오 엘리먼트 하나를 만들어 끝까지 재사용합니다. (중간에 새로 만들면 백그라운드에서 끊깁니다)
    unlock() {
        if (this.audioEl) return this.audioEl;
        const el = new Audio();
        el.preload = 'auto';
        el.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
        const p = el.play();
        if (p && p.then) p.then(() => { el.pause(); try { el.currentTime = 0; } catch (e) {} }).catch(() => {});
        this.audioEl = el;
        return el;
    },

    idle() {
        this.wantPlaying = false;
        this.emit('idle');
        if ('mediaSession' in navigator) { try { navigator.mediaSession.playbackState = 'paused'; } catch (e) {} }
        const ctx = this.ctx; this.ctx = null;
        if (ctx && ctx.onDone) ctx.onDone();
    },

    releaseBlob() {
        if (this.lastBlobUrl) { URL.revokeObjectURL(this.lastBlobUrl); this.lastBlobUrl = null; }
    },

    stop(isInternal = false) {
        this.playToken++;   // 진행 중이던 비동기 재생을 모두 무효화
        this.session++;     // 예약된 다음 항목 재생도 취소
        if (this.audioEl) {
            this.audioEl.onended = null;
            this.audioEl.onerror = null;
            try { this.audioEl.pause(); this.audioEl.currentTime = 0; } catch (e) {}
        }
        if (window.speechSynthesis) {
            if (window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();
        }
        this.currentUtterance = null;
        if (!isInternal) { this.plannedNext = null; this.currentAdvance = null; this.idle(); }
    },

    /** 앱으로 돌아왔을 때 백그라운드에서 멈춰 있었다면 알아서 이어서 재생합니다. */
    recover() {
        if (!this.wantPlaying) return;
        const el = this.audioEl;
        if (!el || !el.src) return;
        if (el.ended) { if (this.currentAdvance) this.currentAdvance(); }
        else if (el.paused) { el.play().catch(() => {}); }
    },

    // 안드로이드 잠금화면 제어: 크롬이 이 탭을 '미디어 재생 중'으로 인식해 백그라운드 정지가 줄어듭니다
    updateMediaSession() {
        if (!('mediaSession' in navigator)) return;
        const ctx = this.ctx || {};
        try {
            if (window.MediaMetadata) {
                navigator.mediaSession.metadata = new MediaMetadata({ title: ctx.title || 'OPIc 트레이너', artist: ctx.artist || '', album: 'OPIc 트레이너' });
            }
            navigator.mediaSession.playbackState = 'playing';
            const bind = (action, fn) => { try { navigator.mediaSession.setActionHandler(action, fn); } catch (e) {} };
            bind('pause', () => this.stop(false));
            bind('stop', () => this.stop(false));
            bind('nexttrack', ctx.onSkip ? () => ctx.onSkip(1) : null);
            bind('previoustrack', ctx.onSkip ? () => ctx.onSkip(-1) : null);
        } catch (e) {}
    },

    // ---------------- 오디오 받아오기 (캐시 + 미리 받기) ----------------
    cacheKey(text, engine) { return `${engine}|${currentVoice(engine)}|${Settings.v.rate}|${text}`; },

    async fetchAudioBlob(text, engine) {
        if (!TTS_PROXY_URL) throw new Error("TTS_PROXY_URL에 Cloudflare Worker 주소를 넣어주세요.");
        const headers = { "Content-Type": "application/json" };
        if (TTS_PROXY_TOKEN) headers["X-Auth-Token"] = TTS_PROXY_TOKEN;

        const res = await fetchWithTimeout(TTS_PROXY_URL + "/tts", {
            method: "POST", headers,
            body: JSON.stringify({ text, voice: currentVoice('edge'), rate: edgeRateString(), pitch: EDGE_PITCH, gapMs: CHAIN_GAP_MS })
        });
        if (!res.ok) {
            let msg = "HTTP " + res.status;
            try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (e) {}
            throw Object.assign(new Error(msg), { http: res.status });
        }
        const blob = await res.blob();
        if (!blob || blob.size < 100) throw new Error("빈 오디오 응답");
        return blob;
    },

    // 실시간 엔진에서 받아옵니다. 네트워크 오류·시간 초과만 한 번 더 시도하고(서버가 거절한 건 다시 해도 같음),
    // 실패하면 3분 동안은 바로 실패로 처리해 매번 몇 초씩 기다리지 않게 합니다.
    async getAudio(text, engine) {
        const key = this.cacheKey(text, engine);
        if (this.cache.has(key)) return this.cache.get(key);
        const down = this.liveDown[engine];
        if (down && Date.now() < down.until) throw down.err;
        let blob;
        try {
            try { blob = await this.fetchAudioBlob(text, engine); }
            catch (e) { if (e.http) throw e; blob = await this.fetchAudioBlob(text, engine); }
        } catch (e) {
            this.liveDown[engine] = { until: Date.now() + 3 * 60 * 1000, err: e };
            throw e;
        }
        delete this.liveDown[engine];
        this.cache.set(key, blob);
        while (this.cache.size > 8) this.cache.delete(this.cache.keys().next().value);
        return blob;
    },

    // 고른 엔진으로 받을 수 있는 오디오: Edge 는 미리 만든 mp3가 먼저입니다 → { blob, rate } | null(미리 만든 것 없음)
    async getStatic(text, engine) {
        if (engine !== 'edge') return null;
        const blob = await TtsStatic.audio(text, currentVoice('edge')).catch(e => { console.warn('미리 만든 음성 실패', e); return null; });
        return blob ? { blob, rate: parseFloat(Settings.v.rate) || 1 } : null;
    },

    prefetch(text, engine) {
        if (!text || !text.trim()) return;
        if (engine !== 'edge') return;
        this.getStatic(text, engine).then(hit => {
            if (!hit && !this.cache.has(this.cacheKey(text, engine))) this.getAudio(text, engine).catch(() => {});
        });
    },

    // ---------------- 재생 ----------------
    // 한 번 읽고 끝나면 resolve 됩니다 (정지해도 resolve)
    say(text, ctx = {}) {
        return new Promise(res => this.play(text, 'once', { ...ctx, onDone: () => { if (ctx.onDone) ctx.onDone(); res(); } }));
    },

    play(text, mode = 'once', ctx = {}) {
        this.unlock();
        this.stop(true);
        if (this.ctx && this.ctx !== ctx && this.ctx.onDone) { const old = this.ctx; this.ctx = null; old.onDone(); }
        this.ctx = ctx;
        this.playWithMode(text, mode, this.engine());
    },

    async playWithMode(text, mode, engine, skips = 0) {
        this.stop(true);
        const ctx = this.ctx || {};
        const chaining = (mode === 'continuous' || mode === 'range' || mode === 'random');

        this.plannedNext = (chaining && ctx.pickNext) ? ctx.pickNext(mode) : null;

        if (!text || !text.trim()) {
            if (!chaining || skips > 30 || !this.plannedNext) { this.idle(); return; }
            const nxt = this.plannedNext;
            if (ctx.onNext) ctx.onNext(nxt);
            const s0 = this.session;
            setTimeout(() => { if (s0 === this.session) this.playWithMode(nxt.text, mode, engine, skips + 1); }, 200);
            return;
        }

        const token = this.playToken;
        this.emit('loading');

        const advance = () => {
            if (token !== this.playToken) return;
            if (mode === 'once') { this.idle(); return; }
            if (mode === 'repeat') {
                const s0 = this.session;
                const again = () => { if (s0 === this.session) this.playWithMode(text, mode, engine); };
                if (engine === 'browser') setTimeout(again, 600); else again();
                return;
            }
            const next = this.plannedNext;
            if (!next) { this.idle(); return; }
            if (ctx.onNext) ctx.onNext(next);
            const s0 = this.session;
            const go = () => { if (s0 === this.session) this.playWithMode(next.text, mode, engine); };
            // 내장 음성만 타이머가 필요합니다. Edge는 쉼이 오디오 안에 들어있어 곧바로 이어 붙입니다.
            if (engine === 'browser') setTimeout(go, 600); else go();
        };

        if (engine === 'browser') { this.playBrowser(text, token, advance); return; }
        await this.playRemote(text, token, engine, chaining, advance);
    },

    async playRemote(text, token, engine, chaining, advance) {
        let audio = await this.getStatic(text, engine);
        if (token !== this.playToken) return;
        if (!audio) {
            try {
                audio = { blob: await this.getAudio(text, engine), rate: 1 };   // 실시간 엔진은 속도가 오디오에 들어있음
            } catch (err) {
                if (token !== this.playToken) return;
                console.error("TTS Error:", err);
                if (!this.fallbackWarned) {
                    this.fallbackWarned = true;
                    UI.toast(`Edge 음성을 받지 못해 내장 음성으로 읽습니다 (${err.message})`);
                }
                this.playBrowser(text, token, advance);
                return;
            }
            if (token !== this.playToken) return;
        }

        const el = this.unlock();
        this.releaseBlob();
        const url = URL.createObjectURL(audio.blob);
        this.lastBlobUrl = url;
        // src 를 바꾸면 playbackRate 가 defaultPlaybackRate 로 돌아가므로 둘 다 맞춥니다 (음높이는 유지)
        el.defaultPlaybackRate = el.playbackRate = audio.rate;
        el.preservesPitch = true;

        this.wantPlaying = true;
        this.currentAdvance = advance;
        el.onended = () => { if (token === this.playToken) advance(); };
        el.onerror = () => {
            if (token !== this.playToken) return;
            if (chaining && this.plannedNext) advance(); else this.stop(false);
        };
        el.src = url;

        try {
            await el.play();
        } catch (e) {
            if (token !== this.playToken) return;
            UI.toast("재생이 차단되었습니다. 재생 버튼을 한 번 더 눌러주세요.");
            this.stop(false);
            return;
        }
        if (token !== this.playToken) return;

        this.emit('playing');
        this.updateMediaSession();
        if (this.plannedNext) this.prefetch(this.plannedNext.text, engine);
    },

    playBrowser(text, token, advance) {
        if (!window.speechSynthesis) {
            UI.toast("이 기기에서는 내장 음성 기능을 지원하지 않습니다.");
            this.stop(false); return;
        }
        // 크롬은 긴 문장 하나를 통째로 넘기면 15초쯤에서 끊깁니다. 문장 단위로 잘라 차례대로 읽습니다.
        const chunks = U.sentences(text).reduce((acc, s) => {
            if (acc.length && (acc[acc.length - 1] + " " + s).length < 200) acc[acc.length - 1] += " " + s;
            else acc.push(s);
            return acc;
        }, []);
        const voices = window.speechSynthesis.getVoices() || [];
        const wanted = currentVoice('browser');
        const voice = voices.find(v => v.voiceURI === wanted) || pickBestEnglishVoice(voices);
        const rate = parseFloat(Settings.v.rate) || 1;

        const speakAt = (i) => {
            if (token !== this.playToken) return;
            if (i >= chunks.length) { advance(); return; }
            const u = new SpeechSynthesisUtterance(chunks[i]);
            this.currentUtterance = u;   // 크롬 GC 버그 방지
            u.lang = (voice && voice.lang) || 'en-US';
            if (voice) u.voice = voice;
            u.rate = rate;
            u.onstart = () => {
                if (token !== this.playToken) return;
                this.emit('playing');
                if (i === 0) this.updateMediaSession();
            };
            u.onend = () => { if (token === this.playToken) speakAt(i + 1); };
            u.onerror = (e) => {
                if (e.error === 'interrupted' || e.error === 'canceled') return;
                console.error("내장 음성 에러:", e);
                if (token === this.playToken) speakAt(i + 1);
            };
            window.speechSynthesis.speak(u);
        };
        if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        this.wantPlaying = true;
        this.currentAdvance = advance;
        speakAt(0);
    }
};

// 같은 이름이라도 기기마다 품질 차이가 큽니다. Natural / Online / Neural 이 붙은 것이 신경망 음성입니다.
function voiceScore(v) {
    const n = (v.name || "") + " " + (v.voiceURI || "");
    let s = 0;
    if (/Natural|Neural|Online/i.test(n)) s += 100;
    if (/Google/i.test(n)) s += 40;
    if (/Siri|Premium|Enhanced/i.test(n)) s += 60;
    if (/Microsoft/i.test(n)) s += 20;
    if (v.lang === 'en-US' || v.lang === 'en_US') s += 10;
    if (/Aria|Jenny|Emma|Ava|Samantha/i.test(n)) s += 5;
    return s;
}
function pickBestEnglishVoice(voices) {
    const eng = voices.filter(v => (v.lang || "").toLowerCase().startsWith('en'));
    if (!eng.length) return null;
    return eng.sort((a, b) => voiceScore(b) - voiceScore(a))[0];
}
function currentVoice(engine) {
    const saved = Settings.v.voices[engine];
    if (saved) return saved;
    if (engine === 'edge') return EDGE_VOICES[0].id;
    return "";
}
function edgeRateString() {
    const r = parseFloat(Settings.v.rate) || 1;
    const pct = Math.round((r - 1) * 100);
    return (pct >= 0 ? '+' : '') + pct + '%';
}
function fetchWithTimeout(url, opts = {}, ms = TTS_LIVE_TIMEOUT_MS) {
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), ms);
    return fetch(url, { ...opts, signal: ac.signal })
